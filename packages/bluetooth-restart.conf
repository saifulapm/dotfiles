# Installed by ~/.dotfiles — see home/.chezmoiscripts/run_after_30-bluetooth-restart.sh.tmpl.
#
# Fedora ships bluetooth.service with no Restart= at all, so a single crash
# leaves BlueZ off the bus until someone notices and restarts it by hand. The
# only visible symptom is the bar's Bluetooth widget quietly disappearing —
# Modules/Bar/widgets/BluetoothWidget.qml binds `visible: adapter !== null` to
# Bluetooth.defaultAdapter, so no bluetoothd means no adapter means no widget,
# which reads as "the widget broke" rather than "the daemon is dead".
#
# It does crash here. Three SIGSEGVs on 2026-08-10, each in the same place and
# each in the same SECOND as a wireplumber death:
#   queue_remove <- media_endpoint_remove <- a2dp_unregister_sep
#   <- transport_a2dp_suspend <- service_filter <- dbus_connection_dispatch
# WirePlumber owns the A2DP media endpoints, so when it is SIGKILLed mid
# transport BlueZ's D-Bus name-owner filter tears down endpoints belonging to a
# client that has already gone and walks freed memory. That is upstream's bug;
# this file only ensures the machine comes back from it.
#
# Deliberately NOT touching StartLimitBurst: the systemd default (5 starts in
# 10 s) is the wanted behaviour, since a genuine boot-time crash loop should
# stop and stay stopped rather than respawn forever.
[Service]
Restart=on-failure
RestartSec=2s
