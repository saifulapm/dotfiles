# Installed by ~/.dotfiles — see home/.chezmoiscripts/run_after_47-wifi-powersave.sh.tmpl.
#
# Wi-Fi and Bluetooth are the same piece of silicon on this machine, and Wi-Fi
# power save is what makes Bluetooth audio stutter:
#
#   01:00.0  BCM4388 802.11ax Dual Band Wireless LAN Controller
#   01:00.1  BCM4388 Bluetooth Controller
#
# One die, two PCI functions, one antenna path arbitrated by time-domain coex
# in firmware. With power save on, the Wi-Fi side dozes and then drains its
# buffered frames in a burst at every DTIM wake, and each burst takes airtime
# the BT scheduler was going to use. A2DP has no slack to give it back from:
# the symptom is playback cutting out for a few milliseconds on a roughly
# fixed cadence, which is the wake cycle showing through rather than anything
# wrong in the audio stack (diagnosed 2026-08-26 against a HAVIT LITE NC01H,
# with the radio on 5 GHz ch157 @ 80 MHz — being off 2.4 GHz does not help,
# because the contention here is for the shared front end and not for the
# band).
#
# Everything local was ruled out before touching the radio. pw-top held ERR=0
# on bluez_output.67_6D_E6_03_06_ED right through the dropouts, rtkit was up
# and the portal was serving RTTimeUSecMax=200000, and data-loop.0 had its
# SCHED_RR priority 20 — so this is emphatically NOT a return of the module-rt
# starvation that wireplumber.conf.d/bluetooth-a2dp-autoconnect.conf documents
# at length. The link itself is where it fails, and once in that session it
# failed hard rather than briefly:
#
#   spa.bluez5: Failure in Bluetooth audio transport .../dev_67_6D_E6_03_06_ED/fd0
#   pw.node: (bluez_output.67_6D_E6_03_06_ED.1-91) running -> error
#
# DO NOT "fix" the codec here. SBC-XQ was tried on the Havit and made things
# strictly worse, which is worth writing down because the reasoning that led
# there is seductive and wrong.
#
# The argument was: AAC negotiates at 131 kbps VBR (the cap in the headset's
# own capability blob), is software-encoded, and has no packet-loss
# concealment, so it should gap on exactly the brief losses SBC-XQ rides
# through. All true, and all beside the point. SBC-XQ runs ~450-550 kbps —
# roughly 4x the packet rate through a controller that cannot keep its flow
# control straight under load:
#
#   spa.bluez5.sink.media: Missing completion reports for packet (0 suppressed):
#                          Bluetooth adapter firmware bug?
#
# That is the BCM4388 failing to return HCI Number-Of-Completed-Packets for
# ACL packets it has already sent. PipeWire sizes its writes against those
# reports, so when they go missing it stops sending — it still believes the
# controller's buffer is full. The audible result is a hard ~1 s pause, then
# the link gives up and bluetoothd's policy plugin reconnects
# (avdtp_connect_cb -> reconnect_timeout -> a fresh fd), which tears the card
# down and rebuilds it with new object IDs.
#
# The evidence is unambiguous: that message appears exactly 8 times in one
# second at 13:40:16 and NOWHERE else in a boot that had been up since 11:38 —
# eleven minutes after the switch to SBC-XQ, and never once during the two
# hours of AAC before it. Reverted; the pauses stopped (2026-08-26).
#
# So the Havit stays on plain a2dp-sink (AAC). Trading a codec that gaps for
# milliseconds against one that stalls the controller for a full second is a
# bad trade, and packet rate matters more than loss tolerance on this adapter.
# Nothing pins it in config — WirePlumber persists the chosen card profile to
# ~/.local/state/wireplumber/default-profile and reapplies it on reconnect —
# which is also why a per-device choice was right either way: the AirPods want
# AAC and restricting bluez5.codecs globally would have taken it from them.
#
# 2 is "disable", not "use whatever the default is" — NM reads 0 as unset, 1
# as ignore (keep whatever the driver came up with), 2 as disable, 3 as
# enable. The connection profile for eCommerceStaff was on `default`, which
# resolved to power save on.
#
# Set under [connection] so it covers every Wi-Fi profile, present and future:
# the chip does not care which SSID it is talking to, so scoping this to one
# network would just mean rediscovering the same stutter on the next one.
#
# The usual objection does not apply here. Mac14,12 is a Mac mini — desktop
# chassis, no entry under /sys/class/power_supply that is a battery — so the
# radio staying awake between beacons costs nothing worth having.
[connection]
wifi.powersave = 2
