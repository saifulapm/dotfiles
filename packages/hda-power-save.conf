# Installed by ~/.dotfiles — see home/.chezmoiscripts/run_after_33-hda-power-save.sh.tmpl.
#
# Fedora's default is power_save=1 with power_save_controller=Y, so both HDA
# codecs runtime-suspend to D3 after 1 s idle (autosuspend_delay_ms=1000) and
# the controller at 00:1f.3 follows them down. Nothing here wants that: this is
# a mains-powered NUC13ANKH5 and the saving is a fraction of a watt.
#
# What it costs instead: pausing mpv for more than a few seconds can silence
# playback on resume. WirePlumber's node/suspend-node.lua closes an idle sink
# after session.suspend-timeout-seconds (default 5), the ALSA PCM goes to
# `closed`, and ~1 s later the codecs and then the controller drop to D3 —
# measured across a real pause, not assumed. Unpausing has to bring that whole
# chain back: PCI D0 -> controller re-init -> codec D0 -> i915 audio power well
# -> DisplayPort pin and converter reprogram -> ELD re-read. The monitor is on
# DP (eld#2.20: connection_type DisplayPort, pin 0xc, converter 0x3), which is
# the fragile end of it — the display power well and the link have to come
# back, not just a codec. When a step loses that race the DMA runs and the
# hardware stays silent, which is why the symptom is intermittent rather than
# reliable: six scripted pause/resume cycles all came back clean. It is also
# why muting and unmuting from the bar's audio panel sometimes clears it and
# sometimes does not — writing the mixer forces a codec resume and a route
# re-apply out of band, which helps only if the codec was still asleep
# (root-caused 2026-08-12).
#
# power_save=0 does NOT cover every codec, and the one it misses is the one that
# matters. It pins hdaudioC0D0 (the ALC256) at power/control=on, and it keeps the
# controller at 00:1f.3 up as a side effect, because the controller only
# runtime-suspends once every codec has idled. But hdaudioC0D2 ("Raptor Lake P
# HDMI") — the codec actually driving the monitor — is i915-bound display audio:
# it manages its own runtime PM because it has to release the display power well,
# and keeps control=auto with a driver-managed 3000 ms delay regardless of this
# param. Measured 2026-09-04 against an idle sink: C0D0=active, 00:1f.3=active,
# C0D2=suspended. (An earlier version of this comment claimed power_save=0 "on
# its own is enough" and contradicted the wireplumber conf that shipped with it;
# the wireplumber side was the correct one.)
#
# The other end of the same chain — session.suspend-timeout-seconds = 0 on the
# ALSA sink, so WirePlumber never closes the PCM — WAS taken, in this file's own
# commit, and had to be reverted on 2026-09-04. Holding the PCM open feeds the
# M32UC unbroken digital silence for as long as mpv stays paused, and this
# monitor mutes its own speaker amp after a stretch of that. Nothing un-mutes it
# but a stream that stops and starts again — which a PCM that never closes can
# never do. So the workaround did not trade an intermittent failure for a clean
# one, it traded it for a permanent one: sound was gone until something forced
# the device closed, and no amount of pausing or unpausing brought it back.
# Measured both ways — a tone played into the still-running PCM was silent, the
# same tone after forcing the PCM closed and open again was audible.
#
# Letting the sink suspend normally is therefore load-bearing here, not merely
# harmless. If intermittent resume-silence ever returns, the lever to reach for
# is pinning C0D2 itself (power/control=on via a udev rule) — NOT no-suspend,
# which is now known to break this monitor a different and worse way.
options snd_hda_intel power_save=0
