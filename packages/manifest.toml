# Removed 2026-08-06 by user decision, together: fuzzel and cliphist, plus the
# nanosvg dependency dnf then had no use for — 3 packages, 3 MiB. Both were
# scaffolding the shell had already replaced and both had been marked SUPERSEDED
# here for a while, pending exactly this call:
#
#   * fuzzel was the interim launcher and a theme fan-out target. Modules/Launcher
#     replaced it, niri's Mod+D has pointed at `qs ipc call launcher toggle` since
#     then, and templates/fuzzel.ini.tmpl is deleted with this commit.
#   * cliphist was the clipboard history. Modules/Clipboard + bin/clipboard-capture
#     own the store (~/.local/state/qshell/clipboard) and nothing in the repo has
#     called cliphist since. wl-clipboard stays — it is what our own capture and
#     the pickers use.

# Removed 2026-08-06 by user decision ("I no need bangla input"): fcitx5,
