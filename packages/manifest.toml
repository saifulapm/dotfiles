why  = "Push-to-talk voice-to-text; what the bar's dictation indicator follows and what Mod+Ctrl+X / F9 drive"

# Notes on the voxtype entry above (v0.7.5, hand-installed on the M2
# 2026-08-06, scripted for every machine 2026-08-11):
#
#   * Fedora does not package it — `dnf search voxtype` finds nothing — so it
#     is a single user-local binary: an 11 MB stripped aarch64 ELF in
#     ~/.local/bin, no rpm, no dnf update path. `voxtype check-update` is the
#     only upgrade channel.
#   * SCRIPTED SINCE 2026-08-11, and the NUC is why: it had never had the hand
#     download, so every apply there printed the "voxtype not installed" nag
#     and dictation stayed inert. The old note here (and in 04-agent-clis) read
#     the missing voxtype.io/install.sh — a 404, rechecked 2026-08-11 — as "no
#     scriptable install", but upstream publishes bare per-arch release
#     binaries the same way satty does; there is just no tarball and no
#     installer. run_after_01-voxtype.sh downloads the asset for the machine,
#     checks it against upstream's SHA256SUMS.txt, pulls the model and writes
#     the unit — guarded per step, so it no-ops on a machine that already has
#     them and never overwrites a binary on disk.
#     Version PINNED at v0.7.5 rather than resolved through the GitHub API
#     like run_after_10's tools: v1.0.0-rc1 (2026-06-04) is the "latest"
#     release and ships macos-universal ONLY, no linux asset at all, so a
#     latest-resolving fetch would install nothing. Recheck when a 1.0 with
#     linux binaries lands.
#     Asset choice is per CPU, not just per arch: upstream builds whisper.cpp
#     per feature level and ships no baseline x86_64 binary, so the script
#     picks x86_64-avx512 / x86_64-avx2 from /proc/cpuinfo and warns (rather
#     than installing a SIGILL) on a pre-AVX2 box. aarch64 has one CPU build.
#     The -onnx assets are deliberately not used — that swaps the engine to
#     Parakeet, a model decision rather than a packaging one.
#   * `voxtype setup --download --model X` REWRITES config.toml's model= as
#     part of downloading (verified 2026-08-11), so the script guards on the
#     model FILE being absent, not on `setup check`. A machine where the model
#     was switched by hand keeps that choice across applies.
#   * `voxtype info variants` reports AVX2=false and no GPU on this Mac, so
#     transcription is plain CPU whisper.cpp. The model itself
#     (~/.local/share/voxtype/models/ggml-small.en.bin, 466 MB) is downloaded,
#     not in this repo. It also reports "Install kind: source", and therefore
#     "variant switching not applicable" — so `voxtype setup onnx --enable`
#     cannot reach the ONNX engine on this binary and the Parakeet models
#     (parakeet-tdt-0.6b-v3, better WER than whisper at 0.6B) are unavailable
#     without a Cargo rebuild. Whisper is the only engine here.
#   * MODEL CHOICE: small.en, upgraded from base.en 2026-08-08. Benchmarked on
#     the M2 against three Kokoro-synthesised sentences (identical audio for
#     both models, 2 runs each, ~6 s utterances):
#       base.en    1.30 s/utterance   330 MB peak RSS
#       small.en   4.52 s/utterance   770 MB peak RSS
#     so it is ~3.5x SLOWER for the accuracy. The accuracy is real but narrow:
#     both models transcribe plain English perfectly, and both render dates and
#     numbers identically ("March 15th", "9.30", "17"). The whole difference is
#     technical proper nouns, which is most of what gets dictated here —
#     base.en wrote "restot Postger SQL" where small.en wrote "restock
#     PostgreSQL". Thread tuning does NOT recover the latency: 4 threads 4.52 s,
#     6 threads 4.19 s, 8 threads 4.78 s. 8 is worse than 4 because the M2 is
#     4 P-cores + 4 E-cores and whisper.cpp splits work evenly across them, so
#     the E-cores set the pace; the default (commented `threads`, auto) is left
#     alone as a result.
#   * COST, and why the daemon is now ON DEMAND: it PRELOADS the model at
#     startup ("Model loaded, ready for voice input") rather than loading it
#     per utterance, so a running daemon costs the whole model resident.
#     Measured idle VmRSS on a fresh restart: base.en 162 MB (151 anon),
#     small.en 486 MB (475 anon). That made voxtype the single largest process
#     on this 7.3 GB laptop while doing nothing. CPU was never the issue — the
#     idle daemon used 0.000 s over a 5 s sample and 0.41 s across its entire
#     uptime, all of it the startup load.
#     So voxtype.service is `systemctl --user disable`d (nothing starts it at
#     login) and bin/voxtype-toggle starts it on the keybind instead, with
#     voxtype-idle-stop.timer stopping it after ~10 min idle — the same
#     arrangement as this machine's on-demand database containers. Measured
#     wrapper latency: 0.23 s cold (daemon down), 0.01 s warm. Full reasoning
#     lives in bin/voxtype-toggle; the guard logic is in bin/voxtype-idle-stop
#     and was tested against all four states (refuses to stop while recording
#     or transcribing, refuses on young idle, stops on aged idle, no-ops with
#     no daemon).
#     Worth knowing before undoing this: the memory is ordinary anonymous
#     memory and therefore swappable, not pinned — a daemon left idle for hours
#     was observed at 4.8 MB VmRSS with the model entirely paged out and still
#     working, so the kernel already reclaimed it under pressure. On-demand is
#     the deterministic version of that, not the only thing standing between
#     this machine and an OOM. See bin/mem-pressure-warn for the tiers.
#     Revert the MODEL (independent of the above) with
#     `voxtype setup model --set base.en --restart`; base.en is still on disk.
#   * `[whisper] eager_processing = true` (with eager_chunk_secs/overlap) is
#     the untried mitigation for the latency above: it transcribes chunks while
#     recording is still running, so most of small.en's 4.5 s would overlap
#     with speaking. Not enabled — the model bump was the only change asked
#     for, and eager processing changes transcription semantics (chunk
#     boundaries) rather than just performance.
#   * `voxtype setup systemd` writes ~/.config/systemd/user/voxtype.service,
#     which is NOT chezmoi-managed (unlike taildrop-receive.service) — a
#     restore has to re-run that command, which is now what
#     run_after_01-voxtype.sh does, guarded on the unit file being absent.
#     That command also ENABLES the unit (symlink into
#     graphical-session.target.wants) and STARTS the daemon — measured
#     2026-08-11 by running it against a throwaway XDG_CONFIG_HOME, which
#     still enabled and started the REAL unit because systemctl reads the real
#     paths. So 01 disables and stops it immediately afterwards, in the one
#     window where the daemon is known to be the one that command just started
#     (that branch only runs when the machine had no unit at all). It is then
#     left DISABLED on purpose
#     (see the on-demand note above), and BOTH halves of that are automated in
#     run_after_02-user-timers.sh: it enables voxtype-idle-stop.timer with the
#     other user units and disables voxtype.service in a guarded block at the
#     end. Nothing here is a manual post-restore step.
#     Being in that script rather than run once by hand is load-bearing, not
#     tidiness: the script re-runs on EVERY apply, so anything that re-enables
#     voxtype.service behind our back gets corrected at the next apply instead
#     of silently restoring the always-on 486 MB daemon. That is not
#     hypothetical — the unit was observed flipping back to `enabled` on
#     2026-08-08 within two minutes of being disabled by hand, with no enable
#     event in the journal and the unit file's mtime untouched. SOLVED
#     (audit 2026-08-08): the culprit was run_after_04-agent-clis.sh itself,
#     whose voxtype block ran `enable --now` whenever the unit was not
#     enabled — chezmoi runs run_after scripts in lexical order, so 04
#     re-enabled what 02 had just disabled on every apply. That block is now
#     removed; 02 alone owns the unit state, and the apply-time disable
#     remains as the backstop against any future flipper.
#     Guarded on the unit existing, because 01's install can legitimately fail
#     (no upstream build for the arch, flaky network) and leave the machine
#     without one. Disable only, never stop: the
#     idle timer is what stops a running daemon, and unlike a blind `stop` it
#     checks state first and will not cut off a dictation in progress.
#   * The daemon publishes its state to $XDG_RUNTIME_DIR/voxtype/state, which
#     is what `voxtype status --follow` streams and therefore what
#     bin/voxtype-status and the bar's dictation indicator read. Because the
#     state is a file rather than a connection, the follower survives a daemon
#     restart (verified) and a daemon STOP: voxtype removes the file and the
#     follower reports "stopped", which DictationService.qml already models.
#     The bar looks no different for it — Dictation.qml is only `active` while
#     recording or transcribing, so stopped and idle render identically.
#     That file's mtime is also what bin/voxtype-idle-stop ages: the daemon
#     rewrites it on every transition, so "idle" plus mtime age is exactly
#     "idle for N seconds", and no separate bookkeeping is needed.
#   * voxtype's own evdev hotkey ([hotkey] key = SCROLLLOCK) needs the user in
#     the `input` group and is inert here; the niri binds (Mod+Ctrl+X, F9 →
#     bin/voxtype-toggle) are what drive it instead, which is upstream's
#     documented compositor-keybinding mode. They spawn the wrapper rather than
#     `voxtype record toggle` because that subcommand does NOT start a stopped
#     daemon — it fails with "Voxtype daemon is not running". Socket activation
#     (the mysql/postgres/redis pattern here) is impossible for the same
#     reason it needs a wrapper at all: record start/stop is SIGUSR1/SIGUSR2 to
#     the pidfile, not a connection, and the binary has no LISTEN_FDS support.

