# Removed 2026-08-06 by user decision ("I no need bangla input"): fcitx5,
# fcitx5-m17n and m17n-db, plus the fcitx5-data/fcitx5-libs/m17n-lib/xcb-imdkit
# dependencies dnf then had no use for — 8 packages, 22 MiB. They had been
