[[tool]]
name = "dev-services"
via  = "run_after_16-dev-services.sh — podman quadlets (~/.config/containers/systemd) + systemd-socket-proxyd pairs: mysql:8.4@3306, postgres:18@5432, redis:7@6379, mailpit@1025+8025 (container backend = standard port + 30000). Clients: usql and lazysql reach mysql/postgres from the host; bin/redis-cli wraps the official client out of the redis:7-alpine image already on disk"
why  = "Herd/DBngin replacement that never idles (user constraint 2026-08-07: no always-on DBs): the socket holds the port at ~0 RAM, the first connection starts the container, 10 min idle stops it; data persists in named volumes; another engine version = copy a unit pair onto the next port (mysql80@3307, postgres16@5433). REDIS CLIENT (bin/redis-cli, added 2026-08-08): there was no Redis client on this box at all, and neither usql nor lazysql can ever be one — both are SQL-only, and `usql redis://…` answers 'unknown database scheme' (verified). No package was installed for it: Fedora 44 dropped the redis package entirely in favour of valkey, and while `valkey` (5.9 MB + librdmacm) supplies valkey-cli, the only subpackage that restores the redis-cli NAME is valkey-compat-redis, which also lands /usr/bin/redis-server and a redis.service on a machine where a container already owns 6379 — a dormant second server nobody must ever enable. The wrapper instead runs the official client from the redis:7-alpine image already pulled here: zero packages, no sudo, client version matching the server, 60 ms warm (measured — --network=host skips netns setup). It is also the indirection that keeps the choice reversible: swapping the body for a native valkey-cli later touches no caller. `podman exec` is NOT the alternative — the quadlet removes a stopped container, so an idle Redis is absent from `podman ps -a` and only a TCP connect can wake it. NO Redis TUI was adopted deliberately: the field is thin, the top result by stars (mylxsw/redis-tui, 940) has been dead since 2019, and everything maintained sits at 36-118 stars, so there is nothing near lazysql's maturity to justify the dependency. An MCP server was likewise declined — agents are already fluent in redis-cli, so Bash reaches it with no extra process and no tool-schema tokens"

