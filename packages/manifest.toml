# jj (Jujutsu) v0.44.0 — git-compatible VCS. Taken as an ADDITION to git, not a
# replacement: since 0.39 `jj git init --colocate` is the default, so it drives
# an existing .git in place and lazygit/gitui/git keep working on the same repo.
# Deliberately not in Fedora (checked 2026-08-08: no `jujutsu` package in f44).
# musl is the only linux build upstream ships — statically linked, so it has no
# glibc coupling to the host at all. Pre-1.0: upstream still warns about
# backward-incompatible on-disk format changes, which is exactly why nothing in
# this repo depends on it — it is a tool the user drives by hand.

# witr v0.3.3 — "why is this running?": resolves a pid/port/container/file back
# to the unit, service or shell that spawned it. Earns its place on THIS machine
# specifically: the dev databases are socket-activated podman containers that
# start and stop on their own (see dev-services), so "what just woke mysql" is a
# question this box actually raises. Bare binary + a witr.1 man page, which is
# why the install block is hand-rolled rather than using fetch_tar.

