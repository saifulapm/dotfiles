# Installed by chezmoi scripts / declared externals, recorded here so the
# manifest stays the complete inventory.

[[tool]]
name = "librepods"
via  = "Built from source (github.com/librepods-org/librepods, linux/ dir, CMake + Qt6) with packages/librepods-status-ipc.patch applied, into ~/.local/bin/{librepods,librepods-ctl}. Build deps: qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtconnectivity-devel qt6-qttools-devel openssl-devel pulseaudio-libs-devel cmake gcc-c++ (installed 2026-08-11, kept for rebuilds). Runs as librepods.service with --no-ui, another patch addition: headless, no tray icon and no window — the bar's own airpods widget/panel (AirPods.qml, AirPodsPanel.qml, LibrePodsService.qml) is the only UI (graphical-session.target, enabled by run_after_02, ConditionPathExists so machines that never built it skip cleanly)"
why  = "The Apple-exclusive AirPods features: ANC/Transparency/Adaptive switching (librepods-ctl noise:*), ear detection with auto play/pause, per-pod battery. It owns the AAP channel (L2CAP PSM 0x1001) — one connection per device, which is exactly why the patch exists: upstream's control socket was write-only, so the bar's battery display would have gone dark. The patch adds `status` (one JSON line) and `subscribe` (a line per state change) to its local socket, and bin/bluetooth-battery defers to that stream, re-shaped to its own output, whenever the daemon runs — the shell cannot tell the difference. Verified on the desk 2026-08-11: noise mode round-trips 2->1->2 by ctl, subscribe pushes on each change, per-pod battery matches. The hearing-aid features additionally want DeviceID = bluetooth:004C:0000:0000 spoofed in /etc/bluetooth/main.conf — deliberately NOT done (user decision 2026-08-11: skip until wanted)"

[[tool]]
name = "nirisnap"
via  = "run_after_29-nirisnap.sh — clone of github.com/saifulapm/nirisnap (fork of tobi/omasnap; the niri default branch is upstream + a 3-commit port, NIRI.md there has the rebase/versioning model) into ~/.local/src/nirisnap, CMake-built into ~/.local/bin/omasnap. The binary keeps upstream's name on purpose — smaller diff, cheaper rebases"
why  = "Screenshot + annotation overlay (user ask 2026-08-11, tobi's omasnap ported the same day): region/fullscreen capture into a vector-layer editor — arrows, markers, text, OCR, backdrops — bound at Print and Mod+Shift+4 in the niri config, replacing niri's bare `screenshot` there. Window-picker mode is dormant: niri implements no ext-image-copy-capture and publishes no tiled-window geometry over IPC (verified against source 2026-08-11), so Mod+Shift+5 keeps niri's native screenshot-window"

