[[tool]]
name = "sherpa-onnx"
via  = "run_after_24-sherpa-onnx.sh (github.com/k2-fsa/sherpa-onnx releases, pinned v1.13.4, aarch64 AND x86_64 — note upstream names them differently: linux-aarch64-shared-cpu vs linux-x64-shared) → ~/.local/share/sherpa-onnx/{bin,lib}, plus the kokoro-multi-lang-v1_0, kitten-nano-en-v0_8-int8 and vits-coqui-bn-custom_female models from the same repo's tts-models tag"
why  = "Neural text-to-speech for `screenshot-ocr --speak` (Mod+Ctrl+Shift+6) — OCR a region, hear it read. Chosen over Orca because a screen reader walks AT-SPI widget trees and is therefore blind to text inside images, video, canvas and PDFs, which is most of what one wants read back. Fedora packages no usable neural TTS (flite and espeak-ng are 1990s formant/diphone synths; the user's verdict on flite was 'robotic'), and every good engine ships as a Python wheel — sherpa-onnx is the one prebuilt C++ binary that runs both Kokoro (82M-param neural) and Kitten (15M) from one CLI, so this desktop gets a natural voice with no venv and no second Python. Lands in ~/.local/share rather than ~/.local/bin because it needs its own libonnxruntime; bin/screenshot-ocr is the only thing that sets its LD_LIBRARY_PATH, and nothing goes on PATH. NO daemon and no systemd unit, unlike voxtype: the model loads per invocation and exits, keeping a 300 MB resident process off a laptop that runs ~1.5 GB free (see bin/mem-pressure-warn). fp32 Kokoro, which is the opposite of what the file sizes suggest: benchmarked here 2026-08-08 (--num-threads=4, same sentence, 3 runs each) fp32 is 537 MB peak RSS / 1.92 s against int8's 360 MB / 3.44 s, so int8 was 1.8x SLOWER for its smaller download — ARM int8 kernels lose to the fp32 paths and the non-quantizable ops (softmax, LayerNorm) dominate the rest. Quantization cannot improve fidelity either, so the int8 Kokoro was dropped after being tried first; kitten-nano-en-v0_8-int8 (143 MB peak) stays as the low-RAM fallback via SHERPA_MODEL. Revisit only if the ~1.5 GB free headroom shrinks. All beat realtime, so the streaming player starts speaking almost at once. Only the two offline-tts binaries are kept; the tarball's ~40 ASR/VAD/speaker-ID tools are dropped since voxtype already owns speech-to-text here. REJECTED alternative (tried 2026-08-08, user ask): lucasjinreal/Kokoros, the Rust `koko` CLI. It is not a different engine — it drives the same Kokoro-82M weights through the same ONNX Runtime via the `ort` crate, so its audio is the same modulo phonemization, and it ships no release binaries. Building it needs openssl-devel (ort-sys pulls ureq+native-tls as a BUILD dep to download an onnxruntime; avoidable with ort default-features=false + load-dynamic against the libonnxruntime already here) and then clang-devel + opus-devel for espeak-rs-sys and audiopus_sys bindgen — 17 dev packages to reach identical output. Not worth it; the useful result of that experiment was the fp32-beats-int8 benchmark above. BANGLA (user ask 2026-08-08): Kokoro has no Bengali voice, so screenshot-ocr routes Bengali-script selections (U+0980–U+09FF, majority vote against Latin) to vits-coqui-bn-custom_female — no second keybind. That model is the least-bad of what exists, picked by ear after the user rejected vits-mimic3-bn-multi_low and Piper's bn_BD-google-medium (the latter is the only Bengali voice in Piper's 54 languages, is bn_BD not bn_IN, and needs ONNX metadata injection plus dropping 5 multi-codepoint phonemes sherpa's token reader refuses — all of which worked, and it still lost by ear). Meta's MMS ben is published only as a transformers.js export whose signature (input_ids/attention_mask → waveform) is not sherpa's VITS one (x/x_length/… → y), so it loads and emits nothing; a real re-export needs torch. SYSPIN's Indian-Bengali VITS is a 333 MB .pt. The models that would actually beat these — AI4Bharat IndicF5, Indic Parler-TTS — are GB-scale torch needing a reference clip plus transcript per utterance, which does not fit a hotkey on a 1.5 GB-free laptop. Conclusion on record so this is not re-litigated: open-source Bangla TTS has a markedly lower ceiling than English, and this is the best available locally"

[[tool]]
name = "tessdata-langs"
via  = "run_after_25-tessdata.sh — ben.traineddata from github.com/tesseract-ocr/tessdata_best into ~/.local/share/tessdata, with the system eng.traineddata symlinked in beside it; bin/screenshot-ocr passes --tessdata-dir at that directory"
why  = "Bangla OCR for the capture binds (user ask 2026-08-08). Fedora does package tesseract-langpack-ben, but every langpack needs root, which stops a fresh-machine apply to ask for a password — tesseract's --tessdata-dir gives the same result with no sudo and no rpm, and keeps the language set in this repo. The eng symlink is NOT optional: --tessdata-dir REPLACES the search path rather than extending it, so without eng beside ben, adding Bangla would silently break English OCR; screenshot-ocr therefore gates on both files and falls back to plain `-l eng` if either is missing. tessdata_best over tessdata_fast because Bengali is conjunct-heavy and a screen region is small enough that the slower model costs milliseconds. Measured 2026-08-08 on pango-rendered samples: eng+ben scored 100% on both scripts and took English OCR from 0.09 s to 0.13 s, while ben+eng tripled the English case to 0.27 s — hence the order eng+ben"

[[tool]]
name = "lazysql"
via  = "run_after_10-prebuilt-binaries.sh — lazysql_Linux_<arm64|x86_64>.tar.gz from the latest github.com/jorgerojas26/lazysql release (v0.5.5 when added; both arches published, the aarch64 asset verified against the GitHub API 2026-08-08) into ~/.local/bin. Connections in dot_config/lazysql/config.toml; launcher entry in dot_local/share/applications/tui-lazysql.desktop"
why  = "TUI database client, and the REPLACEMENT for dbx, which this repo carried for exactly one day (added 2841ec1 2026-08-08, removed the same day). Why dbx went: its tray icon could not restore its own window. Tauri's tray-icon crate exports a libayatana AppIndicator, and that object implements only Scroll, SecondaryActivate and XAyatanaSecondaryActivate plus a menu — there is no Activate method at all, and no ItemIsMenu property either, so a host cannot even tell the item is menu-only. Verified over D-Bus 2026-08-08: `Activate` returns 'No such method'. The bar (shell/Modules/Bar/widgets/Tray.qml) therefore reads onlyMenu as false, calls activate() on left click, the call bounces off a nonexistent method, and nothing happens — the window was reachable ONLY through the right-click menu's 'Show DBX' entry. Nothing in the shell was wrong and there was nothing to fix on this side. THE COST COMPARISON, which is the other half of the decision and the reason the swap was easy: dbx was a 50 MiB RPM that pulled webkit2gtk4.1 (92 MiB), libappindicator-gtk3 and libdbusmenu{,-gtk3} — 143 MiB, a whole browser engine for one app, and it needed sudo, so it got its own run_after_26 script. Removing it took all four dependency packages with it, exactly as that script's comment predicted (nothing else on the box required any of them — checked with `dnf repoquery --whatrequires` before removal). lazysql is one 16 MB statically-linked Go binary in the existing no-sudo ~/.local/bin tier: zero system packages, no desktop entry, no tray, nothing to restore. Providers are exactly mysql, postgres, sqlite3, sqlserver — the strings the binary validates against, so 'postgresql' or 'sqlite' is a startup error. NOT a usql replacement, the same split dbx had: usql for scripted one-liners, lazysql for browsing an unfamiliar schema and eyeballing a result grid, which is the job a GUI was wanted for in the first place. No Redis — lazysql speaks SQL only, so 127.0.0.1:6379 stays a redis-cli job. Verified end to end 2026-08-08 by driving the real TUI under tmux: picker lists both configured connections, MySQL connects, the sidebar tree expands to a table and the record grid renders rows. That test also established the one behaviour worth knowing — lazysql HIDES system schemas, so a fresh dev MySQL showing only information_schema/mysql/performance_schema/sys presents as an empty sidebar, which looks like a failed connection and is not one. REJECTED alternatives (weighed 2026-08-08): rainfrog, 7 MiB Rust, more actively developed and static-musl like jj, but its centre of gravity is a query editor rather than a schema browser, which is the reverse of what dbx was here for; dblab, 9 MiB Go, adds SSH tunnels that a loopback-only dev box has no use for. LAUNCHER ENTRY (added 2026-08-08, dot_local/share/applications/tui-lazysql.desktop): this closes the one real argument dbx had left. dbx was taken as an RPM specifically because only the RPM carried a .desktop entry and icons — 'the desktop entry and icons are the reason it appears in the launcher' was the recorded justification for paying 143 MiB. bin/tui-install's TUI.float/TUI.tile convention gives exactly that for a terminal app at zero cost, so the launcher row survives the swap. Written into the source tree rather than by running tui-install, which writes only to ~/.local/share/applications and would have left it unmanaged and absent on a fresh machine — the identical defect 064eaca recorded for dbx-handler.desktop. TILE not float, departing from tui-install's default: the float rule is 875x600 and lazysql puts a sidebar tree beside a paged record grid, which wants a full column the way dbx's own window did. One word in Exec to change back. Icon is office-database, which Yaru actually ships — note tui-disk-usage.desktop asks for a nonexistent 'disk-usage' and renders the fallback"

[[tool]]
name = "daemon-trim"
via  = "run_after_26-trim-daemons.sh — systemctl disable --now for the abrt suite (abrtd, abrt-journal-core, abrt-oops, abrt-xorg, abrt-vmcore), rsyslog, systemd-homed(-activate) and raid-check.timer; systemctl mask for gssproxy; SystemMaxUse=200M drop-in at /etc/systemd/journald.conf.d/50-size-cap.conf"
why  = "Long-uptime audit (user ask 2026-08-08): 10-15 day uptimes on 7.3 GB machines, so always-on distro defaults were measured and the useless ones cut — ~130 MB resident plus steady wakeups and disk writes. abrt was the single biggest: 93 MB across four processes, three of them tailing the journal continuously, all to file Fedora crash reports a dev debugs locally instead. rsyslog (30 MB) only duplicated the journal into /var/log/messages. systemd-homed managed zero home areas (`homectl list` verified before disabling — the saiful account is classic /etc/passwd, so this cannot lock anyone out). raid-check.timer scrubbed a RAID that does not exist on a single-NVMe laptop. gssproxy is the one MASK rather than disable, and the distinction is load-bearing: it was already `disabled` yet running, because static auth-rpcgss-module.service pulls it in via Wants= every boot — verified with list-dependencies --reverse — and only a mask survives a dependency pull; it serves NFS-with-Kerberos, which these loopback-dev machines will never mount. The journald cap exists for the same uptime reason: default SystemMaxUse is 10% of disk (~4 G here) and the journal was already at 155 M after hours, so weeks of uptime would otherwise grow it unbounded-in-practice. Deliberately KEPT after the same audit: firewalld, tailscaled, chronyd, smartd, avahi (printer/mDNS), power-profiles-daemon — all small and earning their keep. The audit's real finding was that the base is already lean: the big residents are the chosen stack itself (qs 257 MB, niri 155 MB, emacs 106 MB), and the thing to WATCH across a long uptime is qs creeping — the fix is a qshell restart, and mempressure.service gives the early warning. Re-runs every apply for the voxtype self-heal reason: package updates re-apply presets and can flip these back to enabled"
