# packages/manifest.toml — the single source of truth for what is installed and why.
#
# The chezmoi script .chezmoiscripts/run_before_00-install-packages.sh.tmpl
# hashes this file, so editing it re-runs installation on every machine at the
# next `chezmoi apply` (the hash is recorded only after dnf succeeds — a
# sudo-less background apply stays pending, see the script header).
#
# Every dnf invocation uses --setopt=install_weak_deps=False, and the install
# script enforces install_weak_deps=False in /etc/dnf/dnf.conf itself (it was
# originally a hand-run append that no fresh machine would have had).
#
# Fields:
#   name     — dnf package name
#   category — core | shell | dev | optional
#   arch     — all | aarch64 | x86_64   (install only on matching machines)
#   why      — one-line justification; a package with no honest justification
#              does not get installed.

# ------------------------------------------------------------------ repos

[[copr]]
name = "errornointernet/quickshell"
why  = "Quickshell is not in Fedora; this COPR publishes working aarch64 + x86_64 builds for F43/F44 (verified 2026-08-05)"

[[copr]]
name = "jdxcode/mise"
why  = "mise is not in Fedora; author's COPR builds aarch64 + x86_64 for F43/F44 (verified 2026-08-05) — one repo mechanism for the install script"

[[copr]]
name = "atim/starship"
why  = "starship is not in Fedora repos; this COPR builds f44 aarch64 + x86_64 (latest 1.24.2, verified 2026-08-07). The prompt for the fish shell setup"

[[copr]]
name = "atim/lazygit"
why  = "lazygit is not in Fedora repos; this COPR builds f44 aarch64 + x86_64 (latest 0.47.1, verified 2026-08-07). Primary git TUI on the mac; the kak config opens it in a popup"

[[copr]]
name = "lihaohong/yazi"
why  = "yazi is not in Fedora repos; this COPR builds f44 aarch64 + x86_64 (latest 26.5.6, verified 2026-08-07). File manager TUI; the kak config opens it in a popup"

# ------------------------------------------------------------------ core
# The machine is usable as a desktop without anything below `dev`.

[[pkg]]
name = "foot"
category = "core"
arch = "all"
why = "Terminal. Lightest maintained Wayland-native terminal; retheme-able live via OSC sequences"

[[pkg]]
name = "wl-clipboard"
category = "core"
arch = "all"
why = "wl-copy/wl-paste — Wayland clipboard CLI. bin/clipboard-capture owns the history store with a pair of `wl-paste --watch` children, and the emoji and clipboard pickers copy through wl-copy; wtype then pastes. The shell's whole clipboard story rests on it"

[[pkg]]
name = "jq"
category = "core"
arch = "all"
why = "JSON writer and reader for bin/clipboard-capture and bin/reminder — clipboard payloads and reminder messages are arbitrary text, and hand-rolling the string escaping in bash is a correctness bug waiting to happen. The only two places in the repo that need it (the network helpers deliberately use grep/awk instead)"

[[pkg]]
name = "libnotify"
category = "core"
arch = "all"
why = "notify-send, the only way the shell's own bin/ scripts reach the notification server we host (bin/reminder's confirmations and fires, the emoji and clipboard pickers' copy toasts). Pulled in as a dependency today; named here because the reminder timers are useless without it"

[[pkg]]
name = "grim"
category = "core"
arch = "all"
why = "Wayland screenshot capture"

[[pkg]]
name = "slurp"
category = "core"
arch = "all"
why = "Region selection for grim (screenshot area picking)"

[[pkg]]
name = "niri"
category = "core"
arch = "all"
why = "The compositor. Hard-requires xwayland-satellite (auto-spawned by niri >= 25.08 when an X11 client connects), so that is not listed separately"

[[pkg]]
name = "mesa-vulkan-drivers"
category = "core"
arch = "all"
why = "The Vulkan ICD. Another weak-dep casualty like [[pkg]] pipewire: mesa-dri-drivers and mesa-libGL are hard deps of things already here, but the Vulkan driver is only ever Recommended, so with install_weak_deps=False /usr/share/vulkan/icd.d/ was EMPTY and vulkan-loader had nothing to load. mpv 0.41 defaults to vo=gpu-next, which probes waylandvk first and fails it with VK_ERROR_INCOMPATIBLE_DRIVER on every launch before falling back to the OpenGL context — the fallback works (GL_RENDERER=Mesa Intel(R) Graphics (RPL-P), real acceleration, not llvmpipe), so this was invisible until the mpv logs were read. Named here so gpu-next gets its preferred backend and so anything else that genuinely requires Vulkan is not silently broken (found 2026-08-11)"

[[pkg]]
name = "intel-media-driver"
category = "core"
arch = "x86_64"
why = "VAAPI (iHD) for the NUC's Raptor Lake iGPU. libva was installed with no driver behind it, so hardware decode was unavailable and every decode fell back to CPU. Survivable at 1080p — 10-bit HEVC benchmarked here at 25x realtime, 300 frames in 0.49 s on the i5-13420H — but the monitor on this desk is a 4K M32UC and 4K HEVC has nothing like that headroom. Lives in RPM Fusion NONFREE, which 00-install-packages now bootstraps (x86_64 only) alongside the -free release rpm; user decision 2026-08-11. There is no free alternative for this GPU: libva-intel-driver in -free is the old i965 for pre-Skylake parts, and Mesa's VA state tracker has no Intel backend, so mesa-va-drivers-freeworld does nothing here. arch=x86_64, NOT all: the filter is a literal `p.get(\"arch\", \"all\") in (\"all\", uname -m)`, and on the aarch64 laptop this name resolves to nothing — which --skip-unavailable would survive, but the rpm -q sweep at the end of that script WITHHOLDS THE STATE HASH for anything that did not land, so every future apply there would re-run the whole package pass forever"

[[pkg]]
name = "xdg-desktop-portal-gnome"
category = "core"
arch = "all"
why = "Screencast/screenshot portal backend for niri (was a niri weak dep; claimed intentionally)"

[[pkg]]
name = "xdg-desktop-portal-gtk"
category = "core"
arch = "all"
why = "Portal backend for GTK apps: settings, and the FileChooser FALLBACK behind the shell's own picker — see home/dot_config/xdg-desktop-portal/niri-portals.conf. Load-bearing in two ways: bin/qshell-portal delegates to it when the shell is unreachable, and it is what the preference list falls back to if the qshell backend is not registered. The gnome backend cannot serve either role: it advertises FileChooser but delegates it to nautilus, which is not installed, so every request died with \"The name is not activatable\" and no dialog ever appeared (was a niri weak dep; claimed intentionally)"

[[pkg]]
name = "pipewire"
category = "core"
arch = "all"
why = "The audio server itself — /usr/bin/pipewire and pipewire.service. Named here because NOTHING on Fedora hard-requires it: wireplumber's only PipeWire dependency is libpipewire-0.3.so.0, which pipewire-libs satisfies, and every other reference to the daemon is a Recommends. With install_weak_deps=False (enforced globally by run_before_00-install-packages.sh.tmpl) a minimal x86_64 install therefore lands wireplumber and pipewire-libs and no server, which is exactly what the NUC did: wireplumber.service inactive, `wpctl status` \"Could not connect to PipeWire\", no sound anywhere, and the bar's audio widget invisible because Services/Audio.qml derives `ready` from Pipewire.ready && sink !== null and AudioWidget.qml binds `visible` to it — correct behaviour reported as a missing widget. Invisible on the Asahi laptop, where the base spin and asahi-audio drag the daemon in regardless, which is why the fleet ran for months with only the session manager claimed (found 2026-08-10)"

[[pkg]]
name = "pipewire-pulseaudio"
category = "core"
arch = "all"
why = "pipewire-pulse.service — the PulseAudio API served by PipeWire. Quickshell speaks native PipeWire, so the bar widget and the wpctl keybinds come back without this, but Chromium, Firefox, Electron apps and mpv all emit through libpulse and stay silent until it is present. Conflicts with the real pulseaudio, which is not installed and must not be"

[[pkg]]
name = "pipewire-alsa"
category = "core"
arch = "all"
why = "Routes raw-ALSA clients through PipeWire instead of letting the first one to open hw:0 take the card exclusively and lock out everything else"

[[pkg]]
name = "pipewire-utils"
category = "core"
arch = "all"
why = "pw-play and the pw-* diagnostics. Load-bearing for bin/screenshot-ocr, which pipes sherpa-onnx's synthesised PCM into `pw-play --format s16 --rate 22050 --channels 1 -` (its other branch wants ffplay, and there is no ffmpeg CLI on these machines) — without it Mod+Ctrl+Shift+6 OCRs happily and reads nothing aloud. CORRECTION 2026-08-11: ffplay exists since the 2026-08-07 RPM Fusion swap, so the parenthetical is stale — but the conclusion holds, screenshot-ocr prefers pw-play on its own merits and ffplay is only its fallback"

[[pkg]]
name = "wireplumber"
category = "core"
arch = "all"
why = "PipeWire session manager — no audio routing without it (was a niri weak dep; claimed intentionally)"

[[pkg]]
name = "rtkit"
category = "core"
arch = "all"
why = "Grants PipeWire's realtime scheduling over D-Bus — another weak-dep casualty like [[pkg]] pipewire, and the one whose absence SIGKILLed every native PipeWire client. Nothing hard-requires it, so with install_weak_deps=False it was missing at boot; xdg-desktop-portal then cached its Realtime properties as ZEROS ('name is not activatable', three journal lines at session start) and kept serving them, and libpipewire's module-rt trusts the portal over rtkit itself, clamps its own RLIMIT_RTTIME to the advertised 0, and still asks for SCHED_RR — so the kernel killed the thread on its first realtime tick. Cost: mpv ao=pipewire dead in ~1 s, wireplumber killed every ~6 s whenever it owned a Bluetooth stream, bluetoothd SEGVs in the teardown, AirPods dropping mid-song. Installing rtkit mid-session is NOT enough: the portal must start while rtkit is reachable (installed = D-Bus-activatable), or be restarted after. Named here so a fresh machine never reproduces the hunt (first sighting and root cause both 2026-08-11)"

[[pkg]]
name = "jetbrains-mono-fonts"
category = "core"
arch = "all"
why = "SUPERSEDED by Maple Mono, which draws the whole desktop (see [[tool]] maple-mono, pinned as `monospace` by home/dot_config/fontconfig/conf.d/50-qshell.conf, 2026-08-06). Kept installed as a known-good monospace fallback if the Maple external ever fails to fetch on a fresh machine; nothing in the repo names it any more"

[[pkg]]
name = "adwaita-sans-fonts"
category = "core"
arch = "all"
why = "What `sans-serif` resolves to. NOT the desktop's font — Maple Mono draws the shell, the terminal and GTK chrome — but web pages and documents ask for a proportional face by name, and answering those with a monospace font would be a bug. GNOME's build of Inter; already on disk as a dependency, named here so the fontconfig policy can point at something guaranteed present"

[[pkg]]
name = "google-noto-sans-bengali-vf-fonts"
category = "core"
arch = "all"
why = "Bangla DISPLAY coverage. NOTHING installed here covered lang=bn (verified `fc-list :lang=bn` empty on 2026-08-06), so every Bangla codepoint rendered as a tofu box everywhere — terminal included, since neither Maple Mono nor Adwaita Sans carries Bengali. Still wanted after the fcitx removal above: reading Bangla and typing it are separate problems, and Bangla arrives from web pages, filenames and messages whether or not there is an input method. 165 KB. Appended to the sans/serif/mono chains by the repo's fontconfig policy so it only ever draws the codepoints the chosen family cannot"

[[pkg]]
name = "google-noto-serif-vf-fonts"
category = "core"
arch = "all"
why = "The only serif face on the machine. Without it Fedora ships default-fonts-core-sans and no serif at all, so `serif` fell through a charset scan and resolved to Adwaita MONO (verified 2026-08-06) — anything asking for a serif got a monospace font. The fontconfig policy points serif here"

[[pkg]]
name = "brightnessctl"
category = "core"
arch = "aarch64"
why = "One-shot backlight get/set for the OSD path (keybind → shell IPC → brightnessctl); laptops/HDMI-less Macs only — the NUC has no backlight"

[[pkg]]
name = "qrencode"
category = "core"
arch = "all"
why = "Renders the Wi-Fi share QR matrix for the network panel (bin/network-qr pipes it through `qrencode --type ASCII`); the panel hides its share button when this is missing, so the feature is dead without it"

[[pkg]]
name = "wtype"
category = "core"
arch = "all"
why = "`xdotool type` for Wayland — how voxtype puts a finished transcript into the focused window (see [[tool]] voxtype). Without it voxtype falls back to the clipboard and dictation stops short of actually typing (`voxtype setup check` says so in as many words). Installed 2026-08-06; it is also this machine's only key-injection tool, so the emoji picker and clipboard manager can now paste into the focused window the way omarchy does, instead of only copying and notifying"

[[pkg]]
name = "wlrctl"
category = "core"
arch = "all"
why = "Virtual mouse for Wayland — niri implements zwlr_virtual_pointer_manager_v1 (verified in the 26.04 binary, 2026-08-11), so this drives pointer move/click/scroll with no daemon and no uinput. The desktop skill's default pointer channel; wtype covers keyboard but cannot click. Also gives `toplevel waitfor/wait/find` — the wait-for-a-window primitive"

[[pkg]]
name = "ydotool"
category = "core"
arch = "all"
why = "The one input action wlrctl's CLI cannot express: holding a button down across a move — drag-and-drop, sliders, marquee selection (`ydotool click 0x40` down / `0x80` up, `mousemove --absolute`). Kernel uinput, so it also reaches XWayland clients. Needs ydotoold running and a udev rule for /dev/uinput; the desktop skill falls back to wlrctl for everything else"

[[pkg]]
name = "power-profiles-daemon"
category = "core"
arch = "all"
why = "D-Bus power-profile switching (power-saver/balanced/performance) behind the power panel's profile row; quickshell's PowerProfiles service is dead air without the daemon"

[[pkg]]
name = "wf-recorder"
category = "core"
arch = "all"
why = "The screen recorder behind bin/screenrecord and the bar's screen-recording indicator (omarchy uses gpu-screen-recorder, which is Arch/AUR-only and NVIDIA/AMD-oriented; wf-recorder is the wlroots-native equivalent niri supports). Installed by hand 2026-08-06. Note: Fedora's ffmpeg-free ships no libx264, so wf-recorder's own default falls back to CPU libvpx-vp9, which cannot keep up at 2560x1600 — bin/screenrecord asks for libopenh264 (present here) and retries on wf-recorder's default if a machine lacks it. ffmpeg-free also ships no AAC encoder, so audio recordings are Opus in MP4 rather than upstream's AAC. There is no ffmpeg/ffprobe CLI on this box either, so upstream's post-processing pass (warmup-GOP trim, loudnorm, preview thumbnail) is not ported. CORRECTION 2026-08-11: every ffmpeg-free constraint above died at the 2026-08-07 RPM Fusion swap — libx264, the native aac encoder and the ffmpeg/ffprobe CLIs are all present now. bin/screenrecord updated the same day: defaults to h264_vaapi where a VA driver exists (measured on the NUC's 4K output: 0.16 s CPU vs libx264's 22.4 s for the same 5 s capture), libx264 elsewhere and as the written-nothing retry; libopenh264 retired. Audio stays Opus-in-MP4 by choice; the post-processing pass remains unported"

[[pkg]]
name = "tesseract"
category = "optional"
arch = "all"
why = "OCR engine behind bin/screenshot-ocr (Mod+Ctrl+Print, the capture menu's Extract Text row — hidden while tesseract is absent). Port of the pre-qshell dotfiles-linux flow: slurp region → grim → tesseract → clipboard. English only by default; other languages are one tesseract-langpack-* away"

[[pkg]]
name = "tesseract-langpack-eng"
category = "optional"
arch = "all"
why = "English traineddata for tesseract — the engine ships with no language at all, and bin/screenshot-ocr's default is `-l eng`"

[[pkg]]
name = "zbar"
category = "optional"
arch = "all"
why = "Barcode/QR decoder behind bin/screenshot-qr (the capture menu's QR Code row — hidden while zbarimg is absent), port of omarchy's omarchy-capture-qr. Only the QR symbology is enabled at call time: dense screen content false-positives as EAN or Code 39 otherwise"

[[pkg]]
name = "bluez-tools"
category = "core"
arch = "all"
why = "Ships bt-agent, the auto-accept pairing agent behind the bluetooth panel's pair action (bt-agent.service, enabled by the 02-user-timers script). quickshell registers no BlueZ agent of its own, so without one a `pair` against any device that asks for a PIN or a confirmation waits forever on a passkey nobody can type. Installed 2026-08-06, user-authorized"

[[pkg]]
name = "tailscale"
category = "core"
arch = "all"
why = "The tailnet joining these three machines, and what the bar's `tailscale` widget and panel read (`tailscale status --json`, `exit-node list`, `switch --list`); Fedora packages it directly, aarch64 and x86_64 alike, so no third-party repo is needed. Installed 2026-08-05 by hand: dnf install + `systemctl enable --now tailscaled` + `tailscale up`. The daemon is not started by anything in this repo"

# Notes on the tailscale entry above, both of which the shell has to live with:
#
#   * `tailscale up`, `down`, `set` and the profile list all refuse a non-root
#     user until the operator is set once, with
#         sudo tailscale set --operator=$USER
#     — not done on this machine as of 2026-08-05, so the panel is read-only
#     here and surfaces an "Authorize Tailscale operator" row that runs exactly
#     that command under pkexec, rather than letting the switch fail silently.
#   * the panel's Taildrop send button falls back to a file chooser
#     (bin/file-select) when no files are named, which goes through
#     xdg-desktop-portal — and therefore, since bin/qshell-portal registered
#     the shell as the FileChooser backend, through the shell's own picker.
#
# Tailscale also publishes its own dnf repo, which carries releases sooner than
# Fedora's — same package name, same two architectures, and only one of the two
# should ever be enabled:
#     sudo dnf config-manager addrepo \
#       --from-repofile=https://pkgs.tailscale.com/stable/fedora/tailscale.repo

# Dropbox — REVERSED 2026-08-10 (user): there is no Dropbox package or tool
# here at all any more. The proprietary daemon that ran on the NUC (the
# dropboxd tarball in ~/.dropbox-dist, their python3 CLI, a script-written
# user unit, all from run_after_06-dropbox.sh) is REMOVED, along with the
# daemon-backed `dropbox` bar widget and bin/dropbox-status. The one Dropbox
# path on every machine is now the rclone `Dropbox` remote behind the bar's
# `dropbox` widget (see rclone below) — which is what the two Asahi Macs
# always had, since Dropbox ships no aarch64 Linux daemon.
#
# Why drop a working native client on the one box that could run it: three
# machines that differ only in how they reach the same files is three setups
# to remember, debug and document. rclone already carried iCloud and already
# carried Dropbox for the Macs, and qshell-sync already moves shell history
# and screenshots through the Dropbox remote — the daemon was the odd one
# out, not the baseline. run_once_after_29-dropbox-daemon-remove.sh does the
# uninstall (it deliberately does not touch ~/Dropbox: that is data).
#
# The nautilus-dropbox rpm route was REJECTED back then and stays rejected:
# RPM Fusion nonfree, plus a hard nautilus/GNOME dependency chain.
#
# NOT installed, listed for the record: the network panel's speed test needs
# nothing beyond curl (bin/network-speedtest measures /proc/net/dev deltas
# while curl saturates fast.com's endpoints), and `iw` is used only when it
# happens to be present, for the dBm and bitrate readings nmcli does not
# report. Neither is worth a package entry on its own.

[[pkg]]
name = "chezmoi"
category = "core"
arch = "all"
why = "Dotfiles manager — the restore path for this whole repo"

[[pkg]]
name = "git"
category = "core"
arch = "all"
why = "The repo itself is a git checkout with a core.hooksPath pre-commit hook; chezmoi clones the restore URL through it. Installed by hand during first setup (bash history line 27) and never recorded until 2026-08-06 — a fresh minimal machine does not ship it (chezmoi would fall back to its builtin git for the clone, and every later git operation would then be missing)"

[[pkg]]
name = "curl"
category = "core"
arch = "all"
why = "Full curl (Fedora minimal ships curl-minimal). The weather widget, bin/network-speedtest, the get.chezmoi.io bootstrap and the agent-CLI installers all shell out to it. Installed by hand during first setup, recorded 2026-08-06"

[[pkg]]
name = "dnf5-plugins"
category = "core"
arch = "all"
why = "Provides `dnf copr`, which the install script needs to enable the quickshell and mise COPRs — Fedora minimal does not ship it. The script also self-bootstraps it before the copr loop (chicken-and-egg); this entry keeps the inventory honest"

[[pkg]]
name = "chromium"
category = "core"
arch = "all"
why = "The browser. Installed by hand 2026-08-05 (and with weak deps, predating the global dnf.conf policy), recorded 2026-08-06. Everything that opens a URL (menu rows, tailscale login dance, xdg-open) lands here"

[[pkg]]
name = "btop"
category = "optional"
arch = "all"
why = "Terminal system monitor the user actually reaches for (bash history shows regular use). Installed by hand 2026-08-05, recorded 2026-08-06"

[[pkg]]
name = "inotify-tools"
category = "optional"
arch = "all"
why = "inotifywait drives the rsw rsync-on-change watcher (fish functions rsw/lsw/dsw, ports of omarchy's bash fns — user-picked 2026-08-08). Without it rsw degrades to the initial one-shot rsync and the watch loop exits"

[[pkg]]
name = "yaru-icon-theme"
category = "core"
arch = "all"
why = "Per-theme GTK icon themes (omarchy gap item 6, user-picked 2026-08-07): every theme's [icon].theme token names a Yaru color variant (omarchy's icons.theme values), flipped by bin/theme-apply via gsettings. The Fedora rpm ships all color variants (blue/magenta/olive/purple/red/sage/wartybrown/yellow + -dark) in one package — verified in the filelist; omarchy's gray/grey values for vantablack/white don't exist anywhere and were mapped to Yaru-dark/Yaru. Before this the machine had NO icon theme at all (notification -i icons drew quickshell's checkerboard placeholder until an iconPath guard was added)"

[[pkg]]
name = "ddcutil"
category = "core"
arch = "all"
why = "DDC/CI brightness control for external monitors (omarchy gap item 1, user-picked 2026-08-07): bin/brightness-display routes non-internal connectors through bin/brightness-display-ddc (getvcp/setvcp 10, bus cached per connector), which is the only brightness path the Mac mini's HDMI display can have — no backlight device exists for it. The rpm ships udev rules granting i2c-dev access to seated users (60-ddcutil-i2c.rules, uaccess tag), so no group edit or /etc change is needed; if a display refuses DDC the script caches 'unavailable' for 60s and the keys degrade to no-ops. Untested against real DDC hardware until the Mac mini runs an apply — this MacBook's only display is the internal eDP panel"

[[pkg]]
name = "udisks2"
category = "core"
arch = "all"
why = "Disk-management daemon udiskie drives over D-Bus. Already present on this MacBook as a transitive dependency, but load-bearing for automount, so declared (the transitive path that dragged it in could vanish in a future image)"

[[pkg]]
name = "udiskie"
category = "core"
arch = "all"
why = "Removable-drive automounter (omarchy gap item 4, user-picked 2026-08-07): before this, a plugged USB stick mounted nowhere. Runs as udiskie.service (dot_config/systemd/user, session-scoped like qshell.service, ConditionPathExists-gated so the unit no-ops until the dnf half of an apply lands); defaults only — automount on, libnotify toasts through the shell's notification server, no tray icon. omarchy autostarts the same tool from Hyprland"

[[pkg]]
name = "rclone"
category = "optional"
arch = "all"
why = "Cloud storage sync — the bar's generalized rclone-remote widget (shell/Modules/Bar/widgets/RcloneRemote*.qml + bin/rclone-remote-status) is built on it: one shared component instanced per remote, today 'icloud' (iclouddrive backend, configured on the MacBook 2026-08-06) and 'dropbox' (dropbox backend). Since 2026-08-10 that Dropbox instance is the ONLY Dropbox on any machine — the NUC's proprietary daemon and the widget it fed were removed, so the instance took back the plain 'dropbox' id it had been avoiding. Reachability + quota probe (`rclone about --json` where the backend supports it, root-listing fallback where not), and `rclone mount` as a transient qshell-rclone-<remote> user unit. Originally installed via rclone.org's install.sh (an rpm-unowned /usr/bin/rclone); this entry moves it to the Fedora package, which will overwrite that unowned binary on the next install run. NOTE: ~/.config/rclone/rclone.conf holds live session secrets and is deliberately NOT in this repo — each remote needs one interactive `rclone config` per machine (Apple 2FA for iCloud, browser OAuth for Dropbox; neither is scriptable), and an instance whose remote is not configured simply stays hidden. bin/qshell-sync (qshell-sync.timer, 15 min) also rides it: shell history and ~/Pictures/Screenshots move through the Dropbox remote as a hub — history as per-machine files via `rclone copy`, screenshots via `rclone bisync` — chosen over iclouddrive for the OAuth token that renews itself (iCloud sessions expire and would silently stall an unattended timer). Services/Sync.qml's model-usage snapshots ride the same script (shell.json's sync block points at ~/.local/state/qshell/sync/model-usage), so the AI panel's numbers merge across machines too"

[[pkg]]
name = "fuse3"
category = "optional"
arch = "all"
why = "FUSE userspace (fusermount3) — the icloud widget's mount path is `rclone mount`, which needs it to attach ~/iCloud. Already present on the MacBook (pulled in 2026-08-06); recorded so a minimal machine gets a working mount toggle rather than a widget whose main action dies"

[[pkg]]
name = "ripgrep"
category = "shell"
arch = "all"
why = "bin/codex-usage-scan sweeps pi agent session logs with `rg --json`; without it that sweep silently contributes nothing (found 2026-08-06 — rg had never been installed, so the pi share of Codex usage was always missing). Generally useful besides"

[[pkg]]
name = "age"
category = "core"
arch = "all"
why = "chezmoi encryption backend for SSH keys and tokens"

[[pkg]]
name = "pass"
category = "core"
arch = "all"
why = "Password manager (user decision 2026-08-09, picked over KeePassXC and Bitwarden for minimalism). ~300 lines of bash over gpg + git: one GPG-encrypted file per entry and the store is its own git repo, so sync is a push rather than a synced binary blob — the .kdbx whole-database merge conflict simply has no analogue here, conflicts are per-entry and git resolves them. THE STORE IS A SEPARATE PRIVATE REPO at ~/.password-store and must never be moved into this one: gpg encrypts entry contents but NOT filenames, so committing it here would publish a complete index of every service in use to a public repo (github.com/saifulapm/dotfiles is PUBLIC — verified 2026-08-09). Ships fish completions, which is this shell. Autofill via browserpass on the desktop and Pass for iOS (App Store, git sync, iOS AutoFill) on the phone. Passkeys are deliberately NOT its job — those stay in iCloud Keychain and reach Chromium over the hybrid/QR transport, which needs only the Bluetooth this machine already has"

[[pkg]]
name = "browserpass"
category = "core"
arch = "all"
why = "The native host behind the Browserpass Chromium extension — Ctrl+Shift+L, filter by domain, fill from the pass store. Fedora's package is ONLY /usr/bin/browserpass-native: no host manifest, no equivalent of upstream's `make hosts-chromium`, so run_after_21 writes the json from chromium/native-messaging-hosts/com.github.browserpass.native.json or the extension fails every lookup with 'host not found'. The extension itself is NOT repo-bundled — it comes from the Chrome Web Store precisely so it keeps auto-updating (3.12.0, 2026-05), unlike the --load-extension omarchy pair. Note browserpass only READS: new entries are made with `pass insert`, there is no save-password prompt, which is the accepted cost of this pick"

[[pkg]]
name = "pinentry-qt"
category = "core"
arch = "all"
why = "Graphical passphrase prompt for gpg-agent — required by the pass setup, not cosmetic. Fedora's base pinentry package is curses-only, and browserpass is spawned by Chromium with no controlling tty, so without a GUI pinentry every browser autofill blocks on a prompt that can never be drawn and then times out with nothing on screen. pinentry-qt rather than pinentry-gnome3 because this is a niri session: gnome3's prompter goes through gcr and degrades back to curses when no GNOME session answers. Qt 6 is already on disk for quickshell, so this is nearly free. Selected in home/private_dot_gnupg/private_gpg-agent.conf.tmpl"

