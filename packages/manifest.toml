name = "chromium-config"
via  = "home/dot_config/environment.d/60-chromium.conf (CHROMIUM_USER_FLAGS — Fedora's wrapper reads the env var, NOT Arch's chromium-flags.conf) + run_after_14-chromium-policy.sh (one-time sudo: /etc/chromium/policies/managed created + chowned to the user) + bin/theme-apply's browser-policy block"
why  = "Chromium configured like the Arch dotfiles-linux setup: native Wayland with per-surface fractional scaling (this MacBook is 1.5×), sRGB pin, AI features off — and omarchy-style live theming: theme-apply writes {BrowserThemeColor: surface.1, BrowserColorScheme: device} to the policy dir on every theme change and pokes running browsers with --refresh-platform-policy; device scheme follows the gsettings color-scheme flip theme-apply already does. Chrome's /etc/opt/chrome dir is prepped too when google-chrome exists (NUC)"
