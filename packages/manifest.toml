# ------------------------------------------------------------------ non-dnf tools
# Installed by chezmoi scripts / declared externals, recorded here so the
# manifest stays the complete inventory.

[[tool]]
name = "node"
via  = "mise use -g node@lts"
why  = "Node runtime, version-managed per decision 2026-08-05"

[[tool]]
name = "pnpm"
via  = "corepack enable pnpm"
why  = "The package manager. Never Bun"

[[tool]]
name = "shopify-cli"
via  = "pnpm add -g @shopify/cli"
why  = "Shopify apps + themes; Node-based — aarch64 compatibility to be verified at install time"

[[tool]]
name = "rust-analyzer"
via  = "rustup component add rust-analyzer"
why  = "Rust language server for eglot"

[[tool]]
name = "nerd-font-symbols"
via  = "chezmoi external → ~/.local/share/fonts/nerd-symbols (nerd-fonts v3.5.0 NerdFontsSymbolsOnly.tar.xz, pinned)"
why  = "Bar/OSD/terminal icon glyphs; not packaged in Fedora. Symbols-only (~2 MB) rather than a patched family, so the text font is a separate decision. NOTE: only the Material Design range (U+F0001+) actually renders under this font — the FontAwesome, Codicon and Devicon ranges do not, which is why every glyph in the shell is an MD codepoint"

[[tool]]
name = "maple-mono"
via  = "chezmoi external → ~/.local/share/fonts/maple-mono (github.com/subframe7536/maple-font v7.9 MapleMono-TTF.zip, pinned + sha256)"
why  = "The coding font — terminal, Emacs, and everything else resolving `monospace`, which home/dot_config/fontconfig/conf.d/50-qshell.conf pins to it. User decision 2026-08-06, and deliberately NOT switchable from the Font menu (that picker moves the UI font only). Fedora packages no Maple Mono. The plain TTF build (1.8 MB, ligatures on) rather than MapleMono-NF (21 MB): icon glyphs already come from the symbols-only Nerd Font above, so the patched build would buy nothing. MapleMonoNL-* is the same font without ligatures if that is ever wanted; the -CN builds add Chinese and are ~160 MB"

[[tool]]
name = "voxtype"
via  = "upstream install (github.com/peteonrails/voxtype releases, voxtype.io/download) → ~/.local/bin/voxtype, then `voxtype setup --download --model base.en` and `voxtype setup systemd`"
why  = "Push-to-talk voice-to-text; what the bar's dictation indicator follows and what Mod+Ctrl+X / F9 drive"

# Notes on the voxtype entry above (installed by hand 2026-08-06, v0.7.5):
#
#   * Fedora does not package it — `dnf search voxtype` finds nothing — so it
#     is a single user-local binary: an 11 MB stripped aarch64 ELF in
#     ~/.local/bin, no rpm, no dnf update path. `voxtype check-update` is the
#     only upgrade channel.
#   * `voxtype info variants` reports AVX2=false and no GPU on this Mac, so
#     transcription is plain CPU whisper.cpp. The model itself
#     (~/.local/share/voxtype/models/ggml-base.en.bin, 141 MB) is downloaded,
#     not in this repo.
#   * `voxtype setup systemd` writes ~/.config/systemd/user/voxtype.service,
#     which is NOT chezmoi-managed (unlike taildrop-receive.service) — a
#     restore has to re-run that command, and the daemon only runs because
#     `systemctl --user enable --now voxtype` was run once.
#   * The daemon publishes its state to $XDG_RUNTIME_DIR/voxtype/state, which
#     is what `voxtype status --follow` streams and therefore what
#     bin/voxtype-status and the bar's dictation indicator read. Because the
#     state is a file rather than a connection, the follower survives a daemon
#     restart (verified).
#   * voxtype's own evdev hotkey ([hotkey] key = SCROLLLOCK) needs the user in
#     the `input` group and is inert here; the niri binds (Mod+Ctrl+X, F9 →
#     `voxtype record toggle`) are what drive it instead, which is upstream's
#     documented compositor-keybinding mode.
