# ------------------------------------------------------------------ optional

# Removed 2026-08-06 by user decision, together: fuzzel and cliphist, plus the
# nanosvg dependency dnf then had no use for — 3 packages, 3 MiB. Both were
# scaffolding the shell had already replaced and both had been marked SUPERSEDED
# here for a while, pending exactly this call:
#
#   * fuzzel was the interim launcher and a theme fan-out target. Modules/Launcher
#     replaced it, niri's Mod+D has pointed at `qs ipc call launcher toggle` since
#     then, and templates/fuzzel.ini.tmpl is deleted with this commit.
#   * cliphist was the clipboard history. Modules/Clipboard + bin/clipboard-capture
#     own the store (~/.local/state/qshell/clipboard) and nothing in the repo has
#     called cliphist since. wl-clipboard stays — it is what our own capture and
#     the pickers use.

# Removed 2026-08-06 by user decision ("I no need bangla input"): fcitx5,
# fcitx5-m17n and m17n-db, plus the fcitx5-data/fcitx5-libs/m17n-lib/xcb-imdkit
# dependencies dnf then had no use for — 8 packages, 22 MiB. They had been
# installed since the first manifest but never configured (no ~/.config/fcitx5,
# no autostart, no user unit, and no GTK_IM_MODULE/QT_IM_MODULE/XMODIFIERS
# anywhere in this repo), so nothing depended on them. There is no input-method
# framework on this desktop now; adding one back means an entry here plus the
# environment variables, which is why this note stays instead of a silent gap.

# ------------------------------------------------------------------ non-dnf tools
# Installed by chezmoi scripts / declared externals, recorded here so the
# manifest stays the complete inventory.

[[tool]]
name = "node"
via  = "mise use -g node@lts"
why  = "Node runtime, version-managed per decision 2026-08-05"

[[tool]]
name = "pnpm"
via  = "corepack enable pnpm"
why  = "The package manager. Never Bun"

[[tool]]
name = "shopify-cli"
via  = "pnpm add -g @shopify/cli"
why  = "Shopify apps + themes; Node-based — aarch64 compatibility to be verified at install time"

[[tool]]
name = "rust-analyzer"
via  = "rustup component add rust-analyzer"
why  = "Rust language server for eglot"

[[tool]]
name = "nerd-font-symbols"
via  = "chezmoi external → ~/.local/share/fonts/nerd-symbols (nerd-fonts v3.5.0 NerdFontsSymbolsOnly.tar.xz, pinned)"
why  = "Bar/OSD/terminal icon glyphs; not packaged in Fedora. Symbols-only (~2 MB) rather than a patched family, so the text font is a separate decision. NOTE: only the Material Design range (U+F0001+) actually renders under this font — the FontAwesome, Codicon and Devicon ranges do not, which is why every glyph in the shell is an MD codepoint"

[[tool]]
name = "maple-mono"
via  = "chezmoi external → ~/.local/share/fonts/maple-mono (github.com/subframe7536/maple-font v7.9 MapleMono-TTF.zip, pinned + sha256)"
why  = "The coding font — terminal, Emacs, and everything else resolving `monospace`, which home/dot_config/fontconfig/conf.d/50-qshell.conf pins to it. User decision 2026-08-06, and deliberately NOT switchable from the Font menu (that picker moves the UI font only). Fedora packages no Maple Mono. The plain TTF build (1.8 MB, ligatures on) rather than MapleMono-NF (21 MB): icon glyphs already come from the symbols-only Nerd Font above, so the patched build would buy nothing. MapleMonoNL-* is the same font without ligatures if that is ever wanted; the -CN builds add Chinese and are ~160 MB"

[[tool]]
name = "dropbox"
via  = "run_after_06-dropbox.sh, x86_64 only: dropboxd tarball (dropbox.com/download?plat=lnx.x86_64) into ~/.dropbox-dist + their python3 dropbox.py CLI as ~/.local/bin/dropbox + a script-written user unit keeping the daemon up"
why  = "Dropbox on the NUC (user decision 2026-08-06), feeding the bar's dropbox widget and panel. Headless on purpose: no RPM Fusion nonfree, no nautilus chain — the proprietary daemon and the official CLI are the whole requirement. The first link is interactive (dropbox start prints a login URL; the widget's login row does the same). No aarch64 build exists, so the Macs are excluded by the script's arch gate"

