# packages/manifest.toml — the single source of truth for what is installed and why.
#
# The chezmoi script .chezmoiscripts/run_onchange_before_install-packages.sh.tmpl
# hashes this file, so editing it re-runs installation on every machine at the
# next `chezmoi apply`.
#
# Every dnf invocation uses --setopt=install_weak_deps=False (also set globally
# in /etc/dnf/dnf.conf).
#
# Fields:
#   name     — dnf package name
#   category — core | shell | dev | optional
#   arch     — all | aarch64 | x86_64   (install only on matching machines)
#   why      — one-line justification; a package with no honest justification
#              does not get installed.

# ------------------------------------------------------------------ repos

[[copr]]
name = "errornointernet/quickshell"
why  = "Quickshell is not in Fedora; this COPR publishes working aarch64 + x86_64 builds for F43/F44 (verified 2026-08-05)"

[[copr]]
name = "jdxcode/mise"
why  = "mise is not in Fedora; author's COPR builds aarch64 + x86_64 for F43/F44 (verified 2026-08-05) — one repo mechanism for the install script"

# ------------------------------------------------------------------ core
# The machine is usable as a desktop without anything below `dev`.

[[pkg]]
name = "foot"
category = "core"
arch = "all"
why = "Terminal. Lightest maintained Wayland-native terminal; retheme-able live via OSC sequences"

[[pkg]]
name = "wl-clipboard"
category = "core"
arch = "all"
why = "wl-copy/wl-paste — Wayland clipboard CLI; required by cliphist and shell scripts"

[[pkg]]
name = "cliphist"
category = "core"
arch = "all"
why = "SUPERSEDED by Modules/Clipboard — the shell now owns the history store itself (bin/clipboard-capture + ~/.local/state/qshell/clipboard). Nothing in the repo calls cliphist any more; kept installed pending the user's removal decision, like fuzzel"

[[pkg]]
name = "jq"
category = "core"
arch = "all"
why = "JSON writer and reader for bin/clipboard-capture and bin/reminder — clipboard payloads and reminder messages are arbitrary text, and hand-rolling the string escaping in bash is a correctness bug waiting to happen. The only two places in the repo that need it (the network helpers deliberately use grep/awk instead)"

[[pkg]]
name = "libnotify"
category = "core"
arch = "all"
why = "notify-send, the only way the shell's own bin/ scripts reach the notification server we host (bin/reminder's confirmations and fires, the emoji and clipboard pickers' copy toasts). Pulled in as a dependency today; named here because the reminder timers are useless without it"

[[pkg]]
name = "grim"
category = "core"
arch = "all"
why = "Wayland screenshot capture"

[[pkg]]
name = "slurp"
category = "core"
arch = "all"
why = "Region selection for grim (screenshot area picking)"

[[pkg]]
name = "niri"
category = "core"
arch = "all"
why = "The compositor. Hard-requires xwayland-satellite (auto-spawned by niri >= 25.08 when an X11 client connects), so that is not listed separately"

[[pkg]]
name = "xdg-desktop-portal-gnome"
category = "core"
arch = "all"
why = "Screencast/screenshot portal backend for niri (was a niri weak dep; claimed intentionally)"

[[pkg]]
name = "xdg-desktop-portal-gtk"
category = "core"
arch = "all"
why = "Portal backend for GTK apps: settings, and the FileChooser FALLBACK behind the shell's own picker — see home/dot_config/xdg-desktop-portal/niri-portals.conf. Load-bearing in two ways: bin/qshell-portal delegates to it when the shell is unreachable, and it is what the preference list falls back to if the qshell backend is not registered. The gnome backend cannot serve either role: it advertises FileChooser but delegates it to nautilus, which is not installed, so every request died with \"The name is not activatable\" and no dialog ever appeared (was a niri weak dep; claimed intentionally)"

[[pkg]]
name = "wireplumber"
category = "core"
arch = "all"
why = "PipeWire session manager — no audio routing without it (was a niri weak dep; claimed intentionally)"

[[pkg]]
name = "jetbrains-mono-fonts"
category = "core"
arch = "all"
why = "Base mono font; the Nerd Font glyph variant is not packaged in Fedora and comes via chezmoi external (see [[tool]] nerd-font)"

[[pkg]]
name = "brightnessctl"
category = "core"
arch = "aarch64"
why = "One-shot backlight get/set for the OSD path (keybind → shell IPC → brightnessctl); laptops/HDMI-less Macs only — the NUC has no backlight"

[[pkg]]
name = "qrencode"
category = "core"
arch = "all"
why = "Renders the Wi-Fi share QR matrix for the network panel (bin/network-qr pipes it through `qrencode --type ASCII`); the panel hides its share button when this is missing, so the feature is dead without it"

[[pkg]]
name = "wtype"
category = "core"
arch = "all"
why = "`xdotool type` for Wayland — how voxtype puts a finished transcript into the focused window (see [[tool]] voxtype). Without it voxtype falls back to the clipboard and dictation stops short of actually typing (`voxtype setup check` says so in as many words). Installed 2026-08-06; it is also this machine's only key-injection tool, so the emoji picker and clipboard manager can now paste into the focused window the way omarchy does, instead of only copying and notifying"

[[pkg]]
name = "power-profiles-daemon"
category = "core"
arch = "all"
why = "D-Bus power-profile switching (power-saver/balanced/performance) behind the power panel's profile row; quickshell's PowerProfiles service is dead air without the daemon"

[[pkg]]
name = "wlsunset"
category = "core"
arch = "all"
why = "Wayland gamma/night-light daemon driven by the shell's nightlight service and indicator (omarchy uses hyprsunset; wlsunset is the compositor-neutral equivalent for niri)"

[[pkg]]
name = "tailscale"
category = "core"
arch = "all"
why = "The tailnet joining these three machines, and what the bar's `tailscale` widget and panel read (`tailscale status --json`, `exit-node list`, `switch --list`); Fedora packages it directly, aarch64 and x86_64 alike, so no third-party repo is needed. Installed 2026-08-05 by hand: dnf install + `systemctl enable --now tailscaled` + `tailscale up`. The daemon is not started by anything in this repo"

# Notes on the tailscale entry above, both of which the shell has to live with:
#
#   * `tailscale up`, `down`, `set` and the profile list all refuse a non-root
#     user until the operator is set once, with
#         sudo tailscale set --operator=$USER
#     — not done on this machine as of 2026-08-05, so the panel is read-only
#     here and surfaces an "Authorize Tailscale operator" row that runs exactly
#     that command under pkexec, rather than letting the switch fail silently.
#   * the panel's Taildrop send button falls back to a file chooser
#     (bin/file-select) when no files are named, which goes through
#     xdg-desktop-portal — and therefore, since bin/qshell-portal registered
#     the shell as the FileChooser backend, through the shell's own picker.
#
# Tailscale also publishes its own dnf repo, which carries releases sooner than
# Fedora's — same package name, same two architectures, and only one of the two
# should ever be enabled:
#     sudo dnf config-manager addrepo \
#       --from-repofile=https://pkgs.tailscale.com/stable/fedora/tailscale.repo

# NOT installed, listed for the record: the bar carries a `dropbox` widget
# (shell/Modules/Bar/widgets/Dropbox.qml, off the default layout — add
# "dropbox" to a bar section to use it), which stays hidden and idle unless a
# Dropbox CLI is on PATH. On Fedora that CLI comes from **nautilus-dropbox**,
# which is NOT in Fedora proper: it lives in RPM Fusion nonfree (a repo this
# machine does not enable), and Dropbox also publishes its own
# nautilus-dropbox rpm at dropbox.com/install-linux. Either one installs
# /usr/bin/dropbox, which then downloads the proprietary daemon on first
# `dropbox start` (bin/dropbox-status probes for `dropbox-cli` first, upstream
# omarchy's Arch name, then `dropbox`).
#
# It is deliberately not an entry here, and cannot become one on the two Macs:
# Dropbox ships no aarch64 Linux daemon at all, so nautilus-dropbox is
# x86_64-only and only the Intel NUC could ever run it. Adding it would also
# mean enabling RPM Fusion nonfree and accepting a proprietary always-on
# daemon — both decisions for the user, not for the manifest.
#
# NOT installed, listed for the record: the network panel's speed test needs
# nothing beyond curl (bin/network-speedtest measures /proc/net/dev deltas
# while curl saturates fast.com's endpoints), and `iw` is used only when it
# happens to be present, for the dBm and bitrate readings nmcli does not
# report. Neither is worth a package entry on its own.

