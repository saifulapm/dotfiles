# falling back to `vi` for one quick edit, which is exactly what vi is for.

[[tool]]
name = "satty"
via  = "home/.chezmoiscripts/run_after_07-satty.sh (github.com/gabm/Satty release binary, pinned v0.22.0, aarch64 AND x86_64) → ~/.local/bin/satty"
why  = "Screenshot annotation — bin/screenshot-annotate opens the clipboard image (Mod+Shift+A) or a fresh slurp region (Shift+Print) in it, and the capture menu's annotate rows hide without it. The flow is the pre-qshell dotfiles-linux one, kept on the same tool. Fedora does not package satty, but upstream ships binaries for both our arches, so unlike voxtype the install is scripted. Links GTK4 (already present here via the portal chain; a machine where it fails to start wants `dnf install gtk4`)"

[[tool]]
name = "voxtype"
via  = "upstream install (github.com/peteonrails/voxtype releases, voxtype.io/download) → ~/.local/bin/voxtype, then `voxtype setup --download --model base.en` and `voxtype setup systemd`"
why  = "Push-to-talk voice-to-text; what the bar's dictation indicator follows and what Mod+Ctrl+X / F9 drive"

# Notes on the voxtype entry above (installed by hand 2026-08-06, v0.7.5):
#
#   * Fedora does not package it — `dnf search voxtype` finds nothing — so it
#     is a single user-local binary: an 11 MB stripped aarch64 ELF in
#     ~/.local/bin, no rpm, no dnf update path. `voxtype check-update` is the
#     only upgrade channel.
#   * `voxtype info variants` reports AVX2=false and no GPU on this Mac, so
#     transcription is plain CPU whisper.cpp. The model itself
#     (~/.local/share/voxtype/models/ggml-base.en.bin, 141 MB) is downloaded,
#     not in this repo.
#   * `voxtype setup systemd` writes ~/.config/systemd/user/voxtype.service,
#     which is NOT chezmoi-managed (unlike taildrop-receive.service) — a
#     restore has to re-run that command, and the daemon only runs because
#     `systemctl --user enable --now voxtype` was run once.
#   * The daemon publishes its state to $XDG_RUNTIME_DIR/voxtype/state, which
#     is what `voxtype status --follow` streams and therefore what
#     bin/voxtype-status and the bar's dictation indicator read. Because the
#     state is a file rather than a connection, the follower survives a daemon
#     restart (verified).
#   * voxtype's own evdev hotkey ([hotkey] key = SCROLLLOCK) needs the user in
#     the `input` group and is inert here; the niri binds (Mod+Ctrl+X, F9 →
#     `voxtype record toggle`) are what drive it instead, which is upstream's
#     documented compositor-keybinding mode.

