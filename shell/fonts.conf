<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The shell's own fontconfig: Qt's default font and every fallback land on the themes' faces, never on the system's sans. -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <!-- Adwaita Mono second, for the symbols Maple Mono lacks (↵ ␣ ⌃ ▮). -->
  <alias binding="strong"><family>sans-serif</family><prefer><family>Maple Mono</family><family>Adwaita Mono</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Maple Mono</family><family>Adwaita Mono</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Maple Mono</family><family>Adwaita Mono</family></prefer></alias>
  <!-- The Bengali faces carry no ASCII comma, colon or brackets; Noto's Latin face of the same voice draws them, set close to the Bangla, not Maple Mono. -->
  <alias binding="strong"><family>Noto Sans Bengali</family><accept><family>Noto Sans</family></accept></alias>
  <alias binding="strong"><family>Noto Serif Bengali</family><accept><family>Noto Serif</family></accept></alias>
</fontconfig>
