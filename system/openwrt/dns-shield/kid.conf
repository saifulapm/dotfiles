# DNS Shield's Kid resolver: a Kid device's port 53 is DNATed here, so it answers from AdGuard DNS Family and refuses the blocked names.
port=5353
listen-address=192.168.0.1
bind-interfaces
user=dnsmasq
pid-file=
no-resolv
no-hosts
domain-needed
bogus-priv
cache-size=1000
server=94.140.14.15
server=94.140.15.16
server=/lan/192.168.0.1
rev-server=192.168.0.0/24,192.168.0.1
log-queries=extra
log-facility=/tmp/dns-shield/kid.log
conf-file=/etc/dns-shield/blocks.conf
conf-file=/tmp/dns-shield/youtube.conf
conf-file=/etc/dns-shield/gambling.conf
conf-file=/tmp/dns-shield/allow.conf
