# bin/dots-dev's WirePlumber: the live policy without hardware, D-Bus or saved state, so it links and moves the nested streams and never reaches a live bus, card or player.
wireplumber.profiles = {
  dots-dev = {
    inherits = [ policy, mixin.systemwide-session, mixin.stateless ]
    support.dbus = disabled
    support.system-dbus = disabled
    support.modem-manager = disabled
    support.mpris = disabled
    api.notifications = disabled
  }
}
