# bin/dots-dev's own PipeWire: null sinks and a source, dots-null the default, so volume checks never reach the live one.
# The link factory lets the nested WirePlumber link streams. dots-mic is a loopback's Audio/Source fed from dots-null's monitor, as the live mic is a filter chain's, since a null node of class Audio/Source fails to start once a stream records from it.
context.properties = { core.daemon = true core.name = pipewire-0 support.dbus = false }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-access }
  { name = libpipewire-module-link-factory }
  { name = libpipewire-module-loopback args = { audio.position = [ FL FR ] capture.props = { node.name = dots-mic-feed target.object = dots-null stream.capture.sink = true node.dont-reconnect = true } playback.props = { node.name = dots-mic node.description = "Dots null source" media.class = Audio/Source } } }
]
context.objects = [
  { factory = metadata args = { metadata.name = default metadata.values = [ { key = default.audio.sink type = "Spa:String:JSON" value = { name = dots-null } } ] } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = dots-null node.description = "Dots null sink" media.class = Audio/Sink priority.session = 2000 audio.position = [ FL FR ] monitor.channel-volumes = true } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = dots-null-2 node.description = "Dots second sink" media.class = Audio/Sink audio.position = [ FL FR ] monitor.channel-volumes = true } }
]
