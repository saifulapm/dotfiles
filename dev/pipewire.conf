# bin/dots-dev's own PipeWire: null sinks and a null source, dots-null the default, so volume checks never reach the live one.
# The link factory lets the nested WirePlumber link streams; a MONO null source stalls its linking, so dots-mic is stereo.
context.properties = { core.daemon = true core.name = pipewire-0 support.dbus = false }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-access }
  { name = libpipewire-module-link-factory }
]
context.objects = [
  { factory = metadata args = { metadata.name = default metadata.values = [ { key = default.audio.sink type = "Spa:String:JSON" value = { name = dots-null } } ] } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = dots-null node.description = "Dots null sink" media.class = Audio/Sink audio.position = [ FL FR ] monitor.channel-volumes = true } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = dots-null-2 node.description = "Dots second sink" media.class = Audio/Sink audio.position = [ FL FR ] monitor.channel-volumes = true } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = dots-mic node.description = "Dots null source" media.class = Audio/Source audio.position = [ FL FR ] } }
]
