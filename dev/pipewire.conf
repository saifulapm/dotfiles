# bin/dots-dev's own PipeWire: one null sink as the default, so volume checks never reach the live one.
context.properties = { core.daemon = true core.name = pipewire-0 support.dbus = false }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-access }
]
context.objects = [
  { factory = metadata args = { metadata.name = default metadata.values = [ { key = default.audio.sink type = "Spa:String:JSON" value = { name = dots-null } } ] } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = dots-null node.description = "Dots null sink" media.class = Audio/Sink audio.position = [ FL FR ] monitor.channel-volumes = true } }
]
