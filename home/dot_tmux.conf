# tmux (managed by chezmoi) — port of the mac .tmux.conf, 2026-08-07.
# Linux deltas: terminal-overrides target foot instead of kitty; the shell
# comes from the login shell (fish) so no default-shell override is needed.

# UX
set-option -g mouse on               # Enable mouse support
set-option -g status-keys vi         # Use vi keys in status bar
set-option -g mode-keys vi           # Use vi keys in copy mode
set-option -g escape-time 0          # Remove the delay before the escape key is sent

set-option -g base-index 1           # Start counting windows from 1
set-option -g pane-base-index 1      # Start counting panes from 1
set-option -g renumber-windows on    # Renumber windows when a window is closed

set-option -g detach-on-destroy off  # Switch to another session when the current session is destroyed

set-option -g history-limit 10000    # Keep 10000 lines of history

new-session -n "#{host_short}" # tmux attach will attach otherwise create session

setw -g monitor-activity off
set -g visual-activity off
set -g status-interval 1

set -g allow-rename off
set -g set-titles on
set -g set-titles-string '#T'

set -g extended-keys on

# hide statusbar on single window
set-hook -g window-linked 'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g window-unlinked 'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'

# UI — layout here, colors in the theme file.
#
# bin/theme-apply renders templates/tmux-theme.tmpl to ~/.config/tmux/theme.conf
# on every theme change; that file owns the pane borders, the message style,
# the transparent status background and the three status-bar format strings
# (tmux bakes #[fg=…] into the format itself, so those colors cannot live apart
# from the strings they style). The mac's hardcoded tokyo-night literals used
# to sit right here — the template's header records what each one became.
#
# -q so a tmux started before the first theme-apply still comes up; it just
# comes up unstyled rather than erroring.
set -g status-left-length 80
set -g status-justify centre
set -g window-status-separator " "
source-file -q ~/.config/tmux/theme.conf

# Terminal — foot here, not kitty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',foot:Tc'
set -ga terminal-overrides ',foot:RGB'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours
set-option -g focus-events on

# Key bindings
# Remap prefix from Ctrl + b to Ctrl + Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config using prefix + r
unbind r
bind r source-file $HOME/.tmux.conf \; display "CONFIG RELOADED!"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Plugins
# tmux-claude-session-manager: prefix + y launches/attaches a Claude session
# for the current dir in a popup; prefix + u opens the agent picker.
# set -g @claude_args           '--dangerously-skip-permissions'
# Auto-install the plugin on any machine where it isn't cloned yet (the config
# comes from chezmoi, but the plugin code under ~/.tmux/plugins does not).
# run-shell "test -d ~/.tmux/plugins/tmux-claude-session-manager || git clone --depth 1 https://github.com/craftzdog/tmux-claude-session-manager ~/.tmux/plugins/tmux-claude-session-manager"
# run-shell ~/.tmux/plugins/tmux-claude-session-manager/claude_session_manager.tmux

# amx
set -g status-right '#(amx statusline) | %H:%M'
