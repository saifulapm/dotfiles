# tmux (managed by chezmoi) — port of the mac .tmux.conf, 2026-08-07.
# Linux deltas: terminal-overrides target foot instead of kitty; the shell
# comes from the login shell (fish) so no default-shell override is needed.

# UX
set-option -g mouse on               # Enable mouse support
set-option -g status-keys vi         # Use vi keys in status bar
set-option -g mode-keys vi           # Use vi keys in copy mode
set-option -g escape-time 0          # Remove the delay before the escape key is sent

set-option -g base-index 1           # Start counting windows from 1
set-option -g pane-base-index 1      # Start counting panes from 1
set-option -g renumber-windows on    # Renumber windows when a window is closed

set-option -g detach-on-destroy off  # Switch to another session when the current session is destroyed

set-option -g history-limit 10000    # Keep 10000 lines of history

new-session -n "#{host_short}" # tmux attach will attach otherwise create session

setw -g monitor-activity off
set -g visual-activity off
set -g status-interval 1

set -g allow-rename off
set -g set-titles on
set -g set-titles-string '#T'

set -g extended-keys on

# The status bar used to go away on a single-window session — window-linked and
# window-unlinked hooks turning `status` off at one window and on at two. It
# stays on now: status-right carries amx's counts of the agents that are moving
# and the ones stopped for an answer, and a bar that hides itself whenever
# there is one window is a bar those counts would almost never reach.
#
# A hook is server state, not file state: deleting these lines does not unhook
# a server that already ran them, and neither does a reload. That took
# `tmux set-hook -gu window-linked`, its -unlinked twin, and `tmux set -u
# status` to clear the off they had already left on the session.

# UI — layout here, colors in the theme file.
#
# bin/theme-apply renders templates/tmux-theme.tmpl to ~/.config/tmux/theme.conf
# on every theme change; that file owns the pane borders, the message style,
# the transparent status background and the three status-bar format strings
# (tmux bakes #[fg=…] into the format itself, so those colors cannot live apart
# from the strings they style). The mac's hardcoded tokyo-night literals used
# to sit right here — the template's header records what each one became.
#
# -q so a tmux started before the first theme-apply still comes up; it just
# comes up unstyled rather than erroring.
set -g status-left-length 80
set -g status-justify centre
set -g window-status-separator " "
source-file -q ~/.config/tmux/theme.conf

# Terminal — foot here, not kitty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',foot:Tc'
set -ga terminal-overrides ',foot:RGB'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours
set-option -g focus-events on

# Key bindings
# Remap prefix from Ctrl + b to Ctrl + Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config using prefix + r
unbind r
bind r source-file $HOME/.tmux.conf \; display "CONFIG RELOADED!"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# amx — coding agents as tmux panes.
#
# The ✽ moving / ⚠ waiting counts are in status-right, which lives in
# ~/.config/tmux/theme.conf rather than here: tmux bakes the colour into the
# format string, so the call to `amx statusline` had to go where the colour is.
# templates/tmux-theme.tmpl is the file to edit.
#
# csi-u because the view reads shift+enter, shift+↑/↓, alt+↑/↓, alt+1..9 and
# ctrl+←/→ as keys of their own; without extended keys in this format tmux
# hands it the plain ones and those rows do nothing.
set -g extended-keys-format csi-u

# Behind the prefix, not in the root table. A `bind -n M-j` takes alt+j from
# every pane on this server, and the panes here are agents: the view alone
# reads alt+a, alt+m, alt+e, alt+w, alt+d, alt+enter, alt+backspace and
# alt+1..9, and the vendors read more. C-Space first costs one keystroke and
# steals nothing. h/j/k/l stay pane navigation.
bind a run-shell "amx attach --waiting"  # the agent stopped on a question
bind A run-shell "amx attach --next"     # the next one along the wall
bind C-a run-shell "amx attach --last"   # back to the one before this
# The wall itself, in a window of its own, and a second press goes to the
# window already open rather than making another.
bind v run-shell "tmux select-window -t amx 2>/dev/null || tmux new-window -n amx amx"
