# ---------------------------------------------------------------------------
# Server tools pxy runs itself (wiki:server-tools). A model calls a reserved
# function, pxy runs it and feeds the result back in the same turn. The
# `defaults` tables ride EVERY client turn (pi, claude, codex, opencode) with
# no plugin; a client that declares a tool itself keeps its own declaration.
# fusion, search_models and image_generation stay opt-in per request: a panel
# of three plus an analyst on a routine coding turn is cost, not help.
# ---------------------------------------------------------------------------
[server_tools]
enabled = ["web_search", "web_fetch", "datetime", "search_models", "image_generation", "advisor", "subagent", "fusion", "tool_search", "describe_image", "memory", "find_docs", "verify"]
max_tool_calls = 10
# Three cheap, fast, different-family panelists; the strongest model analyses.
fusion_panel = ["deepseek", "glm", "qwen"]
fusion_analyst = "gpt"

[server_tools.defaults.datetime]
timezone = "Asia/Dhaka"

[server_tools.defaults.web_search]
max_results = 5
max_total_results = 20
max_characters = 2000

[server_tools.defaults.web_fetch]
max_content_tokens = 25000
blocked_domains = ["localhost", "127.0.0.1"]

# A stronger model to consult mid-generation; the executor decides when.
[server_tools.defaults.advisor]
model = "gpt"
instructions = "You are a senior staff engineer advising another model mid-task. Be decisive and concrete: name the approach, the pitfalls, and what to verify. No preamble."
max_completion_tokens = 4000

# A cheap, fast worker for self-contained subtasks, with the web tools.
[server_tools.defaults.subagent]
model = "qwen"
instructions = "You are a fast, focused worker. Complete the task exactly as described and return only the requested output."
tools = [{ type = "pxy:web_search" }, { type = "pxy:web_fetch" }]
max_tool_calls = 6
max_completion_tokens = 8000

# Current library docs out of Context7, cached a week (wiki:find-docs).
[server_tools.defaults.find_docs]
max_tokens = 4000

# One claim against one passage through Jev; evidence, never a gate (wiki:jev).
[server_tools.defaults.verify]
abstain_below = 0.5

# Re-rank web_search hits with Jev: one extra 70-500 ms call per search.
[server_tools.jev]
rerank_web_search = true
rerank_min = 0.3

# ---------------------------------------------------------------------------
# Request artifact capture — errors only. Failed attempts land in
# ~/.local/share/pxy/captures (0600), bounded to 500 files / 24h.
# Inspect with `pxy captures`, clear with `pxy captures --clean`.
# ---------------------------------------------------------------------------
[capture]
enabled = true
on_error = true
