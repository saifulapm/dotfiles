# opencode.ai emailed 2026-09-03: requests were arriving with NO user agent and
# no `x-opencode-session`, and from 2026-09-06 a missing session header "may
# error". pxy now sends `x-opencode-session` on every provider whose NAME
# starts with "opencode" (the same rule the opencode CLI uses) — the client's
# own id when it sends one, otherwise a conversation-stable fingerprint, never
# a per-request UUID: opencode routes on this value, so a fresh id each turn
# would scatter one conversation across upstreams and lose every cache hit.
# The User-Agent below is Saiful's call: it claims the opencode CLI's identity
# (real format `opencode/<channel>/<version>/<client>`, from their
# installation/index.ts) rather than an honest pxy/0.1.0. Bump the version when
# the local CLI moves — `opencode --version` was 1.18.21 when this was set.
[providers.opencode-zen]
base_url = "https://opencode.ai/zen/v1/chat/completions"
headers = { User-Agent = "opencode/latest/1.18.21/cli" }
models = [
  { id = "muse-spark-1.3-contributor-free", context_length = 1048576 },
  { id = "deepseek-v4-flash-free", context_length = 1000000 },
  { id = "laguna-s-2.1-free", context_length = 1048576 },
  { id = "mimo-v2.5-free", context_length = 1048576 },
  { id = "nemotron-3-ultra-free", context_length = 262144 },
  { id = "nemotron-3.5-lightning-free", context_length = 262144 },
  { id = "ling-3.0-flash-fin-free", context_length = 262144 },
]
[[providers.opencode-zen.accounts]]
name = "github"
api_key = { pass = "AI/opencode-go/github" }
[[providers.opencode-zen.accounts]]
name = "google"
api_key = { pass = "AI/opencode-go/google" }

