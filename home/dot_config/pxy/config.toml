[providers.agentrouter]
format = "anthropic"
base_url = "https://agentrouter.org/v1/messages"
balance_url = "https://agentrouter.org/v1/dashboard/billing/usage"
auth_header = "x-api-key"
api_key = { pass = "AI/agentrouter/main" }
headers = { User-Agent = "claude-cli/2.1.241 (external, cli)" }
discover = false
models = [
  { id = "claude-opus-5", context_length = 1000000 },
  { id = "claude-opus-4-8", context_length = 1000000 },
  { id = "deepseek-v4f", context_length = 128000, force_stream = true },
]
# Their channel pool churns: a model with no live upstream answers 503
# 无可用渠道 ("no channel available"). Skip to the next candidate and cool
# the model briefly instead of surfacing the raw 503. NOTE: [[...]] arrays of
# tables must come AFTER every plain key of their parent table — hence
# `models` above, not below.
[[providers.agentrouter.errors]]
match = "无可用渠道"
action = "skip-cooldown"

[providers.agentrouter-openai]
base_url = "https://agentrouter.org/v1/chat/completions"
api_key = { pass = "AI/agentrouter/main" }
headers = { User-Agent = "claude-cli/2.1.241 (external, cli)" }
discover = false
models = [
  { id = "gpt-5.6-sol", context_length = 1050000 },
  # `effort` here is the upstream's own answer, not models.dev's: probed
  # 2026-09-16 with reasoning_effort="medium" (pi's default) and it 400s with
  # 该模型始终思考，不支持关闭思考；请使用 low、high 或 max — always thinks,
  # cannot be turned off, takes those three. A client that reads this list
  # never sends the "medium" that would burn this candidate; one that ignores
  # it gets a 400 and ordinary failover, which is what happened before.
  { id = "glm-5.3", context_length = 1048576, reasoning = true, effort = ["low", "high", "max"] },
]

[providers.tabitoken]
format = "anthropic"
base_url = "https://tabitoken.com/v1/messages"
balance_url = "https://tabitoken.com/v1/dashboard/billing/usage"
auth_header = "x-api-key"
api_key = { pass = "AI/tabitoken/main" }
discover = false
models = [
