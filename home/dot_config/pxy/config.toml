# NVIDIA NIM — free dev tier (no card; ToS: prototyping/dev only).
# ⚠️ Its failure mode is SILENCE, not an error: NIM accepts the connection and
# then sends ZERO BYTES while the request sits behind a busy worker. Measured
# 2026-09-03, 3 rounds/model at a 25s budget — only lightning answered (3/3);
# deepseek-v4-flash, deepseek-v4-pro, minimax-m3, kimi-k3 and ultra-550b timed
# out 3/3. They are queued, not broken: minimax-m3 did answer on a longer
# leash, at 56.6s. Hence the ordering below — lightning first so a group walk
# reaches the responsive model before the queued ones.
# `timeout_secs` is the whole point of this block. pxy only applies its 30s
# HEADERS_DEADLINE to a MULTI-candidate streaming walk; an explicitly named
# model (`nvidia/kimi-k3`) or any non-streaming call is exempt and waits
# timeout_secs instead — which defaulted to 600, so a silent NIM hung for ten
# minutes before reporting pxy's own "network error".
# It bounds ONE ATTEMPT, not the request: MAX_RETRIES=2 means three tries, so a
# named-and-stalled model now errors in ~2m25s (measured) rather than ~30min.
# Shrink this further if that is still too long to wait on a dead worker.
# ⚠️ It doubles as the per-read stall deadline for streams, and ultra-550b
# legitimately thinks >60s: raise this to ~90 if ultra must work when called
# directly, at the cost of a longer hang while NIM is congested.
# `discover = false` is load-bearing: the catalog is KEY-TIER dependent —
# /v1/models advertises 81 ids, but some 404 "not found for account" on this
# key. `mistralai/mistral-large` was exactly that (listed, yet 404 "Function
# … not found" on every call) and has been removed; `mistralai/mistral-nemotron`
# is the real one if a Mistral model is wanted here.
# No rate-limit headers or quota API, hence the client-side rpm.
[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1/chat/completions"
embeddings_url = "https://integrate.api.nvidia.com/v1/embeddings"
api_key = { pass = "AI/nvidia/main" }
drop_params = ["prompt_cache_key"]
discover = false
timeout_secs = 45
models = [
  { id = "nvidia/nemotron-3.5-lightning-30b-a3b", context_length = 1000000 },
  { id = "minimaxai/minimax-m3", context_length = 1000000 },
  { id = "deepseek-ai/deepseek-v4-flash-0731", context_length = 1000000 },
  { id = "deepseek-ai/deepseek-v4-pro-0813", context_length = 1000000 },
  { id = "moonshotai/kimi-k3", context_length = 1048576 },
  { id = "nvidia/nemotron-3-ultra-550b-a55b", context_length = 1000000 },
]
embedding_models = ["nvidia/nemotron-3-embed-1b"]
[providers.nvidia.limits]
rpm = 40

