discover = false
models = [
  { id = "claude-opus-5", context_length = 1000000 },
  { id = "claude-opus-4-8", context_length = 1000000 },
  { id = "deepseek-v4f", context_length = 128000, force_stream = true },
]
# Their channel pool churns: a model with no live upstream answers 503
# 无可用渠道 ("no channel available"). Skip to the next candidate and cool
# the model briefly instead of surfacing the raw 503. NOTE: [[...]] arrays of
# tables must come AFTER every plain key of their parent table — hence
# `models` above, not below.
[[providers.agentrouter.errors]]
match = "无可用渠道"
action = "skip-cooldown"

