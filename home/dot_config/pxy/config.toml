# pxy config
providers_whitelist = ["opencode-go", "commandcode", "deepseek-ai", "tokenharbor", "zenmux", "aihubmix"]

[server]
port = 4100
api_key = "pxy-local"

[groups.aaa]
name = "AAA"
models = [
  "ollama/nemotron-3-nano:30b",
  "openrouter/openrouter/free",
  "cloudflare/@cf/meta/llama-4-scout-17b-16e-instruct",
  "amd/DeepSeek-V4-Flash",
]

[groups.deepseek]
name = "DS"
reasoning = true
models = [
  "opencode-go/deepseek-flash",
  "commandcode/deepseek/deepseek-v4.1-flash",
  "tokenharbor/deepseek-v4.1-flash",
  "aihubmix/deepseek-v4.1-flash",
  "zenmux/deepseek/deepseek-v4.1-flash",
  "deepseek-ai/deepseek-flash",
]

[groups.muse]
name = "Muse"
reasoning = true
models = [
  "opencode-go/muse-spark-1.3-contributor",
  "commandcode/meta/muse-spark-1.3-contributor",
  "tokenharbor/muse-spark-1-3",
  "aihubmix/muse-spark-1.3",
  "zenmux/meta/muse-spark-1.3-contributor",
  "meta/muse-spark-1.3-contributor",
]

[groups.glm]
name = "GLM"
reasoning = true
models = [
  "commandcode/z-ai/glm-5.3-flashx",
  "tokenharbor/glm-5.3-flashx",
  "opencode-go/glm-5.3-flash",
  "aihubmix/glm-5.3-flashx",
  "zenmux/z-ai/glm-5.3-flashx",
]

[groups.gpt]
name = "GPT"
reasoning = true
models = [
  "opencode-go/gpt-5.6-luna",
  "commandcode/gpt-5.6-luna",
  "tokenharbor/gpt-5.6-luna",
  "aihubmix/gpt-5.6-luna",
  "zenmux/openai/gpt-5.6-luna",
]

[groups.qwen]
name = "Qwen"
reasoning = true
models = [
  "opencode-go/qwen3.8-flash",
  "commandcode/Qwen/Qwen3.8-Flash",
  "aihubmix/qwen3.8-flash",
  "tokenharbor/qwen3.8-flash",
  "zenmux/qwen/qwen3.8-flash",
]

[groups.grok]
name = "Grok"
reasoning = true
models = [
  "opencode-go/grok-4.6",
  "commandcode/xai/grok-4.6",
  "tokenharbor/grok-4.6",
  "aihubmix/grok-4.6",
  "zenmux/x-ai/grok-4.6",
]

[groups.kimi]
name = "Kimi"
reasoning = true
models = [
  "opencode-go/kimi-k3",
  "commandcode/moonshotai/Kimi-K3",
  "tokenharbor/kimi-k3",
  "aihubmix/kimi-k3",
  "zenmux/moonshotai/kimi-k3",
]

# Jev is an evaluation model, not a chat model: the gateway 400s it on
# /v1/chat/completions. It becomes a `[media] systemone` chain and
# `[providers.vercel.media]` capability when m14-verify-jev lands
# (wiki:jev, fact of 2026-09-19).
# [groups.jev]
# name = "Jev"
# models = ["vercel/typesafe-ai/jev"]

[launch]
model = "deepseek"

# ---------------------------------------------------------------------------
# API-key providers (base URLs from OmniRoute registry, docs/06)
# ---------------------------------------------------------------------------
[providers.ollama]
base_url = "https://ollama.com/v1/chat/completions"
api_key = { pass = "AI/ollama/main" }
models = [
  { id = "nemotron-3-nano:30b", context_length = 1048576, reasoning = true },
  { id = "nemotron-3-super", context_length = 262144, reasoning = true },
  { id = "nemotron-3-ultra", context_length = 262144, reasoning = true },
  { id = "gemma4:31b", context_length = 262144, reasoning = true },
]

[providers.deepseek-ai]
base_url = "https://api.deepseek.com/anthropic/v1/messages"
format = "anthropic"
requires_reasoning_replay = true
auth_header = "x-api-key"
balance_url = "https://api.deepseek.com/user/balance"
models_url = "https://api.deepseek.com/models"
api_key = { pass = "AI/deepseek/main" }
models = [
  { id = "deepseek-flash", context_length = 1000000, reasoning = true, effort = ["low", "high", "max"] },
  { id = "deepseek-v4-pro", context_length = 1000000, reasoning = true },
]

[providers.amd]
base_url = "https://developer.amd.com.cn/radeon/api/v1/chat/completions"
balance_url = "https://developer.amd.com.cn/radeon/api/v1/usage"
api_key = { pass = "AI/amd/main" }
models = [
  { id = "DeepSeek-V4-Flash", context_length = 1048576, reasoning = true, free = true },
  { id = "DeepSeek-V4-Flash-Vision-Exp", context_length = 1048576, reasoning = true, effort = ["low", "high", "max"], free = true },
  { id = "Qwen3.8-Flash-Next", context_length = 262144, reasoning = true, effort = ["low", "medium", "xhigh"], free = true },
]
[providers.amd.limits]
rpm = 20

[providers.meta]
base_url = "https://api.meta.ai/v1/messages"
format = "anthropic"
models_url = "https://api.meta.ai/v1/models"
api_key = { pass = "AI/facebook/main" }
models = [
  { id = "muse-spark-1.3", context_length = 1048576, reasoning = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] },
  { id = "muse-spark-1.3-contributor", context_length = 1048576, reasoning = true, effort = ["minimal", "low", "medium", "high", "xhigh"] },
]

[providers.meta.media]
kind = "meta"
images_url = "https://api.meta.ai/v1/images/generations"
image_models = ["muse-image-1.0"]
transcription_url = "https://api.meta.ai/v1/asr/transcribe"
transcription_models = ["muse-voice-transcribe-1.0"]

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1/chat/completions"
balance_url = "https://openrouter.ai/api/v1/credits"
api_key = { pass = "AI/openrouter/main" }
headers = { HTTP-Referer = "http://localhost", X-Title = "pxy" }
models = [
  { id = "openrouter/free", context_length = 200000, reasoning = true },
  { id = "nvidia/nemotron-3-ultra-550b-a55b:free", context_length = 1000000, reasoning = true, effort = ["none", "medium", "high"] },
  { id = "nvidia/nemotron-3.5-lightning:free", context_length = 1000000, reasoning = true, effort = ["none", "high"] },
  { id = "thinkingmachines/inkling-small:free", context_length = 1048576, reasoning = true },
  { id = "dots-studio/dots-3-note-preview:free", context_length = 512000, reasoning = true, effort = ["none", "high"] },
]

[providers.openrouter.limits]
rpm = 20
daily_requests = 1000
reset = "00:00"
reset_tz = "UTC"
[providers.openrouter.media]
systemone_url = "https://openrouter.ai/api/alpha/decisions"
