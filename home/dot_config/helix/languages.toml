# Linux note (2026-08-07): `hx --grammar fetch && hx --grammar build` should
# build ONLY the two custom grammars below (kak, liquid) into
# ~/.config/helix/runtime/grammars — Fedora's helix package ships every stock
# grammar in its system runtime, so building all ~200 locally would be waste.
use-grammars = { only = ["kak", "liquid"] }

[[language]]
name = "html"
formatter = { command = 'prettier', args = ["--parser", "html"] }

[[language]]
name = "json"
formatter = { command = 'prettier', args = ["--parser", "json"] }

[[language]]
name = "css"
formatter = { command = 'prettier', args = ["--parser", "css"] }

[[language]]
name = "javascript"
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "typescript"
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "tsx"
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true

# [[language]]
# name = "php"
# formatter = { command = 'pint', args = ["--no-interaction", "--quiet"] }
# auto-format = true

[language-server.eslint]
args = ["--stdio"]
command = "vscode-eslint-language-server"

[[language]]
name = "typescript"
auto-format = false
language-servers = [
  { except-features = ["format"], name = "typescript-language-server" },
  "eslint",
]

[language-server.emmet-lsp]
command = "emmet-language-server"
args = ["--stdio"]

[[language]]
name = "html"
roots = [".git"]
language-servers = ["emmet-lsp"]

[[language]]
name = "kak"
scope = "source.kak"
file-types = ["kak", "kakrc"]
injection-regex = "^kak$"
comment-token = "#"
indent = { tab-width = 4, unit = "    " }

[[grammar]]
name = "kak"
source = { git = "https://github.com/saifulapm/tree-sitter-kak", rev = "main" }

[[language]]
name = "liquid"
scope = "source.liquid"
file-types = ["liquid"]
injection-regex = "^liquid$"
indent = { tab-width = 4, unit = "    " }

[[grammar]]
name = "liquid"
source = { git = "https://github.com/saifulapm/shopify-liquid-treesitter.git", rev = "main" }
