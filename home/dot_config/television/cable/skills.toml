[metadata]
name = "skills"
description = "Browse and manage local agent skills"

[source]
command = '''for dir in ${DOTFILES:-$HOME/.dotfiles}/skills/*/; do \
  [ -d "$dir" ] || continue; \
  name=$(basename "$dir"); \
  desc=$(awk '/^description:/{sub(/^description: */,""); print; exit}' "$dir/SKILL.md" 2>/dev/null); \
  printf "%s :: %s\n" "$name" "${desc:0:80}"; \
done'''

[preview]
command = '''/bin/cat "${DOTFILES:-$HOME/.dotfiles}/skills/{split: :: :0}/SKILL.md" 2>/dev/null || echo "No SKILL.md found"'''

[ui]
layout = "landscape"

[ui.preview_panel]
size = 50

[keybindings]
enter = "actions:install"
ctrl-e = "actions:edit"
ctrl-u = "actions:update"
ctrl-g = "actions:check"
ctrl-l = "actions:list"
f5 = "actions:find"

[actions.install]
description = "Install selected skill"
command = '''npx skills add "${DOTFILES:-$HOME/.dotfiles}/skills/{split: :: :0}" --copy -a claude-code -y'''
mode = "execute"

[actions.edit]
description = "Edit skill in editor"
command = '''${EDITOR:-vim} "${DOTFILES:-$HOME/.dotfiles}/skills/{split: :: :0}/SKILL.md"'''
mode = "execute"

[actions.update]
description = "Update all installed skills"
command = "npx skills update"
mode = "execute"

[actions.check]
description = "Check for skill updates"
command = "npx skills check"
mode = "execute"

[actions.list]
description = "List installed skills"
command = "npx skills list; npx skills list -g; echo; echo 'Press any key...'; read -n1"
mode = "execute"

[actions.find]
description = "Search skills online"
command = "npx skills find"
mode = "execute"
