# fish-history cable channel (managed by chezmoi — edit in ~/.dotfiles/).
#
# Why this file has to exist at all: `tv init fish` binds ctrl-r to
# `tv fish-history`, but television 0.15.9 bundles only bash/zsh-flavoured
# history channels — `tv list-channels` shows bash-history and no
# fish-history. So the stock fish integration ships a keybinding pointing at a
# channel that isn't there, and ctrl-r died with "Channel not found:
# fish-history". Upstream's `tv update-channels` would fix it by downloading
# the whole ~40-channel cable collection into ~/.config/television/cable/,
# unmanaged — this single managed file is the same fix, minus the sprawl, and
# survives a fresh machine setup. (user pick 2026-08-12)
#
# Re-check on television upgrades: once upstream bundles fish-history, this
# file still wins (config-dir cable overrides built-ins) — drop it then.

[metadata]
name = "fish-history"
description = "A channel to select from your fish history"
requirements = ["fish"]

[source]
# `fish -c` sources conf.d/*.fish, so 10-history.fish sets fish_history to the
# machine slug and `history` reads THIS machine's session file
# (~/.local/share/fish/<machine>_history) — the per-machine write domain stays
# intact. The niri-exec block in config.fish is guarded on
# is-login + is-interactive, and the prompt/mise/zoxide/tv init on
# is-interactive, so none of it runs here.
#
# No `sed`-reverse or `awk '!seen[$0]++'` dedup like the bundled bash-history
# channel needs: fish's history is already newest-first and already unique
# (re-running a command moves it rather than appending a duplicate) — verified
# 210 entries, 210 unique. no_sort preserves that recency order.
command = "fish -c 'history'"
no_sort = true
frecency = false
