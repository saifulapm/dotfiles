# elfeed-kak subscriptions — the source of truth (ADR-0004); the database at
# ~/.local/share/elfeed-kak/db.sqlite only holds fetched entries and read
# state. Ported from the elfeed-feeds list in ~/.config/emacs/init.el.

[settings]
default_filter    = "#50 +unread"
# B opens the entry in mpv — stands in for elfeed-tube-mpv on YouTube feeds.
secondary_browser = "mpv"
title_min_width   = 45

