agent = "claude"
max_agents = 15
subagent_depth = 3
max_total = 6
worktrees = false
notifications = "both"
trust = true
theme = "dots"
park_after = 1800
diff = "delta --paging=always"

[keys]
"alt+g" = "lazygit"

[claude]
args = ["--allow-dangerously-skip-permissions"]

[claude.env]
CLAUDE_CODE_DISABLE_AUTO_MEMORY = "1"
CLAUDE_CODE_DISABLE_FILE_CHECKPOINTING = "1"
CLAUDE_CODE_DISABLE_TERMINAL_TITLE = "1"
CLAUDE_CODE_RETRY_WATCHDOG = "1"
CLAUDE_CODE_ENABLE_AWAY_SUMMARY = "0"
DISABLE_COST_WARNINGS = "1"

[pi]
models = ["deepseek", "glm", "muse", "gpt", "qwen", "grok", "kimi"]
args = ["--approve"]

[pi.env]
WORKFLOW_AGENT = "1"

[codex.env]
WORKFLOW_AGENT = "1"

[opencode.env]
WORKFLOW_AGENT = "1"
