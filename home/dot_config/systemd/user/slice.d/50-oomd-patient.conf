# Managed by ~/.dotfiles. Fedora marks EVERY user-manager slice — including
# the root slice (the whole user@ session) and app.slice, where bin/app-run
# puts each app — ManagedOOMMemoryPressure=kill at 80% pressure held 20s
# (/usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf). On the
# 8 GB machines a heavy work session crossed that and oomd killed working
# apps. 95% held 60s keeps oomd strictly last-resort: the machine is allowed
# to feel slow for a while (zswap + 16 G swap absorb the load, and
# mempressure.service warns on screen first) instead of losing work.
# Type-level drop-in: applies to all user slices, lexically after Fedora's
# 10-* so these values win.
[Slice]
ManagedOOMMemoryPressureLimit=95%
ManagedOOMMemoryPressureDurationSec=60s
