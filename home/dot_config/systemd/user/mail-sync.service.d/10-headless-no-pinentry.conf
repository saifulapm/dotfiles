# NUC only — home/.chezmoiignore keeps this drop-in off the machines that have
# somebody sitting at them. Same reason as the imapnotify@.service drop-in
# beside it, and bin/mail-sync's own comment: a prompt drawn here hangs on an
# empty screen while holding gpg-agent's single pinentry lock, which is what
# made `ssh nuc` freeze on its own gpg-unlock. bin/pinentry-auto fails the
# request instead; a sync that cannot read the password logs and exits, and
# the next one after an SSH unlock succeeds.
[Service]
Environment=PINENTRY_USER_DATA=error
