# NUC only — home/.chezmoiignore keeps this drop-in off the machines that have
# somebody sitting at them.
#
# The parent unit's header explains why the watcher is tied to the graphical
# session: it shells out to `pass`, and a locked gpg-agent answers by drawing a
# pinentry-qt dialog, which needs somewhere to draw. On the NUC that session
# exists and the human does not, so the dialog lands on a monitor in an empty
# room — and gpg-agent serialises EVERY request behind one prompt, so it
# freezes gpg for the whole machine until it times out, whereupon Restart draws
# the next one. Measured after the headless boot on 2026-09-21: one prompt per
# ~60 s, and `ssh nuc` hung on its own gpg-unlock, including the
# --pinentry-mode=error probe that is supposed to cost nothing (exit 124 at an
# 8 s timeout with a stale pinentry up; exit 2 in 0 s once it was killed).
#
# bin/pinentry-auto reads this and exits instead of prompting. The watcher was
# failing its logins either way — gpg-agent.conf has always said the cache dies
# with the session and nothing works until a human types the passphrase once —
# it just stops taking the lock down with it, which leaves the SSH login able
# to draw the one prompt on this box that ever gets answered.
[Service]
Environment=PINENTRY_USER_DATA=error
