# libinput-gestures — the macOS trackpad gestures niri cannot bind itself.
#
# Why this file exists at all: niri implements exactly three touchpad
# gestures internally — three-finger horizontal moves the view, three-finger
# vertical switches workspaces, four-finger vertical opens/closes the
# overview — and offers no way to rebind them or add others. Upstream issue
# #372 ("Gesture bindings") is open and labelled "needs design", so unlike
# Sway's `bindgesture` there is simply no compositor-side knob to reach for.
# This daemon reads /dev/input directly instead (hence the `input` group).
#
# That parallel read is the single rule every binding below obeys. niri does
# not see these events as consumed, so any gesture niri already acts on fires
# TWICE — once in the compositor, once here. Three-finger swipes and
# four-finger vertical swipes are therefore left strictly alone, and the
# bindings live on pinches, which niri never acts on. (niri does forward
# pinches to the focused window through zwp_pointer_gestures_v1, but every
# toolkit that implements pinch-zoom — GTK, Firefox, Chromium — binds it to
# two fingers, so three- and four-finger pinches land nowhere else.)
#
# Deliberately NOT set: `device`. Auto-detection is load-bearing rather than
# merely convenient, because this file is shared by both machines and the
# node numbering differs: the trackpad is /dev/input/event0 on the MacBook
# ("Apple MTP multi-touch", on SPI) and /dev/input/event4 on the Mac mini
# ("Apple Inc. Magic Trackpad", over Bluetooth, where numbering moves between
# boots). Pinning a path would silently break one machine or the other.
#
# Both pads are gesture-identical otherwise: the same capability bits
# (KEY=e520 10000 — FINGER through QUINTTAP, so five fingers are detectable)
# and libinput reports `Capabilities: pointer gesture` on each.
#
# Reload after editing:  systemctl --user restart libinput-gestures
# See what fires:        libinput-gestures -d      (debug, actions nothing)
# Check config parsing:  libinput-gestures -l

# ------------------------------------------------------------------ Launchpad
# macOS pinches thumb + three fingers together for Launchpad — four contact
# points, which is exactly a four-finger pinch here.
gesture pinch in 4 vicinae toggle

# -------------------------------------------------- Notification Centre
# macOS uses a two-finger swipe in from the right edge, which has no
# equivalent here: libinput has no concept of an edge swipe, and the right
# edge is already the shell's own (Notes/NotesEdge.qml holds a 1-px hot strip
# down it). Pairing it with the Launchpad pinch as the opposite motion keeps
# the whole four-finger pinch family on "show me a panel".
gesture pinch out 4 qs ipc call notifs toggle

# ------------------------------------------------------------ free slots
# Three-finger pinch is unclaimed by both niri and every app toolkit, so it is
# the safe place to add more. Candidates, left off until wanted:
# gesture pinch in 3 qs ipc call emojis toggle
# gesture pinch out 3 qs ipc call notes toggle
#
# Rotation is also free at three or four fingers (at two it is the rotate
# gesture apps receive):
# gesture pinch clockwise 4 <command>
# gesture pinch anticlockwise 4 <command>
#
# Four-finger HORIZONTAL swipes are probably free — niri documents only
# four-finger vertical for the overview — but this was not verified against a
# live pad, and a wrong guess here means the gesture fires twice rather than
# failing loudly. Test with `libinput-gestures -d` before enabling:
# gesture swipe left 4 <command>
# gesture swipe right 4 <command>
#
# Five-finger gestures are NOT listed: the hardware reports QUINTTAP on both
# pads, but whether libinput synthesises a five-finger gesture from it is
# device-dependent and untested here. `libinput-gestures -d` will show them
# if they exist.

# Minimum travel before a swipe counts, in pixels. Upstream default is 0
# (no threshold); left at the default deliberately — the bindings above are
# all pinches, which this does not affect.
# swipe_threshold 0
