# Portal backend preferences for this niri session.
#
# This is niri's own /usr/share/xdg-desktop-portal/niri-portals.conf with one
# line added. xdg-desktop-portal uses the FIRST config file it finds and does
# not merge the rest, so the shipped lines are repeated here verbatim rather
# than inherited.
#
# FileChooser is answered by the shell itself: `qshell` is bin/qshell-portal,
# which draws shell/Modules/FilePicker in the current theme. Every portal-using
# app — Firefox, Electron apps, flatpaks, and our own bin/file-select — gets
# that window instead of a GTK one.
#
# gtk is kept behind it as the fallback, and is what the list would have needed
# anyway: xdg-desktop-portal-gnome advertises FileChooser but implements it by
# delegating to a separate service (GNOME's chooser lives in nautilus), so with
# nautilus not installed every request died with
#
#   xdg-desktop-portal-gnome: Delegated FileChooser call failed:
#                             The name is not activatable
#
# and the caller saw a dialog that never appeared. Backends are tried in order,
# so if qshell is not registered or cannot start, dialogs fall back to gtk
# rather than breaking. Everything else is left on the gnome-first order niri
# ships.

[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=qshell;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
