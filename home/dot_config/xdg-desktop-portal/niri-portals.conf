# niri's own /usr/share/xdg-desktop-portal/niri-portals.conf with the FileChooser line added: xdg-desktop-portal reads the first config it finds and merges nothing, so the shipped lines are repeated.
# Open and save dialogs are the shell's picker (bin/dots-portal); gtk answers when dots cannot start. gnome is left out of FileChooser, since its chooser needs nautilus.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=dots;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
