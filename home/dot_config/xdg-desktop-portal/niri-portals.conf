# Portal backend preferences for this niri session.
#
# This is niri's own /usr/share/xdg-desktop-portal/niri-portals.conf with one
# line added. xdg-desktop-portal uses the FIRST config file it finds and does
# not merge the rest, so the shipped lines are repeated here verbatim rather
# than inherited.
#
# The added line is the fix for a file chooser that opens nothing:
# xdg-desktop-portal-gnome advertises org.freedesktop.impl.portal.FileChooser
# but implements it by delegating to a separate service (GNOME's file chooser
# lives in nautilus), and with nautilus not installed every request dies with
#
#   xdg-desktop-portal-gnome: Delegated FileChooser call failed:
#                             The name is not activatable
#
# and the caller sees a dialog that never appears. xdg-desktop-portal-gtk
# implements FileChooser itself, is already installed, and is what the shipped
# config already trusts for Access and Notification. Everything else is left on
# the gnome-first order niri ships.
#
# Reached from this shell by bin/file-select (the tailscale panel's Taildrop
# send button), and by every GTK/Electron app that asks for a file.

[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
