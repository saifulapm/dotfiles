# ------------------------------------------------------- jazz / eclectic
# FIP sends no inline ICY; cliamp special-cases it and pulls now-playing
# from Radio France's livemeta API instead, so the artist and title still
# show. (It does the same for NTS 1 / NTS 2, which report the show name.)

[[station]]
name = "FIP"
url = "https://icecast.radiofrance.fr/fip-midfi.mp3"

[[station]]
name = "FIP Jazz"
url = "https://icecast.radiofrance.fr/fipjazz-midfi.mp3"
