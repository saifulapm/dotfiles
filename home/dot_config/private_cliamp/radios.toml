# radios.toml — the saved station list, ported from the old
# ~/.config/qshell/radio-stations when cliamp replaced bin/radio (2026-08-18).
#
# These appear at the TOP of cliamp's Radio provider (press `R`), above the
# 30 000+ stations it pulls from radio-browser.info. `/` filters, Enter plays,
# `a` appends to the playlist.
#
# cliamp only ever READS this file — the `f` favourite key writes
# radio_favorites.toml beside it — which is why, unlike config.toml, this one
# is a chezmoi symlink straight into the repo. A station added here is a diff
# you commit, and every machine gets it. That was the point of the old file
# too, so nothing about the workflow changed except the syntax.
#
# To find a new one: press `R`, then `/` and search the catalogue; `f`
# favourites it locally. Move the keepers here to make them permanent.
#
# Every URL below was re-fetched and confirmed streaming on 2026-08-18.
# Stations rot — when one goes quiet, search the catalogue for a replacement.

