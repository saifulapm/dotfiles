include=~/.local/state/dots/theme-out/foot.ini

[main]
font=Maple Mono:size=11, Symbols Nerd Font Mono:size=11
selection-target=both
pad=14x14 center-when-maximized-and-fullscreen
gamma-correct-blending=yes

[scrollback]
lines=10000
multiplier=3.0

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Shift+c Control+Insert
clipboard-paste=Control+Shift+v Shift+Insert
primary-paste=none

[text-bindings]
# kak and the agent CLIs tell Shift+Return and Alt+Shift+Return from Return by these CSI-u codes.
\x1b[13;2u=Shift+Return
\x1b[13;4u=Mod1+Shift+Return
