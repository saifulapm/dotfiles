include=~/.local/state/dots/theme-out/foot.ini

[main]
font=Maple Mono:size=11.5, Symbols Nerd Font Mono:size=11.5
# v1's pair: 11.5pt glyphs in a 29px line, about 40% leading; px values follow the output scale.
line-height=29px
selection-target=both
# niri tiles at sizes that are not whole cells; center splits the spare pixels evenly instead of leaving them all at the bottom and right.
pad=14x0 center
gamma-correct-blending=yes

[scrollback]
lines=10000
multiplier=3.0

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Shift+c Control+Insert
clipboard-paste=Control+Shift+v Shift+Insert
primary-paste=none

[text-bindings]
# kak and the agent CLIs tell Shift+Return and Alt+Shift+Return from Return by these CSI-u codes.
\x1b[13;2u=Shift+Return
\x1b[13;4u=Mod1+Shift+Return
