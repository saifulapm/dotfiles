# herdr — agent-aware multiplexer, running ALONGSIDE tmux, not replacing it
# (omarchy ships both the same way, dd61d4a). tmux keeps the plain
# terminal-multiplexing job; herdr is for driving a pack of coding agents,
# which is the thing tmux has no vocabulary for.
#
# Port of omarchy config/herdr/config.toml (CREDITS.md), including the
# ba7925a/f511cf8 follow-ups. Their comments describe THEIR tmux.conf, which
# binds more than ours does — where ours never rebound a tmux default the two
# agree anyway. The one place they genuinely diverge is pane focus: our
# ~/.tmux.conf binds prefix+h/j/k/l to select-pane, and this file gives
# prefix+h to split_horizontal and moves focus to ctrl+alt+arrows, the way
# omarchy's tmux does. Kept as theirs on purpose — same keys on both
# machines beats matching our own tmux.
#
# `herdr config check` validates this file (it really does reject unknown
# keys and unparseable bindings), and bin/herdr-restart reloads it into a
# running server.
#
# Eight of their settings are commented out where they belong rather than
# dropped: move_tab_previous/next, the four resize_pane_*, pane_outer_borders,
# and the tab-bar hostname. omarchy builds herdr from their own package repo,
# ahead of every published release, and 0.8.0 — the newest tag, which is what
# we install — knows none of the eight. Left active they would cost `herdr
# config check` its whole value: it would exit 1 and every reload would print
# eight "unknown config key" lines, which is how a real typo goes unnoticed.
# Each carries the reason it is off, so re-enabling is uncommenting rather
# than re-porting. The other 36 settings are omarchy's, verbatim.
#
# herdr WRITES to its own config, and chezmoi symlinks this file, so those
# writes land in the repo — the same one-way valve mimeapps already relies
# on. `onboarding` below is one of them, owned here so it stops being
# prepended above this header: TOML puts bare keys before the first table,
# which is line 1.

# The first-run tour has been taken.
onboarding = false

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue
# accents). For us that is also what keeps herdr themed at all:
# bin/theme-apply retints live foot windows over OSC, so herdr follows all 22
# of our themes and can never drift the way a pinned built-in would.
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so
# panel_bg has to be dark for it to read - same colors as status-left's
# "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows. Unsupported by 0.8.0 — resize_mode above
# is the only way to resize a pane until a release carries these.
# resize_pane_left = "ctrl+alt+shift+left"
# resize_pane_down = "ctrl+alt+shift+down"
# resize_pane_up = "ctrl+alt+shift+up"
# resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right. Unsupported by 0.8.0.
# move_tab_previous = "alt+shift+left"
# move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame.
# The outer frame stays: pane_outer_borders is unsupported by 0.8.0.
pane_gaps = false
# pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# tmux showed #h in status-right; the ZOOM flag shows there automatically
#
# omarchy writes this as `tab_bar_hostname = true`, an older boolean upstream
# has since replaced with an ordered list (zoom / hostname / datetime / text /
# command). 0.8.0 has NEITHER spelling, so the tab bar carries no hostname
# here. The list form is what to uncomment if a release grows it — zoom has to
# be named explicitly, because the list replaces the default rather than
# adding to it.
# tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]
