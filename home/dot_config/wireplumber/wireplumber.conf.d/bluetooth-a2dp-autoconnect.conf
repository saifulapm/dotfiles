## Roles are this machine's side: a2dp_source streams to headphones, hfp_ag gives them a microphone.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source hfp_ag ]
}

## WirePlumber 0.5 connects no profile on attach unless told, and a stored "off" profile would win over auto-connect on reconnect.
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
        session.dont-restore-off-profile = true
      }
    }
  }
]
