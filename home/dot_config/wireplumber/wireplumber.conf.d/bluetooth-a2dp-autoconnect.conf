## Roles are this machine's side (a2dp_source streams to headphones, hfp_ag gives them a microphone); some headsets' keys work only with an AVRCP player registered, and SBC-XQ stalled the BCM4388 with "Missing completion reports".
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source hfp_ag ]
  bluez5.dummy-avrcp-player = true
  bluez5.codecs = [ sbc aac ]
}

## WirePlumber 0.5 connects no profile on attach unless told, a stored "off" profile would win over auto-connect on reconnect, and BlueZ tries HFP, where a headset's battery comes from, only once after A2DP, so hfp_hf retries it.
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink hfp_hf ]
        session.dont-restore-off-profile = true
      }
    }
  }
]
