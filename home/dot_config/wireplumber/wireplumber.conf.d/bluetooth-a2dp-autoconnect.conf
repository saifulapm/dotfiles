## Bluetooth roles + profile auto-connect for this box.
##
## HISTORY: this file spent a day as a workaround for wireplumber being
## SIGKILLed every ~6 s whenever it owned a Bluetooth stream, taking
## bluetoothd down with it (SEGV in queue_remove <- media_endpoint_remove as
## its endpoints were torn out from under it). The kill was real and kernel-
## delivered, but the defect was never in the roles: rtkit was not installed
## (a weak-dep casualty of install_weak_deps=False — see [[pkg]] rtkit in
## packages/manifest.toml), xdg-desktop-portal cached its Realtime properties
## as zeros at session start, and libpipewire's module-rt trusted the portal's
## RTTimeUSecMax=0, clamped its own RLIMIT_RTTIME to {0,0}, and asked for
## SCHED_RR anyway — so the kernel killed the thread on its first realtime
## tick. With rtkit installed the portal serves 200000 and wireplumber
## survives owning streams indefinitely (root-caused 2026-08-11).
##
## What remains here is POLICY, not a workaround:
##
## bluez5.roles — named from the LOCAL machine's side, and getting it
## backwards breaks playback outright: headphones advertise "Audio Sink"
## (UUID 0000110b), so this box must offer a2dp_SOURCE to stream to them
## (a2dp_sink would make the NUC a speaker for someone's phone, and setting
## roles = [ a2dp_sink ] removed the AirPods from the graph entirely).
##   a2dp_source — playback to headphones/speakers, the whole point
##   hfp_ag     — this box as the Audio Gateway, which is what gives the
##                AirPods a microphone (they advertise Handsfree, UUID
##                0000111e; the card then offers headset-head-unit profiles
##                and wireplumber auto-switches to one when an app opens
##                capture on the BT source)
## hfp_hf/hsp_hs (this box acting as someone else's headset) and the BAP/LE
## roles are deliberately absent — nothing here uses them.
##
## bluez5.auto-connect — wireplumber 0.5 does not connect a profile on device
## connection unless told to; this is what selects High Fidelity Playback
## when the AirPods attach instead of leaving the card on "off". Profile
## names on this side follow the PulseAudio card-profile convention, where
## a2dp_sink means "send audio to the device" — yes, the opposite naming
## direction from bluez5.roles above.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source hfp_ag ]
}

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]
