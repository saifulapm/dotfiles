## Keeps local ALSA sinks out of WirePlumber's idle-suspend path.
##
## Pausing mpv for more than a few seconds silenced playback on resume, and
## did it intermittently rather than every time. The measured chain: node/
## suspend-node.lua arms when the sink goes idle and sends Suspend after
## session.suspend-timeout-seconds (default 5, script line 41), the ALSA PCM
## goes to `closed`, and the codec follows it down to D3. Unpausing then has
## to rebuild the whole path — controller, codec, i915 audio power well,
## DisplayPort pin and converter, ELD re-read — and when a step loses that
## race the DMA runs against silent hardware. Six scripted pause/resume cycles
## all came back clean, which is what a race looks like from the outside and
## why this is worth removing rather than chasing.
##
## /etc/modprobe.d/hda-power-save.conf (packages/hda-power-save.conf) takes the
## HDA controller and the Realtek ALC256 out of that chain, but NOT the codec
## that actually matters here. hdaudioC0D2, "Raptor Lake P HDMI", is i915-bound
## display audio: it manages its own runtime PM because it has to release the
## display power well, so it keeps power/control=auto with a driver-managed
## 3000 ms delay regardless of the power_save module param — the tell is that
## the delay is 3000 and not the 1000 the param implies. power_save=0 leaves
## C0D0 at control=on and C0D2 still suspending.
##
## So the only lever left is the one that starts the teardown, and it is
## decisive: across every measurement C0D2 suspended only AFTER pcm=closed,
## and was active whenever pcm=RUNNING. A PCM that never closes is a codec
## that can never reach D3 (root-caused 2026-08-12).
##
## 0 is a real value here rather than "immediately" — suspend-node.lua tests
## for it and returns before arming the timer.
##
## Scoped to alsa_output deliberately:
##   * inputs are left alone — holding the capture PCM open would park the mic
##     in a permanently in-use state to solve a problem it does not have
##   * Bluetooth is left alone — a different monitor section entirely, and an
##     A2DP transport held open forever would sit on the AirPods' battery. BT
##     sinks should keep suspending.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
