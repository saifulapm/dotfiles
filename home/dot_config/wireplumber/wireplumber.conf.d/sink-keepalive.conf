## Stops audio sinks going to sleep between sounds. One symptom, two sinks, and
## on the ALSA side two halves that are only correct together — this box has now
## shipped each half alone and watched each one fail differently.
##
## THE SYMPTOM, both sinks: play something after a quiet stretch and the first
## seconds are missing. node/suspend-node.lua arms when a sink goes idle and
## sends Suspend after session.suspend-timeout-seconds (default 5, script line
## 41). On ALSA the PCM goes to `closed` and the codec follows it to D3, so
## unpausing has to rebuild controller, codec, i915 audio power well,
## DisplayPort pin and converter, and re-read the ELD before a sample lands. On
## the AirPods the same hook tears down the A2DP transport, and re-acquiring it
## costs the 2-3 s of missing audio. 0 is a real value rather than "immediately"
## — suspend-node.lua tests for it and returns before arming the timer.
##
## ALSA HALF TWO, dither.noise (added 2026-09-04, and the reason half one alone
## was worse than nothing). A sink that never suspends sends the monitor an
## unbroken run of DIGITAL SILENCE for as long as playback is paused, and the
## M32UC mutes its own speaker amplifier after a stretch of that. Nothing
## un-mutes it but a stream that stops and starts again — which a PCM that never
## closes can never do. So from 2026-08-12 to 2026-09-04 this file did not trade
## an intermittent fault for a clean one, it traded it for a permanent one:
## pausing mpv killed the sound outright, and no amount of unpausing brought it
## back. Measured both ways — a tone into the still-running PCM was silent, the
## same tone after cycling the card profile off and on was audible, with the
## whole PC-side chain reading identical and correct across both (pcm3p RUNNING,
## C0D2 active, pin 0xc selected to converter 0x3 and unmuted, ELD valid, sink
## at 65%). Every reading said the audio was fine, which is exactly why it cost
## a day to find twice.
##
## dither.noise is upstream's answer and it names this use case outright: "This
## option will add N bits of random data to the signal... This can be used to
## keep some amplifiers alive during silent periods. One or two bits of noise is
## usually enough, otherwise the noise will become audible", and "this is
## usually used together with session.suspend-timeout-seconds to disable suspend
## in the session manager" (pipewire-props(7), Audio Adapter Properties). With
## no dither.method set the value flips between [-(1<<(N-1)), 0] every 1024
## samples, so 2 is ±2 LSB of the 24 bits PipeWire processes in — about
## -138 dBFS, inaudible, and never a run of zeroes. Raise it if the amp still
## sleeps; drop it to 1 if it ever becomes audible.
##
## BLUETOOTH gets half one only, and that is deliberate rather than an omission.
## The AirPods' gap is the transport being released and re-acquired, which
## suspend-timeout alone prevents; they do not mute themselves on silence the
## way the monitor does, so dither.noise would buy nothing. It would not even
## save battery to leave it out — once the transport is held open PipeWire
## encodes and transmits regardless of what the samples contain.
##
## The battery cost of that held-open transport is real and was accepted
## knowingly on 2026-09-04: the AirPods now stay streaming whenever they are
## connected, so they need charging more often. The earlier version of this file
## refused the trade on the owner's behalf and left the 2-3 s gap in place; that
## was not its call to make. Reverse it by deleting the bluez rule below.
##
## Inputs are left alone throughout — holding the capture PCM open would park
## the mic in a permanently in-use state to solve a problem it does not have.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        dither.noise = 2
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
