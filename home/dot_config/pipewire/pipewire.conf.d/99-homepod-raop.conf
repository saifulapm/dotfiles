# HomePod mini "Office" as a static AirPlay (RAOP) sink.
#
# Static because the eCommerceStaff AP filters multicast mDNS, so
# module-raop-discover can never see the HomePod; params mirror what
# discover would derive from its TXT record (et=0,3,5 -> fp_sap25).
# The HomePod must be able to reach back on UDP 6001-6002 (firewalld).
# If its DHCP lease ever changes, update raop.ip.
context.modules = [
    {   name = libpipewire-module-raop-sink
        args = {
            raop.ip = "192.168.68.51"
            raop.port = 7000
            raop.name = "22613DB70BF7@Office"
            raop.hostname = "Office.local"
            raop.transport = "udp"
            raop.encryption.type = "fp_sap25"
            raop.audio.codec = "PCM"
            node.description = "HomePod (Office)"
        }
    }
]
