# ao=pulse lived here 2026-08-11, working around every native-PipeWire mpv
# being SIGKILLed ~1 s after its stream went live. Root-caused the same day
# and removed: rtkit was not installed (weak-dep casualty of
# install_weak_deps=False), xdg-desktop-portal cached its Realtime properties
# as zeros at session start, and libpipewire's module-rt trusted the portal's
# RTTimeUSecMax=0 — clamping its own RLIMIT_RTTIME to {0,0} and taking
# SCHED_RR anyway, so the kernel killed the thread on its first realtime
# tick. Full story: [[pkg]] rtkit in packages/manifest.toml and the
# wireplumber bluetooth conf comments.
#
# Verified after the fix: mpv --no-config picks AO [pipewire] and plays
# indefinitely (30 s and 5 min runs, zero wireplumber restarts). Nothing about
# audio needs to be set here any more.

# Hardware decode. mpv's default is hwdec=no, so without this line the Apple
# Video Decoder that run_after_54-avd-decode.sh brings up sits idle and every
# frame still lands on the CPU — 94% more of it on 4K H.264, 97% on 4K 10-bit
# HEVC (docs/avd-decode-2026-09-10.md). dekho runs mpv as a child process, so
# this one line covers the whole video path: dekho, the yt-dlp extension's
# completion toast, bin/music, bin/youtube.
#
# `vaapi`, NOT `auto-safe`, and not `vaapi-copy`:
#
#   * auto-safe reaches the same place but only after probing h264-vulkan and
#     h264-vulkan-copy first, and Vulkan Video does not exist on Apple GPUs —
#     Mesa implements no video decode for them, so both attempts die on
#     "Failed setup for format vulkan: hwaccel initialisation returned error"
#     on every single file before it falls through to vaapi. Naming vaapi
#     skips two guaranteed failures per playback.
#   * plain `vaapi` keeps frames in VAAPI surfaces all the way into the vo
#     (verified: `VO: [gpu-next] 1920x1080 vaapi[nv12]`). `-copy` downloads
#     every frame to system RAM and gives back most of the saving — 0.28 s of
#     CPU became 2.32 s in the ffmpeg equivalent of that path.
#
# Fleet-safe as written: the NUC has VA-API too, via [[pkg]] intel-media-driver,
# and mpv falls back to software on its own if a machine has no VA driver at
# all, so this needs no per-machine templating.
hwdec=vaapi
