# Tool versions live here: change them and chezmoi apply, never `mise use -g`, which rewrites this file under chezmoi.

[tools]
node = "24.21.0"
deno = "latest"
# The Cloudflare CLI.
"npm:cf" = "latest"
# pi, the coding agent; a node bump carries it along.
"npm:@earendil-works/pi-coding-agent" = "latest"
# The Playwright CLI; the wrapper in the dotfiles bin dir hands it the machine config.
"npm:@playwright/cli" = "latest"

[env]
# mise activate moves its tool bin dirs to the front of PATH; this keeps the dotfiles bin dir, and so the playwright-cli wrapper, ahead of them.
_.path = ["~/Sites/github/dotfiles/bin"]

[settings]
# Laravel and React repos pin node with .nvmrc, .node-version or package.json devEngines, which mise ignores unless asked.
idiomatic_version_file_enable_tools = ["node"]
# Project mise configs here are trusted without a prompt; not ~/Sites/tries, where try clone drops other people's repos.
trusted_config_paths = ["~/Sites/github", "~/Sites/laravel", "~/Sites/shopify_themes"]

[settings.node]
# corepack enable after each node install keeps the pnpm shim across a major bump; node 25 and later drop corepack.
corepack = true

[settings.upgrade]
# mise up would delete an old install while processes still run from it, as Claude Code re-execs itself by path.
auto_prune = false
