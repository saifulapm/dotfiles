# Tool versions live here: change them and chezmoi apply, never `mise use -g`, which rewrites this file under chezmoi.

[tools]
node = "24.21.0"
deno = "latest"
# The Cloudflare CLI.
"npm:cf" = "latest"
# pi, the coding agent; a node bump carries it along.
"npm:@earendil-works/pi-coding-agent" = "latest"
# The Playwright CLI; the wrapper in the dotfiles bin dir hands it the machine config.
"npm:@playwright/cli" = "latest"
# pnpm as its own tool; corepack is off below, because its shim sits in node's bin dir ahead of this one.
"aqua:pnpm/pnpm" = "latest"
# The Shopify CLI; 4.9.4 and later need node 22.12 or newer.
"npm:@shopify/cli" = "latest"
# The dev tunnel client that home/private_dot_cloudflared configures.
"aqua:cloudflare/cloudflared" = "latest"
# Fedora 44 packages none of these five, so they come as aqua's prebuilt binaries: sd, tv, hurl, sg and usql.
"aqua:chmln/sd" = "latest"
"aqua:alexpasmantier/television" = "latest"
"aqua:Orange-OpenSource/hurl" = "latest"
"aqua:ast-grep/ast-grep" = "latest"
"aqua:xo/usql" = "latest"
# hop-kak, kak's hop.kak jumps; its repo is gone, and crates.io keeps the last release.
"cargo:hop-kak" = "0.2.0"
# Some projects lock with bun.lock.
bun = "latest"
# Mail IMAP IDLE watcher. Not packaged for Fedora and upstream ships no binaries, so mise builds it with go; the tag has no v, which go install accepts as a revision.
"go:gitlab.com/shackra/goimapnotify/cmd/goimapnotify" = "2.5.8"

[env]
# mise activate moves its tool bin dirs to the front of PATH; this keeps the dotfiles bin dir, and so the playwright-cli wrapper, ahead of them.
_.path = ["~/Codes/dotfiles/bin"]

[settings]
# Laravel and React repos pin node with .nvmrc, .node-version or package.json devEngines, which mise ignores unless asked.
idiomatic_version_file_enable_tools = ["node"]
# Project mise configs here are trusted without a prompt; not ~/Tries, where try clone drops other people's repos.
trusted_config_paths = ["~/Codes"]

[settings.node]
# Off: pnpm comes from its own mise tool, and a corepack shim would shadow it.
corepack = false

[settings.upgrade]
# mise up would delete an old install while processes still run from it, as Claude Code re-execs itself by path.
auto_prune = false
