# Global mise config — chezmoi-managed, the source of truth for tool versions.
# Change versions HERE and `chezmoi apply`; don't `mise use -g` (that rewrites
# this file at runtime and fights chezmoi). Bootstrap scripts install with
# `mise install <tool>`, which reads this file without editing it.

[tools]
node = "lts"     # resolves to the current LTS major at install time
deno = "latest"
"npm:cf" = "latest"   # Cloudflare CLI (omarchy a389bd18 installs it via a `mise use -g` wrapper)

[settings]
# Let mise honor .nvmrc / .node-version / package.json devEngines in project
# repos — disabled by default since mise 2025, and Laravel/React repos carry
# these instead of mise.toml.
idiomatic_version_file_enable_tools = ["node"]

# Projects live under ~/Sites (created by run_after_15-user-dirs.sh) — trust
# their mise configs automatically instead of prompting `mise trust` per repo.
# Listed per subdirectory, NOT ~/Sites itself: that would also trust
# ~/Sites/tries, where `try clone` drops third-party repos whose mise.toml
# (env, hooks, tasks) would then run on cd. Those still prompt.
trusted_config_paths = ["~/Sites/github", "~/Sites/laravel", "~/Sites/shopify_themes"]

[settings.node]
# Run `corepack enable` after every node install, so the pnpm shim survives
# an lts major bump instead of silently vanishing. Node ≥ 25 stops bundling
# corepack — revisit this mechanism when lts resolves to 26 (Oct 2026).
corepack = true

[settings.upgrade]
# mise ships this ON: `mise up` (run by bin/update-all) deletes the old
# install dir the moment a tool upgrades — out from under processes still
# executing from it (omarchy 889b22dd: Claude Code re-execs itself by
# absolute path). Old versions cost disk until pruned deliberately.
auto_prune = false
