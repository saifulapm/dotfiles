<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Which family draws: Maple Mono for monospace, Noto for the proportional faces web pages ask for, and fallbacks for icons, Bangla, Arabic and emoji. It keeps v1's file name, so chezmoi takes over v1's link. -->
<fontconfig>
  <!-- The CSS system names pages use, first, so the generic rules below see the names they become. -->
  <!-- Fedora's 31-cantarell-vf.conf has already put Cantarell before system-ui, so our sans-serif face goes in front of everything. -->
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <alias><family>ui-sans-serif</family><prefer><family>sans-serif</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>sans-serif</family></prefer></alias>
  <alias><family>BlinkMacSystemFont</family><prefer><family>sans-serif</family></prefer></alias>
  <alias><family>ui-monospace</family><prefer><family>monospace</family></prefer></alias>
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="weak"><string>Maple Mono</string></edit>
  </match>
  <!-- The pinned fonts have no generic name, so Fedora's 49-sansserif.conf would add sans-serif to a request for them and a sans face could answer instead. -->
  <alias>
    <family>Maple Mono</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>Instrument Serif</family>
    <default><family>serif</family></default>
  </alias>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="weak"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="assign" binding="weak"><string>Noto Serif</string></edit>
  </match>
  <!-- Bangla and Arabic, appended so they only draw what the asked-for family cannot. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>bn</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Bengali</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Naskh Arabic</string></edit>
  </match>
  <!-- Chromium asks per character with no lang, so the two also go last on every pattern; one family per edit, as several strings parse as one expression. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Bengali</string></edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>Noto Naskh Arabic</string></edit>
  </match>
  <!-- Nerd Font icons come from the symbols font, since the pinned Maple Mono has none. -->
  <alias>
    <family>monospace</family>
    <accept>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Bengali</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Noto Sans Bengali</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Sans Bengali</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
