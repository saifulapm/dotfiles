<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<!--
  Font policy for this desktop. Modelled on omarchy's
  default/fontconfig/conf.avail/50-omarchy.conf (see CREDITS.md), which assigns
  the generic aliases and then repairs the fallback chains.

  THE WHOLE DESKTOP IS ONE FAMILY: Maple Mono draws the shell, the terminal,
  the editor and GTK app chrome. There is no font picker — omarchy ships one
  that rewrites `monospace`, we had a port of it that rewrote `sans-serif`
  instead, and the user removed both in favour of a fixed stack
  (2026-08-06). So the font decisions live here, in three lines, and nothing
  at runtime edits them:

      text    Maple Mono          (this file, the `monospace` alias)
      icons   Symbols Nerd Font   (fallback on the monospace accept-list)
      Bangla  Noto Sans Bengali   (fallback, appended per script)

  `sans-serif` and `serif` deliberately still name real proportional faces.
  They are not what the desktop draws with — nothing of ours asks for them —
  but web pages and documents do, and answering those with a monospace font
  would be a bug, not a preference.

  This file is chezmoi-managed. Editing ~/.config/fontconfig/conf.d/50-qshell.conf
  by hand will be overwritten; edit it here.

  EVERY EDIT HERE NEEDS THE MATRIX RE-RUN. `binding` on these rules is not
  cosmetic: Fedora's /etc/fonts/conf.d/49-sansserif.conf appends `sans-serif`
  to every pattern that carries no generic name, so a strongly-bound family on
  the sans-serif alias is injected into every font request in the session and
  outranks the family the application actually asked for. Check with:

    for f in sans-serif serif monospace system-ui Cantarell "Maple Mono" \
             "JetBrains Mono" "Noto Sans" "Adwaita Sans"; do
      printf '%-16s -> %s\n' "$f" "$(fc-match -f '%{family[0]}' "$f")"
    done

  The generics must answer with our choices AND every named family must answer
  with itself. When that second half broke, foot drew Adwaita Sans and warned
  that its configured font was not monospace.
-->
<fontconfig>
  <!-- ================================================== generic aliases -->

  <!-- The one family: the shell, the terminal, the editor, and anything else
       asking for monospace. Pinned, not picked. Swapping the desktop's font is
       a one-word edit here plus `bin/theme-apply` to re-render the templated
       app configs. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="weak">
      <string>Maple Mono</string>
    </edit>
  </match>

  <!-- Generic-name assignment for the coding font, the idiom Fedora uses for
       every font it packages (/etc/fonts/conf.d/60-jetbrains-mono-fonts.conf,
       31-cantarell-vf.conf). It is load-bearing, not tidiness: 49-sansserif.conf
       appends `sans-serif` to any pattern with no generic name, and Maple Mono
       is installed by hand so fontconfig knows of no generic for it — without
       this line a request for "Maple Mono" carries a sans-serif token, and
       whatever claims sans-serif answers instead. That is exactly how foot
       ended up drawing Adwaita Sans and warning that its font was not
       monospace. -->
  <alias>
    <family>Maple Mono</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <!-- Not the desktop's font — the answer for anything that explicitly asks
       for a proportional face, which on this machine means web pages and
       documents. Adwaita Sans is Inter under GNOME's name and is already on
       disk; naming it just stops the charset scan picking at random. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="weak">
      <string>Adwaita Sans</string>
    </edit>
  </match>

  <!-- Without this, `serif` on this box resolved to Adwaita MONO: Fedora
       ships default-fonts-core-sans but no serif face at all, so fontconfig
       fell through to a charset scan and landed on a monospace font. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="weak">
      <string>Noto Serif</string>
    </edit>
  </match>

  <!-- ============================================ web/CSS generic aliases -->
  <!-- Theirs, kept: pages and Electron apps name these and would otherwise
       fall through to whatever the charset scan finds. -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-monospace</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <!-- ==================================================== script coverage -->

  <!-- Bangla. Nothing installed here covered lang=bn at all, so every Bangla
       character typed through fcitx5-m17n rendered as a tofu box — including
       in the terminal, where Maple Mono has no Bengali either. Appended, so it
       only ever wins the codepoints the requested family cannot draw. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>bn</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Bengali</string>
    </edit>
  </match>

  <!-- Chromium and Electron resolve a missing glyph one character at a time
       without `lang` on the pattern, so the rule above never fires for them.
       Naming the family as a last resort covers that path; charset matching
       outranks family matching, so a font that cannot draw the codepoint is
       never pulled in and Latin/mono/emoji resolve exactly as before.
       (Upstream does the same thing for Arabic.) -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Bengali</string>
    </edit>
  </match>

  <!-- ========================================== fallbacks on every alias -->
  <!-- Theirs: emoji has to be reachable from each generic family or it only
       renders where an app happened to name it. Ours adds the symbols font on
       the mono chain, which is where terminal Nerd Font icons come from —
       Maple Mono is the unpatched build and covers none of that range. -->
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Noto Sans Bengali</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Serif Bengali</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>monospace</family>
    <accept>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Bengali</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
