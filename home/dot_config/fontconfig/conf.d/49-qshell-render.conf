<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<!--
  Rendering policy for this desktop: the macOS model. Loads just before
  50-qshell.conf (which owns WHICH family draws; this file owns HOW it draws).

  macOS renders text unhinted — glyphs keep their designed shapes instead of
  being snapped to the pixel grid — and, since Mojave, with grayscale
  antialiasing only (no subpixel/RGB). The weight foot adds on top of this
  (gamma-correct blending) lives in templates/foot.ini.tmpl, not here:
  fontconfig has no say in blending.

  Fedora's /etc/fonts/conf.d appends hintslight (10-hinting-slight.conf) and
  lcddefault (11-lcdfilter-default.conf) before user config runs; mode="assign"
  here replaces those first values, so these win without touching /etc.

  The tradeoff is honest: unhinted text is the macOS look, which reads soft on
  a low-DPI panel (macOS is famously blurry on 1080p monitors). On the Retina
  Macs this is simply correct; if the NUC ever drives a low-DPI display and it
  bothers you, flip hintstyle to hintslight on that machine only.

  This file is chezmoi-managed; edit it in the repo, not in ~/.config.
-->
<fontconfig>
  <match target="pattern">
    <!-- Always antialias (Fedora agrees; asserted so nothing can unset it). -->
    <edit name="antialias" mode="assign"><bool>true</bool></edit>

    <!-- Unhinted: no grid-fitting, no autohinter — designed outlines only. -->
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>

    <!-- Grayscale, not subpixel: no RGB fringing, rotation/scale safe. -->
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>

    <!-- Never trade scalable outlines for a font's baked-in bitmap strikes. -->
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
