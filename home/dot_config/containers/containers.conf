# Per-user podman overrides. Layered over /usr/share/containers/containers.conf
# and /etc/containers/containers.conf — only the keys set here differ.

[engine]
# `podman compose` is a dispatcher around an external provider, and it
# announces that on stderr EVERY time it dispatches:
#
#   >>>> Executing external compose provider "/usr/bin/podman-compose".
#   Please see podman-compose(1) for how to disable this message. <<<<
#
# ANSI-underlined, on stderr, ahead of the provider's own output. Same
# argument as dot_config/containers/nodocker beside it: the point of the
# docker shim plus a compose provider is that existing `docker compose`
# commands run unchanged, and a banner no real Docker emits breaks that for
# anything piping, grepping or failing a build on stderr. Silenced here
# rather than per-project, because it is a property of this machine's
# provider setup, not of any one compose file.
compose_warning_logs = false
