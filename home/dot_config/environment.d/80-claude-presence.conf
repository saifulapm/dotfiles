# Claude Code sends Remote Control sessions' pushes to the phone only while this file is missing; the shell keeps it while someone is at the screen (shell/Idle.qml) and dots-shell.service removes it when the shell stops. Set here so the user units and every session the desktop starts see it; fish sets it too, for a shell over SSH.
CLAUDE_CLIENT_PRESENCE_FILE=${XDG_RUNTIME_DIR}/dots-present
