# Claude Code sends no push to the Claude app while the file this names
# exists. qshell keeps it exactly while the session is unlocked and not idle
# (shell/Services/Idle.qml), so the phone stays quiet at the desk. Here, in the
# user environment, so the Remote Control units and every session the desktop
# starts see it; never in Claude Code's settings. Twin: fish conf.d/00-env.fish.
CLAUDE_CLIENT_PRESENCE_FILE=${XDG_RUNTIME_DIR}/qshell-present
