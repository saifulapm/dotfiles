# Chromium launch flags (managed by chezmoi) — port of the Arch
# chromium-flags.conf. Fedora's /usr/bin/chromium-browser wrapper does NOT
# read ~/.config/chromium-flags.conf (that is Arch's wrapper); it honours the
# CHROMIUM_USER_FLAGS environment variable, which environment.d feeds into the
# systemd user manager → niri.service → every spawned chromium. Takes effect
# at next login (or `systemctl --user import-environment CHROMIUM_USER_FLAGS`).
#
# Flag rationale, carried over from the Arch file:
#   --ozone-platform-hint=auto        native Wayland; without it chromium runs
#                                     on XWayland and fractional scaling
#                                     bilinear-blurs the whole window
#   --force-color-profile=srgb        stop saturated colors blooming on
#                                     wide-gamut panels (M32UC, P3 laptop)
#   --no-default-browser-check        kill the "Chromium isn't your default
#                                     browser" banner. It IS the default:
#                                     `xdg-settings check default-web-browser
#                                     chromium-browser.desktop` answers yes and
#                                     http/https/text/html all resolve to it —
#                                     the banner is simply wrong. It surfaces on
#                                     cold starts, e.g. when an app hands an
#                                     OAuth URL to xdg-open and that is the
#                                     launch that starts chromium.
#   WaylandPerSurfaceScale/WaylandUiScale  render on the physical pixel grid
#                                     via wp-fractional-scale-v1 — this
#                                     MacBook runs scale 1.5
#   --disable-features=Aim*,...       the AI/on-device-model surface that IS
#                                     compiled into distro chromium builds
#   OverlayScrollbar                  thin scrollbars that float over the page
#                                     and fade when idle, instead of holding a
#                                     permanent gutter — the macOS/GNOME
#                                     behaviour. Feature name verified against
#                                     this build; the older `#overlay-scrollbars`
#                                     flags entry sets the same thing.
#   Note on chrome:// fonts: chromium bundles Roboto as a webfont that shadows
#   system fonts on chrome:// pages. The only way to get Maple Mono in chrome://
#   (tab search, omnibox dropdown, new-tab page, settings) without per-policy
#   overrides is `--blink-settings=downloadableBinaryFontsEnabled=false` — and
#   that also kills every site's @font-face, so Material Symbols and Font
#   Awesome render their raw ligature text. Tried (added 2026-08-17, removed
#   2026-08-23): the chrome:// gain was not worth the broken-site cost. To get
#   chrome:// onto Maple Mono without breaking site icons, set the
#   DefaultBrowserFont / DefaultFixedFont / DefaultSansSerifFont / DefaultSerifFont
#   Chrome policies in chromium/policies/extensions.json — that lets us keep
#   downloadable fonts enabled AND name the chrome:// family.
# --load-extension: the bundled omarchy extensions (chromium/extensions in
# the repo — copy-url Alt+Shift+L, yt-dlp Alt+Shift+D, whatsapp-slim), loaded
# unpacked straight from the checkout; run_after_21 registers their native
# messaging hosts. ${HOME} expands per environment.d(5).
CHROMIUM_USER_FLAGS=--ozone-platform-hint=auto --force-color-profile=srgb --no-default-browser-check --enable-features=TouchpadOverscrollHistoryNavigation,WaylandPerSurfaceScale,WaylandUiScale,OverlayScrollbar --disable-features=AimEnabled,AiMode,AiModeOmniboxEntryPoint,AiModePageActionIconView,AiModeEntryPointAlwaysNavigates,AiModeStartPack,AimEligibilityService,AimUrlNavigation,AimUrlInterceptPassthrough,Compose,LensOverlay,OptimizationGuideOnDeviceModel,OptimizationGuideModelDownloading,WallpaperSearch --load-extension=${HOME}/.dotfiles/chromium/extensions/copy-url,${HOME}/.dotfiles/chromium/extensions/yt-dlp,${HOME}/.dotfiles/chromium/extensions/whatsapp-slim
