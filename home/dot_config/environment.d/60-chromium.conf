# Chromium launch flags (managed by chezmoi) — port of the Arch
# chromium-flags.conf. Fedora's /usr/bin/chromium-browser wrapper does NOT
# read ~/.config/chromium-flags.conf (that is Arch's wrapper); it honours the
# CHROMIUM_USER_FLAGS environment variable, which environment.d feeds into the
# systemd user manager → niri.service → every spawned chromium. Takes effect
# at next login (or `systemctl --user import-environment CHROMIUM_USER_FLAGS`).
#
# Flag rationale, carried over from the Arch file:
#   --ozone-platform-hint=auto        native Wayland; without it chromium runs
#                                     on XWayland and fractional scaling
#                                     bilinear-blurs the whole window
#   --force-color-profile=srgb        stop saturated colors blooming on
#                                     wide-gamut panels (M32UC, P3 laptop)
#   WaylandPerSurfaceScale/WaylandUiScale  render on the physical pixel grid
#                                     via wp-fractional-scale-v1 — this
#                                     MacBook runs scale 1.5
#   --disable-features=Aim*,...       the AI/on-device-model surface that IS
#                                     compiled into distro chromium builds
# --load-extension: the bundled omarchy extensions (chromium/extensions in
# the repo — copy-url Alt+Shift+L, yt-dlp Alt+Shift+D, whatsapp-slim), loaded
# unpacked straight from the checkout; run_after_21 registers their native
# messaging hosts. ${HOME} expands per environment.d(5).
CHROMIUM_USER_FLAGS=--ozone-platform-hint=auto --force-color-profile=srgb --enable-features=TouchpadOverscrollHistoryNavigation,WaylandPerSurfaceScale,WaylandUiScale --disable-features=AimEnabled,AiMode,AiModeOmniboxEntryPoint,AiModePageActionIconView,AiModeEntryPointAlwaysNavigates,AiModeStartPack,AimEligibilityService,AimUrlNavigation,AimUrlInterceptPassthrough,Compose,LensOverlay,OptimizationGuideOnDeviceModel,OptimizationGuideModelDownloading,WallpaperSearch --load-extension=${HOME}/.dotfiles/chromium/extensions/copy-url,${HOME}/.dotfiles/chromium/extensions/yt-dlp,${HOME}/.dotfiles/chromium/extensions/whatsapp-slim
