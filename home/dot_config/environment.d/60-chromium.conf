# Chromium launch flags (managed by chezmoi) — port of the Arch
# chromium-flags.conf. Fedora's /usr/bin/chromium-browser wrapper does NOT
# read ~/.config/chromium-flags.conf (that is Arch's wrapper); it honours the
# CHROMIUM_USER_FLAGS environment variable, which environment.d feeds into the
# systemd user manager → niri.service → every spawned chromium. Takes effect
# at next login (or `systemctl --user import-environment CHROMIUM_USER_FLAGS`).
#
# Flag rationale, carried over from the Arch file:
#   --ozone-platform-hint=auto        native Wayland; without it chromium runs
#                                     on XWayland and fractional scaling
#                                     bilinear-blurs the whole window
#   --force-color-profile=srgb        stop saturated colors blooming on
#                                     wide-gamut panels (M32UC, P3 laptop)
#   WaylandPerSurfaceScale/WaylandUiScale  render on the physical pixel grid
#                                     via wp-fractional-scale-v1 — this
#                                     MacBook runs scale 1.5
#   --disable-features=Aim*,...       the AI/on-device-model surface that IS
#                                     compiled into distro chromium builds
#   OverlayScrollbar                  thin scrollbars that float over the page
#                                     and fade when idle, instead of holding a
#                                     permanent gutter — the macOS/GNOME
#                                     behaviour. Feature name verified against
#                                     this build; the older `#overlay-scrollbars`
#                                     flags entry sets the same thing.
#   --blink-settings=downloadable…    Maple Mono in chromium's OWN UI, and the
#                                     only lever that reaches it. Every
#                                     chrome:// surface — tab search, the
#                                     omnibox dropdown
#                                     (chrome://omnibox-popup.top-chrome), the
#                                     new-tab page, settings — is WebUI: HTML
#                                     rendered with the stack
#                                     `Roboto, "<gtk-font-name>", Arial,
#                                     sans-serif`. gtk-font-name already puts
#                                     Maple Mono in slot 2, so nothing needs to
#                                     be aliased — but chromium BUNDLES Roboto
#                                     as an @font-face webfont which shadows
#                                     it, and neither fontconfig nor an
#                                     extension can override a webfont on a
#                                     chrome:// page (extensions cannot inject
#                                     there at all). Dropping downloadable
#                                     fonts removes Roboto and slot 2 wins.
#                                     THE PRICE IS SITEWIDE and was measured,
#                                     not assumed: no page gets @font-face, so
#                                     ligature icon fonts (Material Symbols,
#                                     Font Awesome) render their raw text — a
#                                     search icon reads "search" — and sites
#                                     fall back to Adwaita Sans instead of
#                                     their brand face. Accepted deliberately
#                                     2026-08-17; deleting this one flag undoes
#                                     it with no other edits. Note this does
#                                     NOT touch fontconfig: 50-qshell.conf's
#                                     `sans-serif → Adwaita Sans` still stands,
#                                     so web page body text stays proportional.
# --load-extension: the bundled omarchy extensions (chromium/extensions in
# the repo — copy-url Alt+Shift+L, yt-dlp Alt+Shift+D, whatsapp-slim), loaded
# unpacked straight from the checkout; run_after_21 registers their native
# messaging hosts. ${HOME} expands per environment.d(5).
CHROMIUM_USER_FLAGS=--ozone-platform-hint=auto --force-color-profile=srgb --blink-settings=downloadableBinaryFontsEnabled=false --enable-features=TouchpadOverscrollHistoryNavigation,WaylandPerSurfaceScale,WaylandUiScale,OverlayScrollbar --disable-features=AimEnabled,AiMode,AiModeOmniboxEntryPoint,AiModePageActionIconView,AiModeEntryPointAlwaysNavigates,AiModeStartPack,AimEligibilityService,AimUrlNavigation,AimUrlInterceptPassthrough,Compose,LensOverlay,OptimizationGuideOnDeviceModel,OptimizationGuideModelDownloading,WallpaperSearch --load-extension=${HOME}/.dotfiles/chromium/extensions/copy-url,${HOME}/.dotfiles/chromium/extensions/yt-dlp,${HOME}/.dotfiles/chromium/extensions/whatsapp-slim
