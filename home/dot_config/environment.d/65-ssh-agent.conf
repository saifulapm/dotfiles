# SSH agent for the whole session (managed by chezmoi) — Fedora's packaged
# ssh-agent.socket user unit (enabled in run_after_02) listens at this path;
# socket activation starts the agent on first use. The unit's own header
# prescribes exactly this export. environment.d rather than fish on purpose:
# the login-shell import can't clobber it (fish never sets SSH_AUTH_SOCK,
# unlike the PATH case 50-mise.conf documents), and systemd user units — the
# emacs daemon whose magit needs the agent, the one that motivated this
# (review 2026-08-07) — read only the manager environment anyway. The Arch
# box had the same pair (ssh-agent.socket in NIRI_WANTS + environment.d).
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
