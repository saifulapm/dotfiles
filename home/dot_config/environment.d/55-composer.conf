# COMPOSER_HOME pinned to the XDG path (managed by chezmoi). Composer only
# uses XDG when ~/.composer is absent AND XDG_CONFIG_HOME is set — a bash
# chezmoi script created ~/.composer once (no XDG in script env) and split
# the global tree away from the PATH fish expects (found 2026-08-07, same
# class of bug as GOPATH). The env var pins it in every context; fish
# exports it too (00-env.fish).
COMPOSER_HOME=$HOME/.config/composer
