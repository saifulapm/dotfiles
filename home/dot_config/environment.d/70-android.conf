# Set here as well as in fish, so user units and agents started before the session's import find rustup's cargo ahead of Fedora's, which has no Android std, and the SDK's tools; ~/.local/bin holds gradle and swift, appended so it shadows nothing.
ANDROID_HOME=${HOME}/Android/Sdk
PATH=${HOME}/.cargo/bin:${PATH}:${HOME}/.local/bin:${HOME}/Android/Sdk/platform-tools:${HOME}/Android/Sdk/cmdline-tools/latest/bin:${HOME}/Android/Sdk/emulator
