# mise shims on PATH for everything the systemd user manager starts (managed
# by chezmoi) — omarchy's pattern (uwsm env.d runs `mise activate bash
# --shims`) translated to systemd environment.d. Without this, node/pnpm/deno
# exist only inside shells that ran `mise activate`; user services and timers
# would see no node.
#
# Caveat this file can't fix alone: niri-session runs `systemctl --user
# import-environment` from the login fish, which OVERWRITES the manager's
# PATH with fish's. fish's 00-env.fish therefore adds the shims dir too —
# that copy is what niri and its spawned apps actually inherit. This file
# covers the pre-import window and headless (ssh) logins where niri-session
# never runs.
PATH=$HOME/.local/share/mise/shims:$PATH
