# Helix runtime for the kakoune fork's built-in tree-sitter — Fedora installs
# to lib64, which the fork's Linux candidate list misses (it checks
# /usr/lib/helix/runtime). This layer covers pre-import + headless contexts;
# the fish conf.d/00-env.fish twin is the copy that wins inside the session
# (niri-session's import-environment overwrites manager vars with fish's).
HELIX_RUNTIME=/usr/lib64/helix/runtime
