# Plugin ownership (2026-08-07): package.toml's deps are installed/updated by
# `ya pkg install` / `ya pkg upgrade` into ~/.config/yazi/plugins and are NOT
# in the chezmoi tree (ya rewrites package.toml, so this note lives here).
# The chezmoi tree vendors only the custom plugins with no upstream package:
# arrow, confirm-quit, folder-rules, parent-arrow, smart-paste, smart-switch,
# smart-tab. theme.toml is generated by bin/theme-apply — never edit or vendor.

[mgr]
show_hidden = false
sort_by = "mtime"
ratio = [2, 3, 3]
linemode = "size_and_mtime"

[preview]
wrap = "no"
max_width  = 2000
max_height = 2000

[opener]
play = [
	{ run = 'mpv "$@"', orphan = true, for = "unix" },
]
edit = [
	{ run = '$EDITOR "$@"', block = true, for = "unix" },
]
open = [
	{ run = 'xdg-open "$@"', desc = "Open" },
]
add-sub = [
  { run  = ''' echo sub-add "'$0'" | socat - /tmp/mpv.sock ''', desc = "Add sub to MPV" },
]
extract = [
	{ run = 'ouch decompress "$@"', desc = "Extract here", block = true },
]
reveal = [
	{ run = 'mediainfo "$1" | less', block = true, desc = "Media info" },
]

[open]
rules = [
	# Archives - extract with enter
	{ mime = "application/zip", use = "extract" },
	{ mime = "application/x-tar", use = "extract" },
	{ mime = "application/x-bzip*", use = "extract" },
	{ mime = "application/x-7z-compressed", use = "extract" },
	{ mime = "application/x-xz", use = "extract" },
	{ mime = "application/x-rar", use = "extract" },
	{ mime = "application/gzip", use = "extract" },

	{ mime = "text/*", use = "edit" },
	{ mime = "video/*", use = [ "play", "reveal" ] },
	{ mime = "audio/*", use = [ "play", "reveal" ] },
	{ mime = "image/*", use = "open" },

	# PDF opens with evince
	{ mime = "application/pdf", use = "open" },

	# Common config files
	{ url = "*.json", use = "edit" },
	{ url = "*.js", use = "edit" },
	{ url = "*.ts", use = "edit" },
	{ url = "*.md", use = "edit" },
	{ url = "*.yaml", use = "edit" },
	{ url = "*.yml", use = "edit" },
	{ url = "*.toml", use = "edit" },
	{ url = "*.lua", use = "edit" },
	{ url = "*.sh", use = "edit" },

	# Multiple openers for a single rule
	{ url = "*.html", use = [ "open", "edit" ] },
	{ url = "*.{ass,srt,ssa,sty,sup,vtt}", use = [ "add-sub", "edit" ] },

	# Fallback
	{ url = "*", use = "open" },
]
