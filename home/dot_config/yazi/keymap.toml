#:schema https://yazi-rs.github.io/schemas/keymap.json

[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block'
desc = "Open shell here"

[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

# y and x also put every selected file on the clipboard as text/uri-list, as Files does, so foot pastes them all as quoted paths.
[[mgr.prepend_keymap]]
on   = "y"
run  = [ '''shell -- python3 -c 'import sys, urllib.parse; sys.stdout.write("".join("file://" + urllib.parse.quote(p) + "\r\n" for p in sys.argv[1:]))' %s | wl-copy --type text/uri-list''', "yank" ]
desc = "Yank selected files and copy them to the clipboard"

[[mgr.prepend_keymap]]
on   = "x"
run  = [ '''shell -- python3 -c 'import sys, urllib.parse; sys.stdout.write("".join("file://" + urllib.parse.quote(p) + "\r\n" for p in sys.argv[1:]))' %s | wl-copy --type text/uri-list''', "yank --cut" ]
desc = "Cut selected files and copy them to the clipboard"

[[mgr.prepend_keymap]]
on   = [ "t", "t" ]
run  = "plugin smart-tab"
desc = "Create a tab and enter the hovered directory"

[[mgr.prepend_keymap]]
on   = "2"
run  = "plugin smart-switch 1"
desc = "Switch or create tab 2"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to the root of the repository"

[[mgr.prepend_keymap]]
on  = "k"
run = "plugin arrow -1"
desc = "Previous file (wrapping)"

[[mgr.prepend_keymap]]
on  = "j"
run = "plugin arrow 1"
desc = "Next file (wrapping)"

[[mgr.prepend_keymap]]
on  = "K"
run = "plugin parent-arrow -1"
desc = "Previous directory in the parent pane"

[[mgr.prepend_keymap]]
on  = "J"
run = "plugin parent-arrow 1"
desc = "Next directory in the parent pane"
