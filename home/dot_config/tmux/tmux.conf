set -g mouse on
set -g status-keys vi
set -g mode-keys vi
set -g escape-time 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g history-limit 10000
set -g monitor-activity off
set -g visual-activity off
set -g status-interval 1
set -g allow-rename off
set -g set-titles on
set -g set-titles-string '#T'
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -g status-left-length 80
set -g status-justify centre
set -g window-status-separator " "
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',foot:Tc'
set -ga terminal-overrides ',foot:RGB'
# Coloured undercurls, which kak's LSP diagnostics draw.
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind a run-shell "amx attach --waiting"
bind A run-shell "amx attach --next"
bind C-a run-shell "amx attach --last"
bind v run-shell "tmux select-window -t amx 2>/dev/null || tmux new-window -n amx amx"

source-file -q ~/.local/state/dots/theme-out/tmux.conf
