# External assets managed by chezmoi. Pinned versions — never "latest" — so
# all three machines converge on identical bytes.

# Symbols-only Nerd Font: bar/OSD icon glyphs render through fontconfig
# fallback while text stays on stock Fedora JetBrains Mono. ~2 MB instead of
# shipping a full patched font family.
[".local/share/fonts/nerd-symbols"]
    type = "archive"
    url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.0/NerdFontsSymbolsOnly.tar.xz"
    checksum.sha256 = "b7ef2283462b435f1fe91d729dc412d5dbe34269dd2c7f4e1d803e4105c8d883"
    refreshPeriod = "0"
    include = ["*.ttf"]

# The coding font. Fedora does not package Maple Mono, so it comes from the
# upstream release, pinned and checksummed. This is the plain TTF build, not
# MapleMono-NF: icon glyphs already come from the symbols-only font above, so
# there is no reason to carry the 21 MB patched build for the same result.
# Ligatures are on — that is the "NL" suffix's absence. `monospace` is pinned
# to this family by dot_config/fontconfig/conf.d/50-qshell.conf.
[".local/share/fonts/maple-mono"]
    type = "archive"
    url = "https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-TTF.zip"
    checksum.sha256 = "3a35f8f0669bef3dded9df208cc4526a6f7573210e134816e9084a8981271d75"
    refreshPeriod = "0"
    include = ["*.ttf"]

# Theme wallpapers: omarchy's per-theme backgrounds (the 22 themes in
# themes/ are ports of theirs — colors credited in CREDITS.md), ~105 MB of
# images that deliberately do NOT live in this repo's git history. Pinned to
# the same commit as the ~/ref/omarchy research checkout on 2026-08-07.
# stripComponents=2 drops "omarchy-<sha>/themes", so files land as
# <theme>/backgrounds/<image> — the layout bin/background-next and
# bin/theme-list read. User wallpapers go in ~/Pictures/Wallpapers instead;
# this directory belongs to chezmoi.
[".local/share/qshell/backgrounds"]
    type = "archive"
    url = "https://github.com/basecamp/omarchy/archive/fd1034f71b16aa45d5431ab41ed9e48c89fdac8e.tar.gz"
    checksum.sha256 = "bf7491e56090813e180a569a1a53cd491472868e10adbb077ca40edfb1d34e9f"
    refreshPeriod = "0"
    stripComponents = 2
    include = ["**/themes/*", "**/themes/*/backgrounds", "**/themes/*/backgrounds/*"]

# forgit — interactive git with fzf. The mac loads it through sheldon (zsh);
# here fish sources its fish port from this checkout (conf.d/30-forgit.fish).
# Pinned to 26.01.0, the same rev the mac's sheldon plugins.toml pins.
[".local/share/forgit"]
    type = "archive"
    url = "https://github.com/wfxr/forgit/archive/refs/tags/26.01.0.tar.gz"
    checksum.sha256 = "7cd2a0a2f892e4110853521eb77a7fad174463827d93f9f9b4ae49c30b6e52c7"
    refreshPeriod = "0"
    stripComponents = 1
