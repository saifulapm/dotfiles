# External assets managed by chezmoi. Pinned versions — never "latest" — so
# all three machines converge on identical bytes.

# Symbols-only Nerd Font: bar/OSD icon glyphs render through fontconfig
# fallback while text stays on stock Fedora JetBrains Mono. ~2 MB instead of
# shipping a full patched font family.
[".local/share/fonts/nerd-symbols"]
    type = "archive"
    url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.0/NerdFontsSymbolsOnly.tar.xz"
    checksum.sha256 = "b7ef2283462b435f1fe91d729dc412d5dbe34269dd2c7f4e1d803e4105c8d883"
    refreshPeriod = "0"
    include = ["*.ttf"]

# The coding font. Fedora does not package Maple Mono, so it comes from the
# upstream release, pinned and checksummed. This is the plain TTF build, not
# MapleMono-NF: icon glyphs already come from the symbols-only font above, so
# there is no reason to carry the 21 MB patched build for the same result.
# Ligatures are on — that is the "NL" suffix's absence. `monospace` is pinned
# to this family by dot_config/fontconfig/conf.d/50-qshell.conf.
[".local/share/fonts/maple-mono"]
    type = "archive"
    url = "https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-TTF.zip"
    checksum.sha256 = "3a35f8f0669bef3dded9df208cc4526a6f7573210e134816e9084a8981271d75"
    refreshPeriod = "0"
    include = ["*.ttf"]
