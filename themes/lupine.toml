# Lupine — ported from omarchy (MIT).
# Colors: omarchy. Character (shape/motion): ours, see bin/theme-port-omarchy.

[meta]
name = "Lupine"
mode = "light"
preset = "playful"

[surface]
"0" = "#ececec"
"1" = "#fafafa"
"2" = "#f5f5f5"
"3" = "#e1e1e1"

[text]
primary = "#000000"
muted = "#888888"
inverse = "#fafafa"

[accent]
accent = "#3264eb"
error = "#c900c4"
warn = "#026fde"
ok = "#4a2fd0"

[ansi]
black = "#dedede"
red = "#c900c4"
green = "#4a2fd0"
yellow = "#026fde"
blue = "#3264eb"
magenta = "#8a4ad7"
cyan = "#0c67de"
white = "#212121"
bright-black = "#9e9e9e"
bright-red = "#f930fb"
bright-green = "#9f85e0"
bright-yellow = "#358fff"
bright-blue = "#5482ff"
bright-magenta = "#b363ff"
bright-cyan = "#3986ff"
bright-white = "#000000"

[shape]
radius = 8
border-width = 1

[motion]
duration = 150
easing = "standard"

# GTK icon theme for this theme (omarchy's themes/lupine/icons.theme value;
# consumed by bin/theme-apply's gsettings flip, Yaru variants from the
# yaru-icon-theme rpm).
[icon]
theme = "Yaru-purple"

# Gradient border: accent.accent into accent.error across the frame.
[border]
active = "#3264eb #c900c4 45deg"
