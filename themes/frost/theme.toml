[meta]
name = "frost"
mode = "dark"

# Nord as frosted glass over ice. Alpha comes last, as niri writes it; the renderer turns it round for Qt.
[color]
paper = "#2E3440"
surface = "#3B4252"
glass = "#3B4252D9"
edge = "#ECEFF424"
ink = "#D8DEE9"
muted = "#AEB7C6"
line = "#434C5E"
accent = "#88C0D0"
danger = "#BF616A"
ok = "#A3BE8C"
ansi = [
  "#3B4252", "#BF616A", "#A3BE8C", "#EBCB8B", "#81A1C1", "#B48EAD", "#88C0D0", "#E5E9F0",
  "#AEB7C6", "#BF616A", "#A3BE8C", "#EBCB8B", "#81A1C1", "#B48EAD", "#8FBCBB", "#ECEFF4",
]

# Code colours, from Helix's nord theme, with comments lifted to 3.5:1.
[syntax]
keyword = "#81A1C1"
function = "#88C0D0"
string = "#A3BE8C"
type = "#8FBCBB"
value = "#B48EAD"
variable = "#D8DEE9"
attribute = "#81A1C1"
meta = "#81A1C1"
builtin = "#8FBCBB"
comment = "#7B88A1"

[primitive]
paper = "frost"
frame = "hairline"
shadow = "none"
corner = "round"
motion = "ease"

# Ice grain and fern veins of Snow Storm, reaching this alpha at the corners; the middle stays clear.
[paper]
frost_alpha = 0.22

[type]
display = "Inter"
ui = "Inter"
voice = "plain"
mono = "Maple Mono"
scale = 1.0

[niri]
gaps = 20
border = 1
radius = 10
blur = true
border_active = "#88C0D0"
border_inactive = "#434C5E"
