[meta]
name = "artboard"
mode = "light"

[color]
paper = "#E4E6EA"
ink = "#15171B"
muted = "#57606A"
line = "#D0D7DE"
surface = "#FFFFFF"
accent = "#3D5AFE"
danger = "#CF222E"
ok = "#1A7F37"
ansi = [
  "#15171B", "#CF222E", "#1A7F37", "#9A6700", "#3D5AFE", "#8250DF", "#1B7C83", "#6E7781",
  "#57606A", "#A40E26", "#116329", "#7D4E00", "#0969DA", "#6639BA", "#3192AA", "#8C959F",
]

# Code colours, from GitHub Light (Primer).
[syntax]
keyword = "#CF222E"
function = "#8250DF"
string = "#0A3069"
type = "#953800"
value = "#0550AE"
variable = "#15171B"
attribute = "#116329"
meta = "#0550AE"
builtin = "#0550AE"
comment = "#6E7781"

[primitive]
paper = "dots"
frame = "none"
shadow = "soft"
corner = "round"
motion = "spring"

[paper]
spacing = 16
dot = "#B4BAC4"

[type]
display = "Maple Mono"
ui = "Maple Mono"
voice = "plain"
mono = "Maple Mono"
scale = 1.0

[niri]
gaps = 28
border = 0
blur = false
ring_width = 2
ring_color = "#3D5AFE"
shadow_softness = 40
shadow_spread = 0
shadow_offset = [0, 18]
shadow_color = "#15171B2E"
tab_position = "top"
tab_width = 4
tab_gap = 8
tab_length = 0.3
tab_gaps = 8
