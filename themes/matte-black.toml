# Matte Black — ported from omarchy (MIT).
# Colors: omarchy. Character (shape/motion): ours, see bin/theme-port-omarchy.

[meta]
name = "Matte Black"
mode = "dark"
preset = "shaded"

[surface]
"0" = "#0d0d0d"
"1" = "#121212"
"2" = "#1e1e1e"
"3" = "#2b2b2b"

[text]
primary = "#bebebe"
muted = "#5f5f5f"
inverse = "#090909"

[accent]
accent = "#e68e0d"
error = "#D35F5F"
warn = "#b91c1c"
ok = "#FFC107"

[ansi]
black = "#0d0d0d"
red = "#D35F5F"
green = "#FFC107"
yellow = "#b91c1c"
blue = "#e68e0d"
magenta = "#D35F5F"
cyan = "#bebebe"
white = "#bebebe"
bright-black = "#333333"
bright-red = "#B91C1C"
bright-green = "#FFC107"
bright-yellow = "#b90a0a"
bright-blue = "#f59e0b"
bright-magenta = "#B91C1C"
bright-cyan = "#eaeaea"
bright-white = "#bebebe"

[shape]
radius = 4
border-width = 1

[motion]
duration = 150
easing = "standard"

# GTK icon theme for this theme (omarchy's themes/matte-black/icons.theme value;
# consumed by bin/theme-apply's gsettings flip, Yaru variants from the
# yaru-icon-theme rpm).
[icon]
theme = "Yaru-red"
