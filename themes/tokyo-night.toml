# Tokyo Night — the reference theme. One file is one theme.
# Missing keys fall back to the shell's builtin defaults.

[meta]
name = "Tokyo Night"
mode = "dark"

[surface]
"0" = "#16161e"
"1" = "#1a1b26"
"2" = "#24283b"
"3" = "#2f3549"

[text]
primary = "#c0caf5"
muted = "#58618c"
inverse = "#15161e"
on-accent = "#15161e"

[accent]
accent = "#7aa2f7"
error = "#f7768e"
warn = "#e0af68"
ok = "#9ece6a"

[ansi]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
bright-black = "#414868"
bright-red = "#ff7a93"
bright-green = "#b9f27c"
bright-yellow = "#ff9e64"
bright-blue = "#7da6ff"
bright-magenta = "#bb9af7"
bright-cyan = "#0db9d7"
bright-white = "#c0caf5"

[shape]
radius = 8
border-width = 1

[space]
unit = 4
density = 1.0

[font]
ui = "sans-serif"
mono = "JetBrains Mono"
size = 12

[motion]
duration = 150
easing = "standard"

[bar]
height = 26
width-vertical = 28

# The active-window / active-surface border. ONE token, holding either a solid
# color or a gradient, in omarchy's grammar for hyprland_active_border:
#
#   active = "#7aa2f7"                        solid
#   active = "#26a269ee #2ec27eee 45deg"      gradient (angle optional)
#
# Colors may carry an alpha byte last (#rrggbbaa), the way CSS and niri write
# it. The angle is Hyprland's: 0 is left-to-right and increases clockwise on
# screen; bin/theme-apply converts it to CSS for niri's `angle=`.
#
# Omitted, it derives from accent.accent — so a theme only names it to add a
# gradient or to pull the border off the accent. It drives niri's border and
# focus-ring (active-gradient when it is a gradient, active-color when it is
# not), the bar-widget flyout card, and the lock field. Surfaces that cannot
# draw a gradient take its first stop.
[border]
active = "accent.accent"

# ---------------------------------------------------------------------------
# PER-SURFACE OVERRIDES
#
# Everything above is a BASE token: it applies everywhere. The sections below
# restyle ONE surface each, and only the keys they name — anything a section
# omits keeps the base-token recipe that surface already used. Omarchy's
# surface-role model (their generated shell.toml), folded into our one file
# per theme.
#
# A value may be a #rrggbb / #rrggbbaa literal, or the name of another token
# ("accent.error", "surface.2"), which is followed.
#
# Where an alpha companion makes sense, the section takes `<key>-alpha` beside
# `<key>` (0 = invisible, 1 = opaque); the pair composes into one color.
#
# Surfaces and their keys (fallback in brackets):
#
#   [bar]            background [surface.1] + -alpha [1.0]
#                    text [ansi.white], active [accent.error]
#                    (also carries the base keys height / width-vertical above)
#   [panel]          bar-widget flyout cards. background [surface.1] + -alpha,
#                    text [text.primary], border [border.active] + -alpha —
#                    gradient-or-solid, drawn as a gradient ring when it is one
#   [tooltip]        background [surface.1] + -alpha [0.97],
#                    text [ansi.white], border [ansi.white] + -alpha
#   [notifications]  background [surface.2] + -alpha, text [text.primary],
#                    text-muted [text.muted], border [accent.accent] + -alpha,
#                    border-error [accent.error] + -alpha,
#                    countdown [accent.accent]
#   [lock]           background [surface.1] + -alpha [0.8], text [text.primary],
#                    placeholder [text.primary @ 0.66], text-error [accent.error],
#                    border-active [border.active] (gradient-or-solid, drawn as
#                    a gradient ring when it is one), border-error [accent.error],
#                    border-alpha [1.0] (shared by both border states — they are
#                    mutually exclusive in time), selection [accent.accent] +
#                    -alpha [0.45]
#   [menu]           background [surface.1] + -alpha, text [text.primary],
#                    border [surface.3] + -alpha, scrim [surface.0] + -alpha [0.5],
#                    selected-background [accent.accent] + -alpha [0.15],
#                    selected-text [accent.accent]
#   [osd]            background [surface.1] + -alpha, text [text.primary],
#                    border [surface.3] + -alpha
#
# [bar], [panel], [tooltip], [notifications] and [lock] are wired to their
# surfaces. [menu] and [osd] are defined and resolvable but the Menu and OSD
# modules still read base tokens — porting them is follow-up work.
#
# The same sections are accepted in ~/.config/qshell/theme-override.toml, a
# machine-level file layered over whatever theme is active (see CREDITS.md).
# ---------------------------------------------------------------------------

# Omarchy ships this exact override for tokyo-night (themes/tokyo-night/
# shell.lock.toml, MIT — see CREDITS.md): the lock screen goes monochrome,
# every role collapsing onto the theme's plain foreground. `border` is their
# idle-field role; our field, like theirs, is always active-or-error, so it is
# carried for completeness rather than read.
[lock]
text = "#a9b1d6"
placeholder = "#a9b1d6"
text-error = "#a9b1d6"
border = "#a9b1d6"
border-active = "#a9b1d6"
border-error = "#a9b1d6"
