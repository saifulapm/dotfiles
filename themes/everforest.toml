# Everforest — ported from omarchy (MIT).
# Colors: omarchy. Character (shape/motion): ours, see bin/theme-port-omarchy.

[meta]
name = "Everforest"
mode = "dark"

[surface]
"0" = "#21272c"
"1" = "#2d353b"
"2" = "#343f44"
"3" = "#414a4c"

[text]
primary = "#d3c6aa"
muted = "#657177"
inverse = "#181d20"

[accent]
accent = "#7fbbb3"
error = "#e67e80"
warn = "#dbbc7f"
ok = "#a7c080"

[ansi]
black = "#21272c"
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"
white = "#d3c6aa"
bright-black = "#475258"
bright-red = "#e67e80"
bright-green = "#a7c080"
bright-yellow = "#dbbc7f"
bright-blue = "#7fbbb3"
bright-magenta = "#d699b6"
bright-cyan = "#83c092"
bright-white = "#d3c6aa"

[shape]
radius = 8
border-width = 1

[motion]
duration = 150
easing = "standard"

# GTK icon theme for this theme (omarchy's themes/everforest/icons.theme value;
# consumed by bin/theme-apply's gsettings flip, Yaru variants from the
# yaru-icon-theme rpm).
[icon]
theme = "Yaru-sage"
