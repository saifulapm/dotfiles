[meta]
name = "paper"
mode = "light"

[color]
paper = "#F1E9D8"
ink = "#1C1915"
muted = "#575653"
line = "#CECDC3"
surface = "#FAF6EC"
accent = "#C8381E"
danger = "#C8381E"
ok = "#66800B"
ansi = [
  "#1C1915", "#C8381E", "#66800B", "#8E6B01", "#205EA6", "#A02F6F", "#24837B", "#6F6E69",
  "#575653", "#942822", "#536907", "#664D01", "#1A4F8C", "#87285E", "#1C6C66", "#878580",
]

# Code colours, from Flexoki Light.
[syntax]
keyword = "#66800B"
function = "#BC5215"
string = "#24837B"
type = "#8E6B01"
value = "#BC5215"
variable = "#1C1915"
attribute = "#205EA6"
meta = "#A02F6F"
builtin = "#C8381E"
comment = "#575653"

[primitive]
paper = "grain"
frame = "ink"
shadow = "hard-offset"
corner = "square"
motion = "snappy"

[paper]
grain = 0.06

[type]
display = "Instrument Serif"
ui = "Maple Mono"
voice = "caps"
mono = "Maple Mono"
scale = 1.0

[niri]
gaps = 24
border = 1
blur = false
border_inactive = "#575653"
shadow_softness = 0
shadow_spread = 0
shadow_offset = [3, 3]
shadow_color = "#1C1915"
shadow_inactive = "#575653"
tab_position = "top"
tab_width = 5
tab_gap = 6
tab_length = 1.0
tab_gaps = 6
