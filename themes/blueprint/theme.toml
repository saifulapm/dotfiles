[meta]
name = "blueprint"
mode = "dark"

[color]
paper = "#0C1A2E"
ink = "#D6F4F8"
muted = "#80A4C2"
line = "#2E5A72"
surface = "#0A1526"
accent = "#7FE3F0"
danger = "#FFB547"
ok = "#ADDB67"
ansi = [
  "#2E5A72", "#EF5350", "#ADDB67", "#FFB547", "#82AAFF", "#C792EA", "#7FE3F0", "#D6F4F8",
  "#80A4C2", "#FF5874", "#C5E478", "#FFEB95", "#82B1FF", "#C789D6", "#7FDBCA", "#FFFFFF",
]

# Code colours, from Night Owl.
[syntax]
keyword = "#C792EA"
function = "#82AAFF"
string = "#ECC48D"
type = "#FFCB8B"
value = "#F78C6C"
variable = "#D6DEEB"
attribute = "#7FDBCA"
meta = "#FF5874"
builtin = "#7FDBCA"
comment = "#637777"

[primitive]
paper = "grid"
frame = "glow"
shadow = "none"
corner = "cut"
motion = "linear"

[paper]
minor = 16
major = 80
minor_alpha = 0.05
major_alpha = 0.13

[type]
display = "Maple Mono"
ui = "Maple Mono"
voice = "bracket"
mono = "Maple Mono"
scale = 1.0

[niri]
gaps = 24
border = 1
blur = false
border_inactive = "#2E5A72"
shadow_softness = 18
shadow_spread = 0
shadow_offset = [0, 0]
shadow_color = "#7FE3F040"
shadow_inactive = "#00000000"
tab_position = "left"
tab_width = 2
tab_gap = 6
tab_length = 1.0
tab_gaps = 4
