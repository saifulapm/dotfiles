# UI and code colours from navarasu/onedark.nvim's dark style (lua/onedark/palette.lua): paper bg_d, surface bg0, ink fg, muted light_grey, line its WinSeparator bg3, comment grey and meta its PreProc purple; the ANSI 16 are its terminal colours (lua/onedark/terminal.lua).
[meta]
name = "one-dark"
title = "One Dark"
family = "One"
variant = "dark"
source = "https://github.com/navarasu/onedark.nvim"
licence = "MIT"

[color]
paper = "#21252B"
surface = "#282C34"
ink = "#ABB2BF"
muted = "#848B98"
line = "#3B3F4C"
accent = "#61AFEF"
danger = "#E86671"
ok = "#98C379"
ansi = [
  "#181A1F", "#E86671", "#98C379", "#E5C07B", "#61AFEF", "#C678DD", "#56B6C2", "#ABB2BF",
  "#5C6370", "#E86671", "#98C379", "#E5C07B", "#61AFEF", "#C678DD", "#56B6C2", "#ABB2BF",
]

[syntax]
keyword = "#C678DD"
function = "#61AFEF"
string = "#98C379"
type = "#E5C07B"
value = "#D19A66"
variable = "#E86671"
attribute = "#D19A66"
meta = "#C678DD"
builtin = "#56B6C2"
comment = "#5C6370"
