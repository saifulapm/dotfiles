# UI and code colours from navarasu/onedark.nvim's light style (lua/onedark/palette.lua): paper bg_d, surface bg0, ink fg, muted light_grey, line its WinSeparator bg3, comment grey and meta its PreProc purple; the ANSI 16 are its terminal colours (lua/onedark/terminal.lua). Text colours that read under 4.5:1 on surface, and the comment and ANSI 8 under 3:1, are moved in OKLCH lightness, keeping hue, until they do; ink also reads at 4.5:1 on line.
[meta]
name = "one-light"
title = "One Light"
family = "One"
variant = "light"
source = "https://github.com/navarasu/onedark.nvim"
licence = "MIT"

[color]
paper = "#C9C9C9"
surface = "#FAFAFA"
ink = "#383A42"
muted = "#717377"
line = "#DCDCDC"
accent = "#356CE5"
danger = "#CE4136"
ok = "#318332"
ansi = [
  "#101012", "#CE4136", "#318332", "#986801", "#356CE5", "#A626A4", "#007BB0", "#383A42",
  "#909197", "#CE4136", "#318332", "#986801", "#356CE5", "#A626A4", "#007BB0", "#383A42",
]

[syntax]
keyword = "#A626A4"
function = "#356CE5"
string = "#318332"
type = "#986801"
value = "#9B6A06"
variable = "#CE4136"
attribute = "#9B6A06"
meta = "#A626A4"
builtin = "#007BB0"
comment = "#909197"
