# UI and code colours from navarasu/onedark.nvim's light style (lua/onedark/palette.lua): paper bg_d, surface bg0, ink fg, muted light_grey, line its WinSeparator bg3, comment grey and meta its PreProc purple; the ANSI 16 are its terminal colours (lua/onedark/terminal.lua).
[meta]
name = "one-light"
title = "One Light"
family = "One"
variant = "light"
source = "https://github.com/navarasu/onedark.nvim"
licence = "MIT"

[color]
paper = "#C9C9C9"
surface = "#FAFAFA"
ink = "#383A42"
muted = "#818387"
line = "#DCDCDC"
accent = "#4078F2"
danger = "#E45649"
ok = "#50A14F"
ansi = [
  "#101012", "#E45649", "#50A14F", "#986801", "#4078F2", "#A626A4", "#0184BC", "#383A42",
  "#A0A1A7", "#E45649", "#50A14F", "#986801", "#4078F2", "#A626A4", "#0184BC", "#383A42",
]

[syntax]
keyword = "#A626A4"
function = "#4078F2"
string = "#50A14F"
type = "#986801"
value = "#C18401"
variable = "#E45649"
attribute = "#C18401"
meta = "#A626A4"
builtin = "#0184BC"
comment = "#A0A1A7"
