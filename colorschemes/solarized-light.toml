# UI and code colours from altercation/solarized's palette and light roles (README.md): surface base3, muted and comment base1, line base2, meta magenta; ink is base00 #657B83 moved in OKLCH lightness to #5F757C, 4.13:1 to 4.50:1 on base3; paper is base3 darkened 0.06 in OKLCH lightness, as base2 is the line; the ANSI 16 are its xresources/solarized with the light base swap. Text colours that read under 4.5:1 on surface, and the comment and ANSI 8 under 3:1, are moved in OKLCH lightness, keeping hue, until they do; ink also reads at 4.5:1 on line.
[meta]
name = "solarized-light"
title = "Solarized Light"
family = "Solarized"
variant = "light"
source = "https://github.com/altercation/solarized"
licence = "MIT"

[color]
paper = "#E9E2CF"
surface = "#FDF6E3"
ink = "#576C73"
muted = "#667373"
line = "#EEE8D5"
accent = "#0076BA"
danger = "#D72C2A"
ok = "#687805"
ansi = [
  "#EEE8D5", "#D72C2A", "#687805", "#8F6C04", "#0076BA", "#CD307D", "#097F77", "#073642",
  "#FDF6E3", "#C6460E", "#667373", "#647476", "#5F757C", "#6569BB", "#586E75", "#002B36",
]

[syntax]
keyword = "#6569BB"
function = "#0076BA"
string = "#687805"
type = "#8F6C04"
value = "#C6460E"
variable = "#D72C2A"
attribute = "#C6460E"
meta = "#CD307D"
builtin = "#097F77"
comment = "#839191"
