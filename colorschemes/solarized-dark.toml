# UI and code colours from altercation/solarized's palette and dark roles (README.md): surface base03, ink base0, muted and comment base01, line base02, meta magenta; paper is base03 darkened 0.06 in OKLCH lightness, as Solarized has no darker background; the ANSI 16 are its xresources/solarized.
[meta]
name = "solarized-dark"
title = "Solarized Dark"
family = "Solarized"
variant = "dark"
source = "https://github.com/altercation/solarized"
licence = "MIT"

[color]
paper = "#001C27"
surface = "#002B36"
ink = "#839496"
muted = "#586E75"
line = "#073642"
accent = "#268BD2"
danger = "#DC322F"
ok = "#859900"
ansi = [
  "#073642", "#DC322F", "#859900", "#B58900", "#268BD2", "#D33682", "#2AA198", "#EEE8D5",
  "#002B36", "#CB4B16", "#586E75", "#657B83", "#839496", "#6C71C4", "#93A1A1", "#FDF6E3",
]

[syntax]
keyword = "#6C71C4"
function = "#268BD2"
string = "#859900"
type = "#B58900"
value = "#CB4B16"
variable = "#DC322F"
attribute = "#CB4B16"
meta = "#D33682"
builtin = "#2AA198"
comment = "#586E75"
