# UI and code colours from EdenEast/nightfox.nvim's own base16 (extra/nightfox/base16.yaml), paper its bg0 (lua/nightfox/palette/nightfox.lua); the ANSI 16 are its kitty extra's (extra/nightfox/kitty.conf).
[meta]
name = "nightfox"
title = "Nightfox"
family = "Nightfox"
variant = "dark"
source = "https://github.com/EdenEast/nightfox.nvim"
licence = "MIT"

[color]
paper = "#131A24"
surface = "#192330"
ink = "#CDCECF"
muted = "#71839B"
line = "#29394F"
accent = "#719CD6"
danger = "#C94F6D"
ok = "#81B29A"
ansi = [
  "#393B44", "#C94F6D", "#81B29A", "#DBC074", "#719CD6", "#9D79D6", "#63CDCF", "#DFDFE0",
  "#575860", "#D16983", "#8EBAA4", "#E0C989", "#86ABDC", "#BAA1E2", "#7AD5D6", "#E4E4E5",
]

[syntax]
keyword = "#9D79D6"
function = "#719CD6"
string = "#81B29A"
type = "#DBC074"
value = "#F4A261"
variable = "#C94F6D"
attribute = "#F4A261"
meta = "#D67AD2"
builtin = "#63CDCF"
comment = "#575860"
