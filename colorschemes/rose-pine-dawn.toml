# Board colours for the UI and code; the ANSI 16 are rose-pine/alacritty's (dist/rose-pine-dawn.toml), danger, ok, attribute and meta the tinted-theming base16 "Rosé Pine Dawn" base08, 0B, 09, 0F.
[meta]
name = "rose-pine-dawn"
title = "Rosé Pine Dawn"
family = "Rosé Pine"
variant = "light"
source = "https://github.com/rose-pine/rose-pine-theme"
licence = "MIT"

[color]
paper = "#F2E9E1"
surface = "#FAF4ED"
ink = "#575279"
muted = "#797593"
line = "#DFDAD9"
accent = "#907AA9"
danger = "#B4637A"
ok = "#286983"
ansi = [
  "#F2E9E1", "#B4637A", "#286983", "#EA9D34", "#56949F", "#907AA9", "#D7827E", "#575279",
  "#9893A5", "#B4637A", "#286983", "#EA9D34", "#56949F", "#907AA9", "#D7827E", "#575279",
]

[syntax]
keyword = "#286983"
function = "#D7827E"
string = "#EA9D34"
type = "#56949F"
value = "#D7827E"
variable = "#575279"
attribute = "#EA9D34"
meta = "#CECACD"
builtin = "#B4637A"
comment = "#9893A5"
