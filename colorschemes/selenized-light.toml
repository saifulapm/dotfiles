# UI and code colours from the tinted-theming base16 "selenized-light", whose values are jan-warchol/selenized's own (the-values.md), paper its bg_1; the ANSI 16 are its alacritty theme (terminals/alacritty/selenized-light.toml). Text colours that read under 4.5:1 on surface, and the comment and ANSI 8 under 3:1, are moved in OKLCH lightness, keeping hue, until they do; ink also reads at 4.5:1 on line.
[meta]
name = "selenized-light"
title = "Selenized Light"
family = "Selenized"
variant = "light"
source = "https://github.com/jan-warchol/selenized"
licence = "MIT"

[color]
paper = "#ECE3CC"
surface = "#FBF3DB"
ink = "#475B61"
muted = "#69716D"
line = "#D5CDB6"
accent = "#006DCE"
danger = "#CC1729"
ok = "#3C7E02"
ansi = [
  "#ECE3CC", "#D2212D", "#3E7E03", "#886B03", "#026FCE", "#BD3B8C", "#097D72", "#909995",
  "#D5CDB6", "#CC1729", "#3C7E02", "#896B03", "#006DCE", "#BD3C8C", "#017D72", "#3A4D53",
]

[syntax]
keyword = "#805BBE"
function = "#006DCE"
string = "#3C7E02"
type = "#896B03"
value = "#B65210"
variable = "#CC1729"
attribute = "#B65210"
meta = "#BD3C8C"
builtin = "#017D72"
comment = "#858E8A"
