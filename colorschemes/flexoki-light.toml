# UI and code colours from the tinted-theming base24 "Flexoki Light" (Steph Ango's, matching kepano/flexoki _generators/src/palette.ts), paper its base10, Flexoki base-50; the ANSI 16 are kepano/flexoki's kitty theme (kitty/flexoki_light.conf). Text colours that read under 4.5:1 on surface, and the comment and ANSI 8 under 3:1, are moved in OKLCH lightness, keeping hue, until they do; ink also reads at 4.5:1 on line.
[meta]
name = "flexoki-light"
title = "Flexoki Light"
family = "Flexoki"
variant = "light"
source = "https://github.com/kepano/flexoki"
licence = "MIT"

[color]
paper = "#F2F0E5"
surface = "#FFFCF0"
ink = "#403E3C"
muted = "#76746E"
line = "#E6E4D9"
accent = "#205EA6"
danger = "#AF3029"
ok = "#647E06"
ansi = [
  "#100F0F", "#CB483C", "#6B7C12", "#916F01", "#3779B2", "#BC4C87", "#02837A", "#FFFCF0",
  "#6F6E69", "#AF3029", "#647E06", "#936F07", "#205EA6", "#A02F6F", "#218179", "#F2F0E5",
]

[syntax]
keyword = "#5E409D"
function = "#205EA6"
string = "#647E06"
type = "#936F07"
value = "#BC5215"
variable = "#AF3029"
attribute = "#BC5215"
meta = "#A02F6F"
builtin = "#218179"
comment = "#94938A"
