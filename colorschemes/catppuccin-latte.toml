# UI and code colours are catppuccin/palette's Latte (palette.json); the ANSI 16 are catppuccin/foot's (themes/static/catppuccin-latte.ini), danger, ok, attribute and meta the tinted-theming base24 "Catppuccin Latte" base08, 0B, 09, 0F. Text colours that read under 4.5:1 on surface, and the comment and ANSI 8 under 3:1, are moved in OKLCH lightness, keeping hue, until they do; ink also reads at 4.5:1 on line.
[meta]
name = "catppuccin-latte"
title = "Catppuccin Latte"
family = "Catppuccin"
variant = "light"
source = "https://github.com/catppuccin/palette"
licence = "MIT"

[color]
paper = "#DCE0E8"
surface = "#EFF1F5"
ink = "#4C4F69"
muted = "#696C82"
line = "#CCD0DA"
accent = "#1B63F2"
danger = "#D20F39"
ok = "#217F02"
ansi = [
  "#5C5F77", "#D20F39", "#217F02", "#9D6000", "#1B63F2", "#B24297", "#097A80", "#ACB0BE",
  "#6C6F85", "#D20F39", "#217F02", "#9D6000", "#1B63F2", "#B24297", "#097A80", "#BCC0CC",
]

[syntax]
keyword = "#8839EF"
function = "#1B63F2"
string = "#217F02"
type = "#9D6000"
value = "#BD4804"
variable = "#4C4F69"
attribute = "#BD4804"
meta = "#B05052"
builtin = "#D20F39"
comment = "#7C7F93"
