# Board colours for the UI and code; the ANSI 16 are Primer's (@primer/primitives 11.10.0 light.css), danger and ok its fgColor-danger and fgColor-success, attribute and meta the tinted-theming base16 "Github" base09 and 0F. Text colours that read under 4.5:1 on surface, and the comment and ANSI 8 under 3:1, are moved in OKLCH lightness, keeping hue, until they do; ink also reads at 4.5:1 on line.
[meta]
name = "github-light"
title = "GitHub Light"
family = "GitHub"
variant = "light"
source = "https://github.com/primer/primitives"
licence = "MIT"

[color]
paper = "#E8EAED"
surface = "#FFFFFF"
ink = "#1F2328"
muted = "#59636E"
line = "#D1D9E0"
accent = "#0969DA"
danger = "#D1242F"
ok = "#1A7F37"
ansi = [
  "#1F2328", "#CF222E", "#116329", "#4D2D00", "#0969DA", "#8250DF", "#1B7C83", "#59636E",
  "#393F46", "#A40E26", "#1A7F37", "#633C01", "#0375E2", "#8C5BDD", "#188199", "#818B98",
]

[syntax]
keyword = "#CF222E"
function = "#8250DF"
string = "#0A3069"
type = "#953800"
value = "#0550AE"
variable = "#1F2328"
attribute = "#953800"
meta = "#A40E26"
builtin = "#0550AE"
comment = "#59636E"
