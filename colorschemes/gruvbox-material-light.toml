# UI and code colours are sainnhe/gruvbox-material's light "medium" background and "material" foreground (autoload/gruvbox_material.vim), the code ones as colors/gruvbox-material.vim's syntax groups use them; paper is its bg_dim and line its window separator bg5. The ANSI 16 are its terminal colours (colors/gruvbox-material.vim), attribute and meta the tinted-theming base16 "Gruvbox Material Light, Medium" base09 and 0F. Text colours that read under 4.5:1 on surface, and the comment and ANSI 8 under 3:1, are moved in OKLCH lightness, keeping hue, until they do; ink also reads at 4.5:1 on line.
[meta]
name = "gruvbox-material-light"
title = "Gruvbox Material Light"
family = "Gruvbox Material"
variant = "light"
source = "https://github.com/sainnhe/gruvbox-material"
licence = "MIT"

[color]
paper = "#F2E5BC"
surface = "#FBF1C7"
ink = "#654735"
muted = "#786B60"
line = "#DDCCAB"
accent = "#45707A"
danger = "#BC4646"
ok = "#677329"
ansi = [
  "#654735", "#BC4646", "#677329", "#9B6001", "#45707A", "#935D7F", "#49775A", "#DDCCAB",
  "#654735", "#BC4646", "#677329", "#9B6001", "#45707A", "#935D7F", "#49775A", "#DDCCAB",
]

[syntax]
keyword = "#BC4646"
function = "#677329"
string = "#677329"
type = "#9B6001"
value = "#935D7F"
variable = "#45707A"
attribute = "#B05303"
meta = "#AD550E"
builtin = "#9B6001"
comment = "#928374"
