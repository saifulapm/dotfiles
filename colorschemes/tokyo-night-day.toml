# UI and code colours are folke/tokyonight.nvim's day palette (extras/lua/tokyonight_day.lua), the code ones as its highlight groups use them (lua/tokyonight/groups/base.lua, treesitter.lua); the ANSI 16 are its foot extra (extras/foot/tokyonight_day.ini).
[meta]
name = "tokyo-night-day"
title = "Tokyo Night Day"
family = "Tokyo Night"
variant = "light"
source = "https://github.com/folke/tokyonight.nvim"
licence = "Apache-2.0"

[color]
paper = "#D0D5E3"
surface = "#E1E2E7"
ink = "#3760BF"
muted = "#6172B0"
line = "#C4C8DA"
accent = "#2E7DE9"
danger = "#F52A65"
ok = "#587539"
ansi = [
  "#B4B5B9", "#F52A65", "#587539", "#8C6C3E", "#2E7DE9", "#9854F1", "#007197", "#6172B0",
  "#A1A6C5", "#F52A65", "#587539", "#8C6C3E", "#2E7DE9", "#9854F1", "#007197", "#3760BF",
]

[syntax]
keyword = "#7847BD"
function = "#2E7DE9"
string = "#587539"
type = "#188092"
value = "#B15C00"
variable = "#3760BF"
attribute = "#387068"
meta = "#007197"
builtin = "#F52A65"
comment = "#848CB5"
