# sainnhe/sonokai's default palette (autoload/sonokai.vim), placed as colors/sonokai.vim uses it, since Sonokai has no base16: paper bg_dim, line the Visual bg4, muted and comment grey, and the code colours its own groups (Keyword and PreProc red, Function green, String yellow, Type and TSAttribute blue, Number and TSVariableBuiltin purple, TSVariable fg). The ANSI 16 are its terminal_color_0 to 15, which put orange in the cyan slots.
[meta]
name = "sonokai"
title = "Sonokai"
family = "Sonokai"
variant = "dark"
source = "https://github.com/sainnhe/sonokai"
licence = "MIT"

[color]
paper = "#222327"
surface = "#2C2E34"
ink = "#E2E2E3"
muted = "#7F8490"
line = "#414550"
accent = "#76CCE0"
danger = "#FC5D7C"
ok = "#9ED072"
ansi = [
  "#181819", "#FC5D7C", "#9ED072", "#E7C664", "#76CCE0", "#B39DF3", "#F39660", "#E2E2E3",
  "#7F8490", "#FC5D7C", "#9ED072", "#E7C664", "#76CCE0", "#B39DF3", "#F39660", "#E2E2E3",
]

[syntax]
keyword = "#FC5D7C"
function = "#9ED072"
string = "#E7C664"
type = "#76CCE0"
value = "#B39DF3"
variable = "#E2E2E3"
attribute = "#76CCE0"
meta = "#FC5D7C"
builtin = "#B39DF3"
comment = "#7F8490"
