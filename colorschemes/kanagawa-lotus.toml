# UI and code colours from rebelot/kanagawa.nvim's lotus theme (lua/kanagawa/colors.lua and themes.lua), each slot taken from the lotus role the project's wave base16 port uses (bg, bg_dim, fg, fg_dim, bg_visual, syn.*, vcs.*), as no base16 or base24 Lotus exists; the ANSI 16 are its foot theme (extras/foot/kanagawa-lotus.ini).
[meta]
name = "kanagawa-lotus"
title = "Kanagawa Lotus"
family = "Kanagawa"
variant = "light"
source = "https://github.com/rebelot/kanagawa.nvim"
licence = "MIT"

[color]
paper = "#DCD5AC"
surface = "#F2ECBC"
ink = "#545464"
muted = "#43436C"
line = "#C9CBD1"
accent = "#4D699B"
danger = "#D7474B"
ok = "#6F894E"
ansi = [
  "#1F1F28", "#C84053", "#6F894E", "#77713F", "#4D699B", "#B35B79", "#597B75", "#545464",
  "#8A8980", "#D7474B", "#6E915F", "#836F4A", "#6693BF", "#624C83", "#5E857A", "#43436C",
]

[syntax]
keyword = "#624C83"
function = "#4D699B"
string = "#6F894E"
type = "#DE9800"
value = "#CC6D00"
variable = "#D7474B"
attribute = "#CC6D00"
meta = "#B35B79"
builtin = "#6693BF"
comment = "#8A8980"
